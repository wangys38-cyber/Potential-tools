[build]
builder = "dockerfile"

[deploy]
startCommand = "sh -c 'gunicorn -c gunicorn.conf.py app:app'"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

