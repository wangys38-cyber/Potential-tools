<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>牛马笔记</title>
<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/css/design-system.css">
<link rel="stylesheet" href="/static/css/polish.css">
<style>
.notes-layout {
    display: flex;
    height: calc(100vh - 52px);
    margin-top: 52px;
}
.notes-sidebar {
    width: 280px;
    border-right: 1px solid var(--ds-border-light);
    background: var(--ds-bg);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
}
.notes-sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--ds-border-light);
}
.notes-new-btn {
    width: 100%;
    padding: 10px 16px;
    background: #000;
    color: #fff;
    border: none;
    border-radius: var(--ds-radius-md);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}
.notes-new-btn:hover { background: #333; }
.notes-search {
    padding: 12px 16px;
    border-bottom: 1px solid var(--ds-border-light);
}
.notes-search input {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--ds-border);
    border-radius: var(--ds-radius-md);
    font-size: 13px;
    background: var(--ds-bg-elevated);
    color: var(--ds-text);
}
.notes-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
}
.note-item {
    padding: 12px;
    border-radius: var(--ds-radius-md);
    cursor: pointer;
    margin-bottom: 4px;
    border: 1px solid transparent;
}
.note-item:hover {
    background: var(--ds-bg-elevated);
}
.note-item.active {
    background: var(--ds-bg-elevated);
    border-color: var(--ds-border);
}
.note-item-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--ds-text);
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.note-item-preview {
    font-size: 12px;
    color: var(--ds-text-tertiary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.note-item-date {
    font-size: 11px;
    color: var(--ds-text-tertiary);
    margin-top: 4px;
}
.notes-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--ds-bg-elevated);
}
.notes-editor-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--ds-border-light);
    display: flex;
    align-items: center;
    gap: 12px;
}
.notes-title-input {
    flex: 1;
    font-size: 20px;
    font-weight: 600;
    border: none;
    background: transparent;
    color: var(--ds-text);
    outline: none;
}
.notes-toolbar {
    display: flex;
    gap: 8px;
}
.notes-toolbar button {
    padding: 6px 12px;
    background: var(--ds-bg);
    border: 1px solid var(--ds-border);
    border-radius: var(--ds-radius-sm);
    font-size: 12px;
    color: var(--ds-text);
    cursor: pointer;
}
.notes-toolbar button:hover { background: var(--ds-bg-elevated); }
.notes-toolbar .btn-danger { color: #ff3b30; border-color: #ff3b30; }
.notes-editor {
    flex: 1;
    padding: 24px;
    overflow-y: auto;
}
.notes-textarea {
    width: 100%;
    height: 100%;
    border: none;
    background: transparent;
    color: var(--ds-text);
    font-size: 15px;
    line-height: 1.8;
    resize: none;
    outline: none;
    font-family: inherit;
}
.notes-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--ds-text-tertiary);
}
.notes-empty svg {
    width: 48px;
    height: 48px;
    margin-bottom: 16px;
    opacity: 0.3;
}
.notes-empty p { font-size: 14px; }
.notes-stats {
    padding: 8px 16px;
    border-top: 1px solid var(--ds-border-light);
    font-size: 12px;
    color: var(--ds-text-tertiary);
    display: flex;
    justify-content: space-between;
}
@media (max-width: 768px) {
    .notes-sidebar { width: 240px; position: fixed; left: -240px; top: 52px; bottom: 0; z-index: 100; transition: left 0.3s; }
    .notes-sidebar.open { left: 0; }
    .notes-main { margin-left: 0; }
    .mobile-menu-btn { display: block !important; }
}
.mobile-menu-btn {
    display: none;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    color: var(--ds-text);
}
</style>
</head>
<body>
{% include '_navbar.html' %}

<div class="notes-layout">
    <aside class="notes-sidebar" id="notesSidebar">
        <div class="notes-sidebar-header">
            <button class="notes-new-btn" onclick="createNote()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                新建笔记
            </button>
        </div>
        <div class="notes-search">
            <input type="text" id="notesSearch" placeholder="搜索笔记..." oninput="renderNotes()">
        </div>
        <div class="notes-list" id="notesList"></div>
        <div class="notes-stats">
            <span id="notesCount">0 篇笔记</span>
            <span id="saveStatus">已保存</span>
        </div>
    </aside>

    <main class="notes-main">
        <div class="notes-editor-header" id="editorHeader" style="display:none;">
            <button class="mobile-menu-btn" onclick="toggleSidebar()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <input type="text" class="notes-title-input" id="noteTitle" placeholder="笔记标题..." oninput="autoSave()">
            <div class="notes-toolbar">
                <button onclick="exportNote()">导出</button>
                <button class="btn-danger" onclick="deleteNote()">删除</button>
            </div>
        </div>
        <div class="notes-editor" id="notesEditor">
            <div class="notes-empty" id="emptyState">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                <p>选择一篇笔记或新建笔记开始</p>
            </div>
            <textarea class="notes-textarea" id="noteContent" placeholder="开始记录..." style="display:none;" oninput="autoSave()"></textarea>
        </div>
    </main>
</div>

<script>
const STORAGE_KEY = (window._USER_PREFIX || '') + 'niuma_notes';
let notes = [];
let currentNoteId = null;
let saveTimer = null;

function loadNotes() {
    try {
        notes = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    } catch(e) { notes = []; }
}

function saveNotes() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
}

function renderNotes() {
    const search = document.getElementById('notesSearch').value.toLowerCase();
    const list = document.getElementById('notesList');
    const filtered = notes.filter(n =>
        n.title.toLowerCase().includes(search) ||
        n.content.toLowerCase().includes(search)
    ).sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));

    document.getElementById('notesCount').textContent = notes.length + ' 篇笔记';

    if (filtered.length === 0) {
        list.innerHTML = '<div style="padding:24px;text-align:center;color:var(--ds-text-tertiary);font-size:13px;">暂无笔记</div>';
        return;
    }

    list.innerHTML = filtered.map(n => `
        <div class="note-item ${n.id === currentNoteId ? 'active' : ''}" onclick="openNote('${n.id}')">
            <div class="note-item-title">${escapeHtml(n.title || '无标题')}</div>
            <div class="note-item-preview">${escapeHtml((n.content || '').slice(0, 50))}</div>
            <div class="note-item-date">${formatDate(n.updated_at)}</div>
        </div>
    `).join('');
}

function createNote() {
    const id = 'note_' + Date.now();
    const note = {
        id: id,
        title: '',
        content: '',
        created_at: new Date().toISOString(),
        updated_at: new Date().toISOString()
    };
    notes.unshift(note);
    saveNotes();
    openNote(id);
    renderNotes();
}

function openNote(id) {
    currentNoteId = id;
    const note = notes.find(n => n.id === id);
    if (!note) return;
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('editorHeader').style.display = 'flex';
    document.getElementById('noteContent').style.display = 'block';
    document.getElementById('noteTitle').value = note.title;
    document.getElementById('noteContent').value = note.content;
    renderNotes();
    if (window.innerWidth <= 768) toggleSidebar();
}

function autoSave() {
    if (!currentNoteId) return;
    const note = notes.find(n => n.id === currentNoteId);
    if (!note) return;
    note.title = document.getElementById('noteTitle').value;
    note.content = document.getElementById('noteContent').value;
    note.updated_at = new Date().toISOString();
    document.getElementById('saveStatus').textContent = '保存中...';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
        saveNotes();
        renderNotes();
        document.getElementById('saveStatus').textContent = '已保存';
    }, 500);
}

function deleteNote() {
    if (!currentNoteId) return;
    if (!confirm('确定删除这篇笔记吗？')) return;
    notes = notes.filter(n => n.id !== currentNoteId);
    saveNotes();
    currentNoteId = null;
    document.getElementById('emptyState').style.display = 'flex';
    document.getElementById('editorHeader').style.display = 'none';
    document.getElementById('noteContent').style.display = 'none';
    renderNotes();
}

function exportNote() {
    if (!currentNoteId) return;
    const note = notes.find(n => n.id === currentNoteId);
    if (!note) return;
    const content = `# ${note.title}\n\n${note.content}`;
    const blob = new Blob([content], {type: 'text/markdown'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (note.title || '笔记') + '.md';
    a.click();
    URL.revokeObjectURL(url);
}

function toggleSidebar() {
    document.getElementById('notesSidebar').classList.toggle('open');
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function formatDate(iso) {
    const d = new Date(iso);
    const now = new Date();
    const diff = now - d;
    if (diff < 60000) return '刚刚';
    if (diff < 3600000) return Math.floor(diff/60000) + '分钟前';
    if (diff < 86400000) return Math.floor(diff/3600000) + '小时前';
    if (diff < 604800000) return Math.floor(diff/86400000) + '天前';
    return d.toLocaleDateString('zh-CN');
}

loadNotes();
renderNotes();
</script>
</body>
</html>
