<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>离线模式 - Potential Tools</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 40px 32px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }
  .icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 20px;
    color: #86868b;
  }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
  p { font-size: 14px; color: #86868b; line-height: 1.6; margin-bottom: 24px; }
  .btn {
    display: inline-block;
    padding: 10px 24px;
    background: #000;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.8; }
  .status { font-size: 12px; color: #86868b; margin-top: 16px; }
</style>
</head>
<body>
  <div class="card">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="1" y1="1" x2="23" y2="23"/>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
      <path d="M10.71 5.05A16 16 0 0 1 22.58 9"/>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
      <line x1="12" y1="20" x2="12.01" y2="20"/>
    </svg>
    <h1>当前处于离线状态</h1>
    <p>网络连接不可用。您仍可访问已缓存的页面和本地数据，联网后将自动同步。</p>
    <button class="btn" onclick="window.location.reload()">重新连接</button>
    <div class="status" id="offlineStatus">正在检测网络状态...</div>
  </div>
  <script>
    function updateStatus() {
      var el = document.getElementById('offlineStatus');
      if (navigator.onLine) {
        el.textContent = '网络已恢复，正在重新加载...';
        setTimeout(function() { window.location.href = '/'; }, 1000);
      } else {
        el.textContent = '离线中 - 数据将在联网后自动同步';
      }
    }
    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);
    updateStatus();
  </script>
</body>
</html>
