<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>研发知识图谱 - 工具集</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231d1d1f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='3'/><circle cx='5' cy='5' r='2'/><circle cx='19' cy='5' r='2'/><circle cx='5' cy='19' r='2'/><circle cx='19' cy='19' r='2'/><line x1='7' y1='7' x2='10' y2='10'/><line x1='17' y1='7' x2='14' y2='10'/><line x1='7' y1='17' x2='10' y2='14'/><line x1='17' y1='17' x2='14' y2='14'/></svg>">
    <link rel="stylesheet" href="/static/css/theme.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/ux-enhancements.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/de-ai.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/components.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/mobile.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/design-system.css?v={{ STATIC_VERSION }}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--ds-bg);
            min-height: 100vh;
            color: var(--ds-text);
        }
        .container { max-width: 1400px; margin: 24px auto; padding: 0 20px; }
        .page-header { margin-bottom: 20px; }
        .page-title { font-size: 24px; font-weight: 700; color: var(--ds-text); margin-bottom: 6px; }
        .page-desc { font-size: 14px; color: var(--ds-text-secondary); }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--ds-bg-elevated);
            border-radius: var(--ds-radius-lg);
            padding: 16px;
            border: 1px solid var(--ds-border-light);
            text-align: center;
            box-shadow: var(--ds-shadow-sm);
        }
        .stat-value { font-size: 28px; font-weight: 700; color: var(--ds-text); }
        .stat-label { font-size: 12px; color: var(--ds-text-secondary); margin-top: 4px; }
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 16px;
            margin-bottom: 20px;
        }
        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
        }
        .graph-panel {
            background: var(--ds-bg-elevated);
            border-radius: var(--ds-radius-xl);
            border: 1px solid var(--ds-border-light);
            overflow: hidden;
            box-shadow: var(--ds-shadow-sm);
        }
        .graph-header {
            padding: 14px 20px;
            border-bottom: 1px solid var(--ds-border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .graph-title { font-size: 15px; font-weight: 600; color: var(--ds-text); }
        .graph-controls { display: flex; gap: 8px; flex-wrap: wrap; }
        .graph-container {
            position: relative;
            height: 500px;
            overflow: hidden;
            background: var(--ds-bg);
        }
        #graphCanvas { width: 100%; height: 100%; display: block; }
        .graph-legend {
            padding: 12px 20px;
            border-top: 1px solid var(--ds-border-light);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--ds-text-secondary);
        }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .panel-card {
            background: var(--ds-bg-elevated);
            border-radius: var(--ds-radius-lg);
            border: 1px solid var(--ds-border-light);
            padding: 16px;
            box-shadow: var(--ds-shadow-sm);
        }
        .panel-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--ds-text);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .query-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--ds-border);
            border-radius: var(--ds-radius-md);
            background: var(--ds-bg);
            color: var(--ds-text);
            font-size: 13px;
            font-family: inherit;
            resize: vertical;
            min-height: 60px;
            margin-bottom: 10px;
        }
        .query-input:focus { border-color: var(--ds-text); outline: none; }
        .query-result {
            margin-top: 12px;
            padding: 12px;
            background: var(--ds-bg-secondary);
            border-radius: var(--ds-radius-md);
            font-size: 13px;
            line-height: 1.7;
            color: var(--ds-text);
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .import-section { margin-bottom: 16px; }
        .import-btn {
            width: 100%;
            padding: 10px;
            background: var(--ds-accent);
            color: var(--ds-accent-text);
            border: none;
            border-radius: var(--ds-radius-md);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            margin-bottom: 8px;
        }
        .import-btn:hover { opacity: 0.9; }
        .import-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .core-nodes-list { display: flex; flex-direction: column; gap: 8px; }
        .core-node-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: var(--ds-bg-secondary);
            border-radius: var(--ds-radius-md);
            font-size: 12px;
        }
        .core-node-name { font-weight: 500; color: var(--ds-text); }
        .core-node-type { font-size: 10px; color: var(--ds-text-secondary); }
        .core-node-degree { font-weight: 600; color: var(--ds-accent); }
        .node-detail {
            position: absolute;
            background: var(--ds-bg-elevated);
            border: 1px solid var(--ds-border);
            border-radius: var(--ds-radius-md);
            padding: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            z-index: 100;
            max-width: 250px;
            display: none;
        }
        .node-detail-title { font-size: 14px; font-weight: 600; color: var(--ds-text); margin-bottom: 6px; }
        .node-detail-type { font-size: 11px; color: var(--ds-text-secondary); margin-bottom: 8px; }
        .node-detail-desc { font-size: 12px; color: var(--ds-text); line-height: 1.5; }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--ds-text-secondary);
        }
        .empty-state-icon { margin-bottom: 16px; opacity: 0.5; }
        .btn-group { display: flex; gap: 8px; }
        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: var(--ds-radius-md);
            border: 1px solid var(--ds-border);
            background: var(--ds-bg);
            color: var(--ds-text);
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-sm:hover { background: var(--ds-bg-secondary); }
        .btn-sm.primary { background: var(--ds-accent); color: var(--ds-accent-text); border-color: var(--ds-accent); }
        .loading { text-align: center; padding: 20px; color: var(--ds-text-secondary); }
    </style>
</head>
<body>
{% include '_navbar.html' %}

<div class="container">
    <div class="page-header">
        <h1 class="page-title">研发知识图谱</h1>
        <p class="page-desc">关联 Bug、需求、模块、人员，构建研发知识网络，支持智能问答和数据导入</p>
    </div>

    <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
            <div class="stat-value" id="totalNodes">-</div>
            <div class="stat-label">总节点数</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="totalRelations">-</div>
            <div class="stat-label">总关系数</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="bugCount">-</div>
            <div class="stat-label">Bug节点</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="moduleCount">-</div>
            <div class="stat-label">模块节点</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="personCount">-</div>
            <div class="stat-label">人员节点</div>
        </div>
    </div>

    <div class="main-layout">
        <div class="graph-panel">
            <div class="graph-header">
                <div class="graph-title">知识图谱可视化</div>
                <div class="graph-controls">
                    <button class="btn-sm" onclick="refreshGraph()">刷新</button>
                    <button class="btn-sm" onclick="zoomIn()">放大</button>
                    <button class="btn-sm" onclick="zoomOut()">缩小</button>
                    <button class="btn-sm" onclick="resetView()">重置</button>
                </div>
            </div>
            <div class="graph-container" id="graphContainer">
                <canvas id="graphCanvas"></canvas>
                <div class="node-detail" id="nodeDetail"></div>
            </div>
            <div class="graph-legend" id="graphLegend"></div>
        </div>

        <div class="side-panel">
            <div class="panel-card">
                <div class="panel-title">智能问答</div>
                <textarea class="query-input" id="queryInput" placeholder="输入问题，例如：哪些模块Bug最多？谁负责的Bug最多？"></textarea>
                <button class="import-btn" onclick="askQuestion()" id="askBtn">提问</button>
                <div class="query-result" id="queryResult" style="display:none;"></div>
            </div>

            <div class="panel-card">
                <div class="panel-title">数据导入</div>
                <div class="import-section">
                    <button class="import-btn" onclick="importFromCRAnalysis()" id="importBtn">从 CR 分析导入</button>
                    <p style="font-size:11px;color:var(--ds-text-secondary);line-height:1.5;">导入最近的 CR 分析结果，自动创建 Bug、模块、人员节点及关联关系</p>
                </div>
            </div>

            <div class="panel-card">
                <div class="panel-title">核心节点（度数最高）</div>
                <div class="core-nodes-list" id="coreNodesList">
                    <div style="text-align:center;color:var(--ds-text-secondary);font-size:12px;">暂无数据</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/static/js/components.js?v={{ STATIC_VERSION }}"></script>
<script src="/static/js/knowledge_graph.js?v={{ STATIC_VERSION }}"></script>
</body>
</html>
