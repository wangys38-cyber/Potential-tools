<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>研发知识图谱 - 工具集</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231d1d1f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='3'/><circle cx='5' cy='5' r='2'/><circle cx='19' cy='5' r='2'/><circle cx='5' cy='19' r='2'/><circle cx='19' cy='19' r='2'/><line x1='7' y1='7' x2='10' y2='10'/><line x1='17' y1='7' x2='14' y2='10'/><line x1='7' y1='17' x2='10' y2='14'/><line x1='17' y1='17' x2='14' y2='14'/></svg>">
    <link rel="stylesheet" href="/static/css/theme.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/ux-enhancements.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/de-ai.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/components.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/mobile.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/design-system.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/perf-mobile.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/ui-polish.css?v={{ STATIC_VERSION }}">
    
<link rel="stylesheet" href="/static/css/page/knowledge_graph.css?v={{ STATIC_VERSION }}">
</head>
<body>
{% include '_navbar.html' %}

<div class="container">
    <div class="page-header">
        <h1 class="page-title">研发知识图谱</h1>
        <p class="page-desc">关联 Bug、需求、模块、人员，构建研发知识网络，支持智能抽取、推理、问答和导出</p>
    </div>

    <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
            <div class="stat-value" id="totalNodes">-</div>
            <div class="stat-label">总节点数</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="totalRelations">-</div>
            <div class="stat-label">总关系数</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="bugCount">-</div>
            <div class="stat-label">Bug节点</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="moduleCount">-</div>
            <div class="stat-label">模块节点</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="personCount">-</div>
            <div class="stat-label">人员节点</div>
        </div>
    </div>

    <div class="main-layout">
        <div class="graph-panel">
            <div class="graph-header">
                <div class="graph-title">知识图谱可视化</div>
                <div class="graph-controls">
                    <input type="text" id="graphSearch" class="graph-search-input" placeholder="搜索节点..." oninput="KnowledgeGraph.searchNodes(this.value)" style="width:140px;padding:6px 10px;border:1px solid var(--ds-border);border-radius:var(--ds-radius-md);font-size:12px;background:var(--ds-bg);color:var(--ds-text);">
                    <button class="btn-sm primary" onclick="KnowledgeGraph.openCreateNodeModal()">新建节点</button>
                    <button class="btn-sm primary" onclick="KnowledgeGraph.openCreateRelationModal()">新建关系</button>
                    <button class="btn-sm" onclick="KnowledgeGraph.refreshGraph()">刷新</button>
                    <button class="btn-sm" onclick="KnowledgeGraph.zoomIn()">放大</button>
                    <button class="btn-sm" onclick="KnowledgeGraph.zoomOut()">缩小</button>
                    <button class="btn-sm" onclick="KnowledgeGraph.resetView()">重置</button>
                    <button class="btn-sm" onclick="KnowledgeGraph.exportPNG()">导出PNG</button>
                    <button class="btn-sm" onclick="KnowledgeGraph.clearHighlight()">清除高亮</button>
                </div>
            </div>
            <div class="graph-container" id="graphContainer">
                <canvas id="graphCanvas"></canvas>
                <div class="node-detail" id="nodeDetail"></div>
                <div class="highlight-info" id="highlightInfo"></div>
            </div>
            <div class="graph-legend" id="graphLegend"></div>
        </div>

        <div class="side-panel">
            <!-- 智能问答 -->
            <div class="panel-card">
                <div class="panel-title">智能问答（多跳推理）</div>
                <textarea class="query-input" id="queryInput" placeholder="输入问题，例如：谁负责的Bug最多，这些Bug主要在哪些模块？"></textarea>
                <button class="import-btn" onclick="KnowledgeGraph.askQuestion()" id="askBtn">提问</button>
                <div class="query-result" id="queryResult" style="display:none;"></div>
                <div class="reasoning-trace" id="reasoningTrace" style="display:none;">
                    <div class="reasoning-trace-title">推理溯源</div>
                    <div id="reasoningContent"></div>
                </div>
                <div class="qa-history" id="qaHistory">
                    <div style="font-size:11px;color:var(--ds-text-secondary);margin-bottom:4px;">历史提问</div>
                    <div id="historyList"></div>
                </div>
            </div>

            <!-- 知识推理 -->
            <div class="panel-card">
                <div class="panel-title">知识推理</div>
                <div class="reasoning-tabs">
                    <div class="reasoning-tab active" onclick="KnowledgeGraph.switchReasoningTab('association')">关联推理</div>
                    <div class="reasoning-tab" onclick="KnowledgeGraph.switchReasoningTab('path')">路径分析</div>
                    <div class="reasoning-tab" onclick="KnowledgeGraph.switchReasoningTab('cluster')">聚类分析</div>
                    <div class="reasoning-tab" onclick="KnowledgeGraph.switchReasoningTab('impact')">影响分析</div>
                </div>
                <div class="reasoning-content active" id="tab-association">
                    <div class="reasoning-form">
                        <select class="reasoning-select" id="assocNodeSelect"></select>
                        <select class="reasoning-select" id="assocDepthSelect">
                            <option value="1">1跳（直接关联）</option>
                            <option value="2">2跳（间接关联）</option>
                            <option value="3">3跳</option>
                        </select>
                        <button class="import-btn" onclick="KnowledgeGraph.associationReasoning()">开始推理</button>
                    </div>
                    <div class="reasoning-result" id="assocResult" style="display:none;"></div>
                </div>
                <div class="reasoning-content" id="tab-path">
                    <div class="reasoning-form">
                        <select class="reasoning-select" id="pathStartSelect"></select>
                        <select class="reasoning-select" id="pathEndSelect"></select>
                        <button class="import-btn" onclick="KnowledgeGraph.pathAnalysis()">查找路径</button>
                    </div>
                    <div class="reasoning-result" id="pathResult" style="display:none;"></div>
                </div>
                <div class="reasoning-content" id="tab-cluster">
                    <div class="reasoning-form">
                        <button class="import-btn" onclick="KnowledgeGraph.clusterAnalysis()">自动聚类</button>
                    </div>
                    <div class="reasoning-result" id="clusterResult" style="display:none;"></div>
                </div>
                <div class="reasoning-content" id="tab-impact">
                    <div class="reasoning-form">
                        <select class="reasoning-select" id="impactNodeSelect"></select>
                        <button class="import-btn" onclick="KnowledgeGraph.impactAnalysis()">分析影响</button>
                    </div>
                    <div class="reasoning-result" id="impactResult" style="display:none;"></div>
                </div>
            </div>

            <!-- 数据导入与抽取 -->
            <div class="panel-card">
                <div class="panel-title">数据导入与抽取</div>
                <div class="import-section">
                    <button class="import-btn" onclick="KnowledgeGraph.importFromCRAnalysis()" id="importBtn">从 CR 分析导入</button>
                    <button class="import-btn" onclick="KnowledgeGraph.openExtractModal('cr_analysis')">AI抽取（CR分析）</button>
                    <button class="import-btn" onclick="KnowledgeGraph.openExtractModal('log')">AI抽取（日志）</button>
                    <button class="import-btn" onclick="KnowledgeGraph.openExtractModal('meeting')">AI抽取（会议纪要）</button>
                    <p style="font-size:11px;color:var(--ds-text-secondary);line-height:1.5;">AI自动从文本中抽取实体和关系，预览确认后添加到图谱</p>
                </div>
            </div>

            <!-- 导出 -->
            <div class="panel-card">
                <div class="panel-title">知识导出</div>
                <div class="export-row">
                    <label>格式</label>
                    <select class="export-select" id="exportFormat">
                        <option value="json">JSON</option>
                        <option value="graphml">GraphML (Gephi/yEd)</option>
                        <option value="csv">CSV (节点+关系)</option>
                    </select>
                </div>
                <div class="export-row">
                    <label>范围</label>
                    <select class="export-select" id="exportScope">
                        <option value="all">全部图谱</option>
                        <option value="subgraph">选中节点子图</option>
                    </select>
                </div>
                <button class="import-btn" onclick="KnowledgeGraph.exportGraph()">导出数据</button>
            </div>

            <!-- 核心节点 -->
            <div class="panel-card">
                <div class="panel-title">核心节点（度数最高）</div>
                <div class="core-nodes-list" id="coreNodesList">
                    <div style="text-align:center;color:var(--ds-text-secondary);font-size:12px;">暂无数据</div>
                </div>
            </div>
        </div>
    </div>
</div>


<!-- 新建节点弹窗 -->
<div class="modal-overlay" id="createNodeModal">
    <div class="modal" style="max-width:480px;">
        <div class="modal-header">
            <div class="modal-title">新建节点</div>
            <button class="modal-close" onclick="KnowledgeGraph.closeCreateNodeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div style="margin-bottom:12px;">
                <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">节点类型</label>
                <select id="newNodeType" class="reasoning-select"></select>
            </div>
            <div style="margin-bottom:12px;">
                <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">节点名称</label>
                <input type="text" id="newNodeName" class="reasoning-select" placeholder="输入节点名称" style="width:100%;">
            </div>
            <div style="margin-bottom:12px;">
                <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">描述（可选）</label>
                <textarea id="newNodeDesc" class="reasoning-select" placeholder="输入节点描述" style="width:100%;min-height:80px;resize:vertical;"></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-sm" onclick="KnowledgeGraph.closeCreateNodeModal()">取消</button>
            <button class="btn-sm primary" onclick="KnowledgeGraph.createNode()">创建</button>
        </div>
    </div>
</div>

<!-- 新建关系弹窗 -->
<div class="modal-overlay" id="createRelationModal">
    <div class="modal" style="max-width:480px;">
        <div class="modal-header">
            <div class="modal-title">新建关系</div>
            <button class="modal-close" onclick="KnowledgeGraph.closeCreateRelationModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div style="margin-bottom:12px;">
                <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">源节点</label>
                <select id="relSourceSelect" class="reasoning-select"></select>
            </div>
            <div style="margin-bottom:12px;">
                <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">关系类型</label>
                <select id="relTypeSelect" class="reasoning-select"></select>
            </div>
            <div style="margin-bottom:12px;">
                <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">目标节点</label>
                <select id="relTargetSelect" class="reasoning-select"></select>
            </div>
            <div style="margin-bottom:12px;">
                <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">描述（可选）</label>
                <input type="text" id="relDesc" class="reasoning-select" placeholder="输入关系描述" style="width:100%;">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-sm" onclick="KnowledgeGraph.closeCreateRelationModal()">取消</button>
            <button class="btn-sm primary" onclick="KnowledgeGraph.createRelation()">创建</button>
        </div>
    </div>
</div>

<!-- 抽取预览弹窗 -->
<div class="modal-overlay" id="extractModal">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title">知识抽取预览</div>
            <button class="modal-close" onclick="KnowledgeGraph.closeExtractModal()">&times;</button>
        </div>
        <div class="modal-body" id="extractModalBody">
            <div class="loading">AI正在抽取实体和关系...</div>
        </div>
        <div class="modal-footer">
            <button class="btn-sm" onclick="KnowledgeGraph.closeExtractModal()">取消</button>
            <button class="btn-sm primary" onclick="KnowledgeGraph.confirmExtraction()" id="confirmExtractBtn">确认添加</button>
        </div>
    </div>
</div>

<script src="/static/js/components.js?v={{ STATIC_VERSION }}"></script>
<script src="/static/js/perf-utils.js?v={{ STATIC_VERSION }}"></script>
<script src="/static/js/ui-polish.js?v={{ STATIC_VERSION }}"></script>
<script src="/static/js/knowledge_graph.js?v={{ STATIC_VERSION }}"></script>
</body>
</html>
