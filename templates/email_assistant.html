<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邮件助手</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%231d1d1f%22 stroke-width=%222%22><path d=%22M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z%22/><polyline points=%2222,6 12,13 2,6%22/></svg>">
    <link rel="stylesheet" href="/static/css/theme.css?v={{ STATIC_VERSION }}">
    

    <link rel="stylesheet" href="/static/css/ux-enhancements.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/de-ai.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/components.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/mobile.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/design-system.css?v={{ STATIC_VERSION }}">
<link rel="stylesheet" href="/static/css/page/email_assistant.css?v={{ STATIC_VERSION }}">
</head>
<body>
{% include '_navbar.html' %}

    <div class="container">
        <div class="sidebar">
            <div class="sidebar-title">邮件模板</div>
            <div class="template-list" id="templateList"></div>
        </div>
        <div class="main-panel">
            <div class="page-header">
                <h1>邮件助手</h1>
            </div>
            <div class="form-card">
                <div class="form-title" id="formTitle">填写邮件信息</div>
                <div id="formFields"></div>
                <div class="actions">
                    <button class="btn btn-primary" onclick="generateEmail()">生成邮件</button>
                    <button class="btn" onclick="clearForm()">清空</button>
                </div>
            </div>
            <div class="preview-card" id="previewCard">
                <div class="preview-header">
                    <div class="preview-title">邮件预览</div>
                    <div style="display:flex;gap:12px;align-items:center;">
                        <div class="lang-toggle">
                            <button class="lang-btn active" data-lang="en" onclick="switchLang('en')">EN</button>
                            <button class="lang-btn" data-lang="zh" onclick="switchLang('zh')">中文</button>
                        </div>
                        <button class="btn" style="padding:6px 14px;font-size:13px;" onclick="copyEmail()">复制</button>
                    </div>
                </div>
                <div class="preview-body" id="previewBody"></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    
    <script src="/static/js/v5-ux.js?v={{ STATIC_VERSION }}"></script>
    <script src="/static/js/v5-sync.js?v={{ STATIC_VERSION }}"></script>
    <script src="/static/js/components.js?v={{ STATIC_VERSION }}"></script>
    <script src="/static/js/ux-enhancements.js?v={{ STATIC_VERSION }}"></script>
<script src="/static/js/page/email_assistant.js?v={{ STATIC_VERSION }}"></script>
</body>
</html>
