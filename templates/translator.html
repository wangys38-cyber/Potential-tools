<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT 技术文档翻译器 - Potential Tools</title>
    <link rel="stylesheet" href="/static/css/theme.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/ux-enhancements.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/translator.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/de-ai.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/components.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/mobile.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/design-system.css?v={{ STATIC_VERSION }}">
</head>
<body>
{% include '_navbar.html' %}

<div class="translator-container">
    <!-- 顶部语言选择栏 -->
    <div class="lang-bar">
        <div class="lang-select-group">
            <select id="sourceLang" class="lang-select" title="源语言">
                <option value="auto">自动检测</option>
                <option value="zh">中文</option>
                <option value="en">英语</option>
                <option value="ja">日语</option>
                <option value="ko">韩语</option>
                <option value="fr">法语</option>
                <option value="de">德语</option>
                <option value="es">西班牙语</option>
                <option value="ru">俄语</option>
                <option value="pt">葡萄牙语</option>
                <option value="it">意大利语</option>
            </select>
        </div>

        <button class="swap-btn" id="swapBtn" title="交换语言">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="17 1 21 5 17 9"/>
                <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                <polyline points="7 23 3 19 7 15"/>
                <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
            </svg>
        </button>

        <div class="lang-select-group">
            <select id="targetLang" class="lang-select" title="目标语言">
                <option value="zh">中文</option>
                <option value="en">英语</option>
                <option value="ja">日语</option>
                <option value="ko">韩语</option>
                <option value="fr">法语</option>
                <option value="de">德语</option>
                <option value="es">西班牙语</option>
                <option value="ru">俄语</option>
                <option value="pt">葡萄牙语</option>
                <option value="it">意大利语</option>
            </select>
        </div>

        <div class="lang-bar-spacer"></div>

        <button class="settings-toggle" id="settingsToggle" title="高级设置">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
        </button>
    </div>

    <!-- 高级设置面板（默认折叠） -->
    <div class="advanced-panel" id="advancedPanel" style="display:none;">
        <div class="advanced-row">
            <label class="switch-label">
                <input type="checkbox" id="itMode" checked>
                <span class="switch-track"><span class="switch-thumb"></span></span>
                <span class="switch-text">IT 技术文档模式</span>
            </label>
            <label class="switch-label">
                <input type="checkbox" id="streamMode" checked>
                <span class="switch-track"><span class="switch-thumb"></span></span>
                <span class="switch-text">流式输出</span>
            </label>
        </div>
        <div class="advanced-row">
            <div class="glossary-upload">
                <label class="upload-label" for="glossaryFile">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    <span>上传术语库 CSV</span>
                </label>
                <input type="file" id="glossaryFile" accept=".csv" style="display:none;">
                <span class="glossary-status" id="glossaryStatus">未加载</span>
                <button class="clear-glossary" id="clearGlossary" style="display:none;" title="清除术语库">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- 双栏翻译区 -->
    <div class="translator-panels">
        <!-- 左侧：原文输入 -->
        <div class="panel source-panel">
            <div class="panel-header">
                <span class="panel-title">原文</span>
                <div class="panel-actions">
                    <span class="char-count" id="sourceCharCount">0 字</span>
                    <button class="icon-btn" id="clearBtn" title="清空">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                    </button>
                </div>
            </div>
            <textarea id="sourceText" class="translator-textarea" placeholder="输入要翻译的文本，支持 Markdown、代码块..." spellcheck="false"></textarea>
            <div class="panel-footer">
                <button class="translate-btn primary" id="translateBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 8l6 6"/>
                        <path d="M4 14l6-6 2-3"/>
                        <path d="M2 5h12"/>
                        <path d="M7 2h1"/>
                        <path d="M22 22l-5-10-5 10"/>
                        <path d="M14 18h6"/>
                    </svg>
                    <span>翻译</span>
                </button>
            </div>
        </div>

        <!-- 右侧：译文输出 -->
        <div class="panel target-panel">
            <div class="panel-header">
                <span class="panel-title">译文</span>
                <div class="panel-actions">
                    <span class="char-count" id="targetCharCount">0 字</span>
                    <button class="icon-btn" id="copyBtn" title="复制译文">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                        </svg>
                    </button>
                    <button class="icon-btn" id="exportBtn" title="导出译文">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div id="targetText" class="translator-output" contenteditable="false">
                <span class="output-placeholder">译文将显示在这里</span>
            </div>
            <div class="panel-footer">
                <span class="status-text" id="statusText"></span>
            </div>
        </div>
    </div>

    <!-- 翻译历史 -->
    <div class="history-section">
        <div class="history-header">
            <span class="history-title">翻译历史</span>
            <button class="history-clear" id="historyClear">清除</button>
        </div>
        <div class="history-list" id="historyList">
            <div class="history-empty">暂无翻译记录</div>
        </div>
    </div>

    <!-- 底部隐私声明 -->
    <div class="privacy-notice">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span>不保存任何原文和译文内容，所有翻译仅在本次会话中处理</span>
    </div>
</div>

<!-- Toast 提示 -->
<div class="toast" id="toast"></div>

<script src="/static/js/translator.js?v={{ STATIC_VERSION }}"></script>
</body>
</html>
