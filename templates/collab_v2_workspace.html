<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ workspace.title }} - 协作工作空间</title>
    <link rel="stylesheet" href="/static/css/theme.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/ux-enhancements.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/de-ai.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/components.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/mobile.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/design-system.css?v={{ STATIC_VERSION }}">
    
<link rel="stylesheet" href="/static/css/page/collab_v2_workspace.css?v={{ STATIC_VERSION }}">
</head>
<body>
{% include '_navbar.html' %}

<div class="cv2-container">
    <!-- 头部 -->
    <div class="cv2-card">
        <div class="cv2-header">
            <div>
                <div class="cv2-title">{{ workspace.title }}</div>
                <div class="cv2-meta">
                    <div class="cv2-meta-item">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                        <span>{{ share_code }}</span>
                    </div>
                    <div class="cv2-meta-item">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                        <span>{{ workspace.tool_type or '通用' }}</span>
                    </div>
                </div>
            </div>
            <div class="cv2-actions">
                <button class="cv2-btn" onclick="PTCollabV2._copyLink()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    复制链接
                </button>
                <button class="cv2-btn primary" onclick="document.getElementById('ptOnlineAvatars').scrollIntoView({behavior:'smooth'})">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    协作
                </button>
            </div>
        </div>
        <!-- 在线协作者 -->
        <div style="margin-top:16px;padding-top:14px;border-top:1px solid #f5f5f7;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
            <div id="ptOnlineAvatars">
                <span style="font-size:12px;color:#86868b;">加载中...</span>
            </div>
            <div id="ptEditingStatus"></div>
        </div>
    </div>

    <!-- Tab 内容区 -->
    <div class="cv2-card">
        <div class="cv2-tabs">
            <button class="cv2-tab active" onclick="PTCollabV2._switchTab('comments')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                评论
            </button>
            <button class="cv2-tab" onclick="PTCollabV2._switchTab('members')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px;"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                成员与权限
            </button>
            <button class="cv2-tab" onclick="PTCollabV2._switchTab('activity')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px;"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg>
                活动记录
            </button>
            <button class="cv2-tab" onclick="PTCollabV2._switchTab('security')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                分享设置
            </button>
        </div>

        <!-- 评论面板 -->
        <div class="cv2-tab-panel active" id="cv2PanelComments">
            <div class="cv2-comment-input-area">
                <textarea class="cv2-comment-input" id="ptCommentInputV2" placeholder="输入评论，使用 @ 提及协作者..." rows="1"></textarea>
                <button class="cv2-btn primary" id="ptCommentSendV2" style="align-self:flex-start;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    发送
                </button>
            </div>
            <div class="comment-filter-bar" id="cv2CommentFilterBar">
                <button class="comment-filter-btn active" data-filter="all" onclick="PTCollabV2._filterComments(this,'all')">全部</button>
                <button class="comment-filter-btn" data-filter="unresolved" onclick="PTCollabV2._filterComments(this,'unresolved')">未解决</button>
                <button class="comment-filter-btn" data-filter="resolved" onclick="PTCollabV2._filterComments(this,'resolved')">已解决</button>
                <button class="comment-filter-btn" data-filter="mine" onclick="PTCollabV2._filterComments(this,'mine')">我的</button>
                <button class="comment-filter-btn" data-filter="mentioned" onclick="PTCollabV2._filterComments(this,'mentioned')">@我的</button>
                <select class="comment-sort-select" id="cv2CommentSort" onchange="PTCollabV2._sortComments(this.value)">
                    <option value="asc">时间正序</option>
                    <option value="desc">时间倒序</option>
                    <option value="unresolved_first">未解决优先</option>
                </select>
            </div>
            <div id="ptCommentsListV2">
                <div class="cv2-empty">加载中...</div>
            </div>
        </div>

        <!-- 成员与权限面板 -->
        <div class="cv2-tab-panel" id="cv2PanelMembers">
            <div id="ptMembersListV2">
                <div class="cv2-empty">加载中...</div>
            </div>
        </div>

        <!-- 活动记录面板 -->
        <div class="cv2-tab-panel" id="cv2PanelActivity">
            <div class="cv2-filter-row">
                <button class="cv2-filter-btn active" onclick="PTCollabV2._filterActivity(this, '')">全部</button>
                <button class="cv2-filter-btn" onclick="PTCollabV2._filterActivity(this, 'comment')">评论</button>
                <button class="cv2-filter-btn" onclick="PTCollabV2._filterActivity(this, 'permission_change')">权限变更</button>
                <button class="cv2-filter-btn" onclick="PTCollabV2._filterActivity(this, 'member_remove')">成员变动</button>
                <button class="cv2-filter-btn" onclick="PTCollabV2._filterActivity(this, 'security_update')">安全设置</button>
            </div>
            <div id="ptActivityList">
                <div class="cv2-empty">加载中...</div>
            </div>
        </div>

        <!-- 分享设置面板 -->
        <div class="cv2-tab-panel" id="cv2PanelSecurity">
            <div class="cv2-security-row">
                <span class="cv2-security-label">访问密码</span>
                <input type="text" class="cv2-security-input" id="cv2Password" placeholder="留空表示无密码" value="{{ workspace.password or '' }}">
            </div>
            <div class="cv2-security-row">
                <span class="cv2-security-label">访问次数</span>
                <input type="number" class="cv2-security-input" id="cv2AccessLimit" placeholder="0 表示不限" value="{{ workspace.access_limit or 0 }}" min="0" style="width:120px;">
                <span style="font-size:12px;color:#86868b;">已访问 {{ workspace.access_count or 0 }} 次</span>
            </div>
            <div class="cv2-security-row">
                <span class="cv2-security-label">过期时间</span>
                <select class="cv2-security-input" id="cv2Expires" style="width:160px;">
                    <option value="0">永久有效</option>
                    <option value="1">1 天后</option>
                    <option value="7">7 天后</option>
                </select>
            </div>
            <div style="margin-top:16px;">
                <button class="cv2-btn primary" onclick="PTCollabV2._saveSecurity()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                    保存设置
                </button>
            </div>
        </div>
    </div>
</div>

<script src="/static/js/collab-v2.js?v={{ STATIC_VERSION }}"></script>

<script>
window.__PD__ = {
    share_code: {{ share_code|tojson }},
};
</script>
<script src="/static/js/page/collab_v2_workspace.js?v={{ STATIC_VERSION }}"></script>
</body>
</html>
