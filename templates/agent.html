<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent - Potential Tools 9.0</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0D0E12;
            color: #F5F5F7;
            min-height: 100vh;
        }

        /* 顶部导航栏 */
        .top-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(13, 14, 18, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .nav-left { display: flex; align-items: center; gap: 16px; }
        .nav-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 10px;
            transition: all 0.2s;
        }
        .nav-back:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }
        .nav-back svg {
            opacity: 0.9;
            flex-shrink: 0;
        }
        .nav-divider {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.12);
        }
        .nav-title {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.3px;
        }
        .nav-right { display: flex; align-items: center; gap: 10px; }

        /* 主容器 */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 48px 32px 80px;
        }

        /* 头部 */
        .header {
            text-align: center;
            margin-bottom: 48px;
        }
        .header h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #fff 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 15px;
        }

        /* 按钮 */
        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            color: #fff;
            box-shadow: 0 4px 16px rgba(139, 92, 246, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
        }
        .btn-primary:disabled {
            background: rgba(139, 92, 246, 0.4);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* 输入区域 */
        .input-area {
            background: linear-gradient(180deg, #1A1D24 0%, #15171D 100%);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid rgba(139, 92, 246, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(139, 92, 246, 0.05) inset;
            margin-bottom: 48px;
            position: relative;
        }
        .input-area::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 20%;
            right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(139, 92, 246, 0.5), transparent);
        }
        .input-area textarea {
            width: 100%;
            min-height: 120px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 16px;
            font-size: 15px;
            color: #F5F5F7;
            resize: vertical;
            font-family: inherit;
            line-height: 1.6;
            transition: all 0.2s;
        }
        .input-area textarea::placeholder {
            color: rgba(255, 255, 255, 0.55);
        }
        .input-area textarea:focus {
            outline: none;
            border-color: rgba(139, 92, 246, 0.5);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
            background: rgba(0, 0, 0, 0.4);
        }
        .input-area .actions {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 16px;
            gap: 16px;
            flex-wrap: wrap;
        }

        /* 快捷标签 */
        .examples {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .example-tag {
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 980px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.75);
            cursor: pointer;
            transition: all 0.2s;
        }
        .example-tag:hover {
            background: rgba(139, 92, 246, 0.15);
            border-color: rgba(139, 92, 246, 0.3);
            color: #c4b5fd;
        }
        .example-tag.save-memory {
            background: rgba(34, 197, 94, 0.1);
            border-color: rgba(34, 197, 94, 0.2);
            color: #86efac;
        }
        .example-tag.save-memory:hover {
            background: rgba(34, 197, 94, 0.2);
            border-color: rgba(34, 197, 94, 0.4);
        }

        /* 结果区域 */
        .result-area {
            background: #1A1D24;
            border-radius: 20px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 48px;
            display: none;
        }
        .result-area h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #fff;
            font-weight: 600;
        }

        /* 步骤卡片 */
        .step {
            border-left: 3px solid rgba(255, 255, 255, 0.15);
            padding: 14px 18px;
            margin-bottom: 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 0 12px 12px 0;
            transition: all 0.2s;
        }
        .step:hover {
            background: rgba(0, 0, 0, 0.3);
        }
        .step.completed { border-left-color: #22c55e; }
        .step.failed { border-left-color: #ef4444; }
        .step.running { border-left-color: #f59e0b; }
        .step.pending { border-left-color: rgba(255, 255, 255, 0.2); opacity: 0.6; }
        .step.needs_confirmation { border-left-color: #f59e0b; }
        .step .step-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .step .tool-name {
            font-weight: 600;
            font-size: 14px;
            color: #fff;
        }
        .step .status-badge {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 980px;
            font-weight: 500;
        }
        .status-completed { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
        .status-failed { background: rgba(239, 68, 68, 0.15); color: #f87171; }
        .status-running { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
        .status-pending { background: rgba(255, 255, 255, 0.08); color: rgba(255, 255, 255, 0.5); }
        .status-needs_confirmation { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
        .step .reasoning {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 8px;
            line-height: 1.5;
        }
        .step .result {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 16px;
            border-radius: 10px;
            margin-top: 8px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.7;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .step .error {
            font-size: 13px;
            color: #f87171;
        }

        /* 确认区域 */
        .confirm-area {
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid rgba(245, 158, 11, 0.25);
            border-radius: 14px;
            padding: 18px;
            margin: 12px 0;
        }
        .confirm-area p {
            margin-bottom: 14px;
            font-size: 14px;
            color: #fbbf24;
        }
        .confirm-buttons {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        /* 工具列表区域 */
        .tools-section {
            margin-top: 64px;
        }
        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.45);
            margin-bottom: 24px;
        }
        .section-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(139, 92, 246, 0.4) 20%, rgba(139, 92, 246, 0.6) 50%, rgba(139, 92, 246, 0.4) 80%, transparent 100%);
            margin-bottom: 24px;
            position: relative;
        }
        .section-divider::after {
            content: '';
            position: absolute;
            top: -1px;
            left: 40%;
            right: 40%;
            height: 3px;
            background: radial-gradient(ellipse at center, rgba(139, 92, 246, 0.3) 0%, transparent 70%);
            filter: blur(2px);
        }
        .tools-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px;
        }
        .tool-card {
            background: linear-gradient(180deg, #1A1D24 0%, #17191F 100%);
            border-radius: 14px;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.25s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .tool-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
        }
        .tool-card:hover {
            transform: translateY(-4px);
            border-color: rgba(139, 92, 246, 0.5);
            background: linear-gradient(180deg, #22252E 0%, #1C1F27 100%);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(139, 92, 246, 0.2), 0 0 20px rgba(139, 92, 246, 0.1);
        }
        .tool-card:hover .tool-name {
            color: #c4b5fd;
        }
        .tool-card:hover .tool-cat {
            background: rgba(139, 92, 246, 0.2);
            color: #c4b5fd;
        }
        .tool-card .tool-name {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
            color: #fff;
        }
        .tool-card .tool-desc {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.55);
            line-height: 1.6;
            margin-bottom: 12px;
        }
        .tool-card .tool-meta {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tool-card .tool-cat {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 980px;
            background: rgba(139, 92, 246, 0.12);
            color: #a78bfa;
            font-weight: 500;
        }
        .tool-card .tool-confirm {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 980px;
            background: rgba(245, 158, 11, 0.12);
            color: #fbbf24;
            font-weight: 500;
        }

        /* 记忆面板 */
        #memoryPanel {
            display: none;
            background: #1A1D24;
            border-radius: 20px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 48px;
        }
        #memoryPanel h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #fff;
            font-weight: 600;
        }
        .memory-filters {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .memory-filters select,
        .memory-filters input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 13px;
            color: #F5F5F7;
            font-family: inherit;
        }
        .memory-filters select:focus,
        .memory-filters input:focus {
            outline: none;
            border-color: rgba(139, 92, 246, 0.5);
        }
        .memory-filters input {
            flex: 1;
            min-width: 200px;
        }
        #memoryList {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        .memory-item {
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            margin-bottom: 10px;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }
        .memory-item-content { flex: 1; }
        .memory-item-type {
            font-size: 11px;
            color: #a78bfa;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .memory-item-text {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
        }
        .memory-item-meta {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 6px;
        }
        .memory-delete-btn {
            background: none;
            border: none;
            color: rgba(239, 68, 68, 0.6);
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
            transition: all 0.2s;
        }
        .memory-delete-btn:hover {
            color: #ef4444;
        }
        .memory-add-section {
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        .memory-add-section h3 {
            font-size: 14px;
            margin-bottom: 12px;
            color: rgba(255, 255, 255, 0.8);
        }
        .memory-add-form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .memory-add-form select,
        .memory-add-form input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 13px;
            color: #F5F5F7;
            font-family: inherit;
        }
        .memory-add-form input {
            flex: 1;
            min-width: 200px;
        }

        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top: 2px solid #a78bfa;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 滚动条 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* 复选框 */
        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #8b5cf6;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <div class="top-nav">
        <div class="nav-left">
            <a href="/" class="nav-back">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                返回工作台
            </a>
            <div class="nav-divider"></div>
            <span class="nav-title">🤖 AI Agent 2.0</span>
        </div>
        <div class="nav-right">
            <button class="btn btn-secondary" onclick="toggleMemoryPanel()">🧠 记忆管理</button>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h1>AI Agent 指挥中心</h1>
            <p>自主任务规划 · 多工具调用 · 智能执行</p>
        </div>

        <!-- 输入区域 -->
        <div class="input-area">
            <textarea id="taskInput" placeholder="描述你想完成的任务，例如：查询 Santos 项目状态，生成日报并发送给团队..."></textarea>
            <div class="actions">
                <div class="examples">
                    <span class="example-tag" onclick="setExample('查询 EKSANTOS 项目状态并生成日报')">📊 生成项目日报</span>
                    <span class="example-tag" onclick="setExample('查询项目状态，生成报告并同步到牛马笔记')">📝 同步到笔记</span>
                    <span class="example-tag" onclick="setExample('在知识库中搜索 CR 分析方法')">🔍 知识库搜索</span>
                    <span class="example-tag save-memory" onclick="saveCurrentAsMemory()">💾 保存为记忆</span>
                </div>
                <button class="btn btn-primary" id="runBtn" onclick="runAgent()">🚀 执行任务</button>
            </div>
        </div>

        <!-- 记忆管理面板 -->
        <div id="memoryPanel">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                <h2>🧠 记忆管理</h2>
                <button class="btn btn-secondary" onclick="toggleMemoryPanel()" style="font-size:12px;padding:6px 12px;">✕ 关闭</button>
            </div>
            <div class="memory-filters">
                <select id="memoryTypeFilter" onchange="loadMemories()">
                    <option value="">全部类型</option>
                    <option value="instruction">常用指令</option>
                    <option value="preference">偏好设置</option>
                    <option value="contact">常用联系人</option>
                    <option value="project">项目相关</option>
                    <option value="other">其他</option>
                </select>
                <input type="text" id="memorySearch" placeholder="搜索记忆..." oninput="searchMemories()">
            </div>
            <div id="memoryList"></div>
            <div class="memory-add-section">
                <h3>➕ 添加新记忆</h3>
                <div class="memory-add-form">
                    <select id="newMemoryType">
                        <option value="instruction">常用指令</option>
                        <option value="preference">偏好设置</option>
                        <option value="contact">常用联系人</option>
                        <option value="project">项目相关</option>
                        <option value="other">其他</option>
                    </select>
                    <input type="text" id="newMemoryContent" placeholder="记忆内容...">
                    <button class="btn btn-primary" onclick="addMemory()">添加</button>
                </div>
            </div>
        </div>

        <!-- 结果区域 -->
        <div class="result-area" id="resultArea">
            <h2>执行结果</h2>
            <div id="stepsContainer"></div>
        </div>

        <!-- 可用工具区域 -->
        <div class="tools-section">
            <div class="section-title">
                <span>⚡ 支持的原子能力</span>
            </div>
            <p class="section-subtitle">Agent 可自主调用以下工具完成复杂任务</p>
            <div class="section-divider"></div>
            <div class="tools-list" id="toolsList"></div>
        </div>
    </div>

    <script>
        let currentAgentId = null;
        let currentCtx = null;

        // 加载工具列表
        async function loadTools() {
            try {
                const resp = await fetch('/api/agent/tools');
                const tools = await resp.json();
                const list = document.getElementById('toolsList');
                list.innerHTML = tools.map(t => `
                    <div class="tool-card" onclick="setExample('使用 ${t.name} 工具')">
                        <div class="tool-name">${t.name}</div>
                        <div class="tool-desc">${t.description}</div>
                        <div class="tool-meta">
                            <span class="tool-cat">${t.category}</span>
                            ${t.requires_confirmation ? '<span class="tool-confirm">需确认</span>' : ''}
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                console.error('加载工具列表失败', e);
            }
        }

        function setExample(text) {
            document.getElementById('taskInput').value = text;
            document.getElementById('taskInput').focus();
        }

        async function runAgent() {
            const task = document.getElementById('taskInput').value.trim();
            if (!task) { alert('请输入任务描述'); return; }

            const btn = document.getElementById('runBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> 执行中...';

            const resultArea = document.getElementById('resultArea');
            resultArea.style.display = 'block';
            document.getElementById('stepsContainer').innerHTML = '<p style="color:rgba(255,255,255,0.5);">正在规划任务...</p>';

            try {
                const resp = await fetch('/api/agent/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ task })
                });
                const ctx = await resp.json();
                currentAgentId = ctx.agent_id;
                currentCtx = ctx;
                renderSteps(ctx);
            } catch (e) {
                document.getElementById('stepsContainer').innerHTML = `<p style="color:#f87171;">执行失败: ${e.message}</p>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '🚀 执行任务';
            }
        }

        function renderSteps(ctx) {
            const container = document.getElementById('stepsContainer');
            let html = `<p style="margin-bottom:16px;color:rgba(255,255,255,0.5);font-size:13px;">任务: ${ctx.task} | 状态: <strong style="color:#fff;">${ctx.status}</strong></p>`;

            ctx.steps.forEach((step, idx) => {
                const statusClass = `status-${step.status}`;
                const statusText = {
                    'pending': '等待中', 'running': '执行中', 'completed': '已完成',
                    'failed': '失败', 'skipped': '已跳过', 'needs_confirmation': '需确认'
                }[step.status] || step.status;

                html += `
                    <div class="step ${step.status}">
                        <div class="step-header">
                            <span class="tool-name">${idx + 1}. ${step.tool_name}</span>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </div>
                        ${step.reasoning ? `<div class="reasoning">💡 ${step.reasoning}</div>` : ''}
                        ${step.result ? `<div class="result">${formatStepResult(step.result)}</div>` : ''}
                        ${step.error ? `<div class="error">❌ ${step.error}</div>` : ''}
                        ${step.status === 'needs_confirmation' ? `
                            <div class="confirm-area">
                                <p>⚠️ 此操作需要您的确认：</p>
                                <div style="margin-bottom:14px;">
                                    <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;color:rgba(255,255,255,0.7);">
                                        <input type="checkbox" id="skipConfirm_${idx}">
                                        <span>以后不再询问此操作（${step.tool_name}）</span>
                                    </label>
                                </div>
                                <div class="confirm-buttons">
                                    <button class="btn btn-primary" onclick="confirmStep(${idx}, true)">✅ 确认执行</button>
                                    <button class="btn btn-secondary" onclick="confirmStep(${idx}, false)">⏭️ 跳过</button>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            if (ctx.status === 'completed') {
                html += `<p style="margin-top:20px;color:#4ade80;font-weight:600;">✅ 任务执行完成！耗时 ${ctx.duration ? ctx.duration.toFixed(1) : '?'} 秒</p>`;
            } else if (ctx.status === 'failed') {
                html += `<p style="margin-top:20px;color:#f87171;font-weight:600;">❌ 任务执行失败: ${ctx.error || '未知错误'}</p>`;
            }

            container.innerHTML = html;
        }

        async function confirmStep(stepIndex, confirmed) {
            if (!currentAgentId) return;
            if (confirmed) {
                const skipCheckbox = document.getElementById(`skipConfirm_${stepIndex}`);
                if (skipCheckbox && skipCheckbox.checked && currentCtx && currentCtx.steps) {
                    const step = currentCtx.steps[stepIndex];
                    if (step && step.tool_name) {
                        await setSkipConfirmation(step.tool_name, true);
                    }
                }
            }
            try {
                const resp = await fetch(`/api/agent/confirm/${currentAgentId}/${stepIndex}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ confirmed })
                });
                const ctx = await resp.json();
                currentCtx = ctx;
                renderSteps(ctx);
            } catch (e) {
                alert('确认操作失败: ' + e.message);
            }
        }

        // 格式化步骤结果
        function formatStepResult(result) {
            if (typeof result === 'string') {
                return result.length > 2000 ? result.substring(0, 2000) + '\n...（内容过长，已截断）' : result;
            }
            if (typeof result === 'object' && result !== null) {
                if (result.preview && typeof result.preview === 'string') {
                    return '📄 报告已生成\n\n' + result.preview;
                }
                if (result.error) {
                    return '❌ ' + result.error;
                }
                try {
                    return JSON.stringify(result, null, 2);
                } catch (e) {
                    return String(result);
                }
            }
            return String(result);
        }

        // ==================== 记忆管理功能 ====================
        let memoryPanelOpen = false;

        function toggleMemoryPanel() {
            memoryPanelOpen = !memoryPanelOpen;
            document.getElementById('memoryPanel').style.display = memoryPanelOpen ? 'block' : 'none';
            if (memoryPanelOpen) loadMemories();
        }

        async function loadMemories() {
            try {
                const type = document.getElementById('memoryTypeFilter').value;
                const url = type ? `/api/agent/memory?type=${encodeURIComponent(type)}` : '/api/agent/memory';
                const resp = await fetch(url);
                const data = await resp.json();
                renderMemoryList(data.data || []);
            } catch (e) {
                console.error('加载记忆失败', e);
            }
        }

        async function searchMemories() {
            const query = document.getElementById('memorySearch').value.trim();
            if (!query) { loadMemories(); return; }
            try {
                const resp = await fetch(`/api/agent/memory/search?q=${encodeURIComponent(query)}`);
                const data = await resp.json();
                renderMemoryList(data.data || []);
            } catch (e) {
                console.error('搜索记忆失败', e);
            }
        }

        function renderMemoryList(memories) {
            const list = document.getElementById('memoryList');
            if (!memories.length) {
                list.innerHTML = '<p style="color:rgba(255,255,255,0.4);text-align:center;padding:30px;">暂无记忆</p>';
                return;
            }
            const typeNames = {
                'instruction': '📋 常用指令',
                'preference': '⚙️ 偏好设置',
                'contact': '👤 常用联系人',
                'project': '📊 项目相关',
                'other': '📝 其他'
            };
            list.innerHTML = memories.map(m => `
                <div class="memory-item">
                    <div class="memory-item-content">
                        <div class="memory-item-type">${typeNames[m.type] || m.type}</div>
                        <div class="memory-item-text">${m.content}</div>
                        <div class="memory-item-meta">使用 ${m.usage_count || 0} 次</div>
                    </div>
                    <button class="memory-delete-btn" onclick="deleteMemory('${m.id}')">🗑️</button>
                </div>
            `).join('');
        }

        async function addMemory() {
            const content = document.getElementById('newMemoryContent').value.trim();
            const type = document.getElementById('newMemoryType').value;
            if (!content) { alert('请输入记忆内容'); return; }
            try {
                await fetch('/api/agent/memory', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content, type })
                });
                document.getElementById('newMemoryContent').value = '';
                loadMemories();
            } catch (e) {
                alert('添加记忆失败: ' + e.message);
            }
        }

        async function deleteMemory(id) {
            if (!confirm('确定删除这条记忆吗？')) return;
            try {
                await fetch(`/api/agent/memory/${id}`, { method: 'DELETE' });
                loadMemories();
            } catch (e) {
                alert('删除记忆失败: ' + e.message);
            }
        }

        function saveCurrentAsMemory() {
            const task = document.getElementById('taskInput').value.trim();
            if (!task) { alert('请先输入任务内容'); return; }
            document.getElementById('newMemoryContent').value = task;
            document.getElementById('newMemoryType').value = 'instruction';
            if (!memoryPanelOpen) toggleMemoryPanel();
            setTimeout(() => addMemory(), 100);
        }

        // ==================== 免确认功能 ====================
        async function setSkipConfirmation(toolName, skip) {
            try {
                await fetch('/api/agent/skip-confirmation', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tool_name: toolName, skip })
                });
            } catch (e) {
                console.error('设置免确认失败', e);
            }
        }

        // 初始化
        loadTools();
    </script>
</body>
</html>
