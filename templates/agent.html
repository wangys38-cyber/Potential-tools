<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent - Potential Tools 9.0</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f7; color: #1d1d1f; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        .header p { color: #86868b; font-size: 14px; }
        .input-area { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 20px; }
        .input-area textarea { width: 100%; min-height: 80px; border: 1px solid #d2d2d7; border-radius: 12px; padding: 12px; font-size: 15px; resize: vertical; font-family: inherit; }
        .input-area textarea:focus { outline: none; border-color: #0071e3; }
        .input-area .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
        .btn { padding: 10px 24px; border-radius: 980px; border: none; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: #0071e3; color: #fff; }
        .btn-primary:hover { background: #0077ed; }
        .btn-primary:disabled { background: #a8c8f0; cursor: not-allowed; }
        .btn-secondary { background: #e8e8ed; color: #1d1d1f; }
        .btn-secondary:hover { background: #dcdce0; }
        .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .example-tag { padding: 6px 14px; background: #f0f0f5; border-radius: 980px; font-size: 13px; color: #424245; cursor: pointer; transition: all 0.2s; }
        .example-tag:hover { background: #e0e0e8; }
        .result-area { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); min-height: 200px; }
        .result-area h2 { font-size: 18px; margin-bottom: 16px; }
        .step { border-left: 3px solid #d2d2d7; padding: 12px 16px; margin-bottom: 12px; background: #fafafa; border-radius: 0 8px 8px 0; }
        .step.completed { border-left-color: #34c759; }
        .step.failed { border-left-color: #ff3b30; }
        .step.running { border-left-color: #ff9500; }
        .step.pending { border-left-color: #8e8e93; opacity: 0.6; }
        .step .step-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .step .tool-name { font-weight: 600; font-size: 14px; }
        .step .status-badge { font-size: 11px; padding: 2px 8px; border-radius: 980px; font-weight: 500; }
        .status-completed { background: #d4edda; color: #155724; }
        .status-failed { background: #f8d7da; color: #721c24; }
        .status-running { background: #fff3cd; color: #856404; }
        .status-pending { background: #e2e3e5; color: #383d41; }
        .step .reasoning { font-size: 12px; color: #86868b; margin-bottom: 6px; }
        .step .result { font-size: 13px; color: #424245; background: #fff; padding: 10px 14px; border-radius: 6px; margin-top: 6px; max-height: 300px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; line-height: 1.6; }
        .step .error { font-size: 13px; color: #ff3b30; }
        .confirm-area { background: #fff8e6; border: 1px solid #ffd60a; border-radius: 12px; padding: 16px; margin: 12px 0; }
        .confirm-area p { margin-bottom: 12px; font-size: 14px; }
        .confirm-buttons { display: flex; gap: 10px; }
        .tools-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-top: 16px; }
        .tool-card { background: #fafafa; border-radius: 10px; padding: 12px; border: 1px solid #e8e8ed; }
        .tool-card .tool-name { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
        .tool-card .tool-desc { font-size: 11px; color: #86868b; }
        .tool-card .tool-cat { font-size: 10px; color: #0071e3; margin-top: 4px; }
        .loading { display: inline-block; width: 16px; height: 16px; border: 2px solid #f3f3f3; border-top: 2px solid #0071e3; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <div style="position:sticky;top:0;z-index:100;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);border-bottom:1px solid #e8e8ed;padding:10px 20px;display:flex;align-items:center;gap:16px;">
        <a href="/" style="display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:#0071e3;font-size:14px;font-weight:500;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            返回首页
        </a>
        <div style="width:1px;height:20px;background:#e8e8ed;"></div>
        <span style="font-size:15px;font-weight:600;color:#1d1d1f;">🤖 AI Agent 2.0</span>
    </div>

    <div class="container">
        <div class="header" style="display:flex;justify-content:space-between;align-items:flex-start;">
            <div>
                <h1>🤖 AI Agent</h1>
                <p>Potential Tools 9.0 · 自主任务规划与多工具调用</p>
            </div>
            <div style="display:flex;gap:8px;">
                <button class="btn btn-secondary" onclick="toggleMemoryPanel()" style="font-size:13px;padding:8px 16px;">🧠 记忆管理</button>
            </div>
        </div>

        <div class="input-area">
            <textarea id="taskInput" placeholder="描述你想完成的任务，例如：查询 Santos 项目状态，生成日报并发送给团队"></textarea>
            <div class="actions">
                <div class="examples">
                    <span class="example-tag" onclick="setExample('查询 EKSANTOS 项目状态并生成日报')">📊 生成项目日报</span>
                    <span class="example-tag" onclick="setExample('查询项目状态，生成报告并同步到牛马笔记')">📝 同步到笔记</span>
                    <span class="example-tag" onclick="setExample('在知识库中搜索 CR 分析方法')">🔍 知识库搜索</span>
                    <span class="example-tag" onclick="saveCurrentAsMemory()" style="background:#e8f5e9;color:#2e7d32;">💾 保存为记忆</span>
                </div>
                <button class="btn btn-primary" id="runBtn" onclick="runAgent()">🚀 执行任务</button>
            </div>
        </div>

        <div class="result-area" id="resultArea" style="display:none;">
            <h2>执行结果</h2>
            <div id="stepsContainer"></div>
        </div>

        <!-- 记忆管理面板 -->
        <div id="memoryPanel" style="display:none;background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,0.06);margin-bottom:20px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <h2 style="font-size:18px;">🧠 记忆管理</h2>
                <button class="btn btn-secondary" onclick="toggleMemoryPanel()" style="font-size:12px;padding:6px 12px;">✕ 关闭</button>
            </div>
            <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
                <select id="memoryTypeFilter" onchange="loadMemories()" style="padding:8px 12px;border-radius:8px;border:1px solid #d2d2d7;font-size:13px;">
                    <option value="">全部类型</option>
                    <option value="instruction">常用指令</option>
                    <option value="preference">偏好设置</option>
                    <option value="contact">常用联系人</option>
                    <option value="project">项目相关</option>
                    <option value="other">其他</option>
                </select>
                <input type="text" id="memorySearch" placeholder="搜索记忆..." oninput="searchMemories()" style="flex:1;min-width:200px;padding:8px 12px;border-radius:8px;border:1px solid #d2d2d7;font-size:13px;">
            </div>
            <div id="memoryList" style="max-height:400px;overflow-y:auto;"></div>
            <div style="margin-top:16px;padding-top:16px;border-top:1px solid #e8e8ed;">
                <h3 style="font-size:14px;margin-bottom:8px;">➕ 添加新记忆</h3>
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                    <select id="newMemoryType" style="padding:8px 12px;border-radius:8px;border:1px solid #d2d2d7;font-size:13px;">
                        <option value="instruction">常用指令</option>
                        <option value="preference">偏好设置</option>
                        <option value="contact">常用联系人</option>
                        <option value="project">项目相关</option>
                        <option value="other">其他</option>
                    </select>
                    <input type="text" id="newMemoryContent" placeholder="记忆内容..." style="flex:1;min-width:200px;padding:8px 12px;border-radius:8px;border:1px solid #d2d2d7;font-size:13px;">
                    <button class="btn btn-primary" onclick="addMemory()" style="font-size:13px;padding:8px 16px;">添加</button>
                </div>
            </div>
        </div>

        <div style="margin-top: 30px;">
            <h3 style="font-size: 16px; margin-bottom: 12px;">可用工具</h3>
            <div class="tools-list" id="toolsList"></div>
        </div>
    </div>

    <script>
        let currentAgentId = null;

        // 加载工具列表
        async function loadTools() {
            try {
                const resp = await fetch('/api/agent/tools');
                const tools = await resp.json();
                const list = document.getElementById('toolsList');
                list.innerHTML = tools.map(t => `
                    <div class="tool-card">
                        <div class="tool-name">${t.name}</div>
                        <div class="tool-desc">${t.description}</div>
                        <div class="tool-cat">${t.category}${t.requires_confirmation ? ' · 需确认' : ''}</div>
                    </div>
                `).join('');
            } catch (e) {
                console.error('加载工具列表失败', e);
            }
        }

        function setExample(text) {
            document.getElementById('taskInput').value = text;
        }

        async function runAgent() {
            const task = document.getElementById('taskInput').value.trim();
            if (!task) { alert('请输入任务描述'); return; }

            const btn = document.getElementById('runBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> 执行中...';

            const resultArea = document.getElementById('resultArea');
            resultArea.style.display = 'block';
            document.getElementById('stepsContainer').innerHTML = '<p style="color:#86868b;">正在规划任务...</p>';

            try {
                const resp = await fetch('/api/agent/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ task })
                });
                const ctx = await resp.json();
                currentAgentId = ctx.agent_id;
                renderSteps(ctx);
            } catch (e) {
                document.getElementById('stepsContainer').innerHTML = `<p style="color:#ff3b30;">执行失败: ${e.message}</p>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '🚀 执行任务';
            }
        }

        function renderSteps(ctx) {
            const container = document.getElementById('stepsContainer');
            let html = `<p style="margin-bottom:12px;color:#86868b;">任务: ${ctx.task} | 状态: <strong>${ctx.status}</strong></p>`;

            ctx.steps.forEach((step, idx) => {
                const statusClass = `status-${step.status}`;
                const statusText = {
                    'pending': '等待中', 'running': '执行中', 'completed': '已完成',
                    'failed': '失败', 'skipped': '已跳过', 'needs_confirmation': '需确认'
                }[step.status] || step.status;

                html += `
                    <div class="step ${step.status}">
                        <div class="step-header">
                            <span class="tool-name">${idx + 1}. ${step.tool_name}</span>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </div>
                        ${step.reasoning ? `<div class="reasoning">💡 ${step.reasoning}</div>` : ''}
                        ${step.result ? `<div class="result">${formatStepResult(step.result)}</div>` : ''}
                        ${step.error ? `<div class="error">❌ ${step.error}</div>` : ''}
                        ${step.status === 'needs_confirmation' ? `
                            <div class="confirm-area">
                                <p>⚠️ 此操作需要您的确认：</p>
                                <div style="margin-bottom:12px;">
                                    <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;">
                                        <input type="checkbox" id="skipConfirm_${idx}" style="width:16px;height:16px;">
                                        <span>以后不再询问此操作（${step.tool_name}）</span>
                                    </label>
                                </div>
                                <div class="confirm-buttons">
                                    <button class="btn btn-primary" onclick="confirmStep(${idx}, true)">✅ 确认执行</button>
                                    <button class="btn btn-secondary" onclick="confirmStep(${idx}, false)">⏭️ 跳过</button>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            if (ctx.status === 'completed') {
                html += `<p style="margin-top:16px;color:#34c759;font-weight:600;">✅ 任务执行完成！耗时 ${ctx.duration ? ctx.duration.toFixed(1) : '?'} 秒</p>`;
            } else if (ctx.status === 'failed') {
                html += `<p style="margin-top:16px;color:#ff3b30;font-weight:600;">❌ 任务执行失败: ${ctx.error || '未知错误'}</p>`;
            }

            container.innerHTML = html;
        }

        async function confirmStep(stepIndex, confirmed) {
            if (!currentAgentId) return;
            try {
                const resp = await fetch(`/api/agent/confirm/${currentAgentId}/${stepIndex}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ confirmed })
                });
                const ctx = await resp.json();
                renderSteps(ctx);
            } catch (e) {
                alert('确认操作失败: ' + e.message);
            }
        }

        // 格式化步骤结果
        function formatStepResult(result) {
            if (typeof result === 'string') {
                // 如果是字符串，直接显示（保留换行）
                return result.length > 2000 ? result.substring(0, 2000) + '\n...（内容过长，已截断）' : result;
            }
            if (typeof result === 'object' && result !== null) {
                // 如果是对象，检查是否有 preview 字段（如报告生成）
                if (result.preview && typeof result.preview === 'string') {
                    return '📄 报告已生成\n\n' + result.preview;
                }
                if (result.error) {
                    return '❌ ' + result.error;
                }
                // 其他对象，格式化显示
                try {
                    return JSON.stringify(result, null, 2);
                } catch (e) {
                    return String(result);
                }
            }
            return String(result);
        }

        // ==================== 记忆管理功能 ====================
        let memoryPanelOpen = false;

        function toggleMemoryPanel() {
            memoryPanelOpen = !memoryPanelOpen;
            document.getElementById('memoryPanel').style.display = memoryPanelOpen ? 'block' : 'none';
            if (memoryPanelOpen) loadMemories();
        }

        async function loadMemories() {
            try {
                const type = document.getElementById('memoryTypeFilter').value;
                const url = type ? `/api/agent/memory?type=${encodeURIComponent(type)}` : '/api/agent/memory';
                const resp = await fetch(url);
                const data = await resp.json();
                renderMemoryList(data.data || []);
            } catch (e) {
                console.error('加载记忆失败', e);
            }
        }

        async function searchMemories() {
            const query = document.getElementById('memorySearch').value.trim();
            if (!query) { loadMemories(); return; }
            try {
                const resp = await fetch(`/api/agent/memory/search?q=${encodeURIComponent(query)}`);
                const data = await resp.json();
                renderMemoryList(data.data || []);
            } catch (e) {
                console.error('搜索记忆失败', e);
            }
        }

        function renderMemoryList(memories) {
            const list = document.getElementById('memoryList');
            if (!memories.length) {
                list.innerHTML = '<p style="color:#86868b;text-align:center;padding:20px;">暂无记忆</p>';
                return;
            }
            const typeNames = {
                'instruction': '📋 常用指令',
                'preference': '⚙️ 偏好设置',
                'contact': '👤 常用联系人',
                'project': '📊 项目相关',
                'other': '📝 其他'
            };
            list.innerHTML = memories.map(m => `
                <div style="padding:12px;border:1px solid #e8e8ed;border-radius:10px;margin-bottom:8px;background:#fafafa;">
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
                        <div style="flex:1;">
                            <div style="font-size:11px;color:#0071e3;margin-bottom:4px;">${typeNames[m.type] || m.type}</div>
                            <div style="font-size:13px;color:#1d1d1f;line-height:1.5;">${m.content}</div>
                            <div style="font-size:11px;color:#86868b;margin-top:4px;">使用 ${m.usage_count || 0} 次</div>
                        </div>
                        <button onclick="deleteMemory('${m.id}')" style="background:none;border:none;color:#ff3b30;cursor:pointer;font-size:12px;padding:4px;">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        async function addMemory() {
            const content = document.getElementById('newMemoryContent').value.trim();
            const type = document.getElementById('newMemoryType').value;
            if (!content) { alert('请输入记忆内容'); return; }
            try {
                await fetch('/api/agent/memory', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content, type })
                });
                document.getElementById('newMemoryContent').value = '';
                loadMemories();
            } catch (e) {
                alert('添加记忆失败: ' + e.message);
            }
        }

        async function deleteMemory(id) {
            if (!confirm('确定删除这条记忆吗？')) return;
            try {
                await fetch(`/api/agent/memory/${id}`, { method: 'DELETE' });
                loadMemories();
            } catch (e) {
                alert('删除记忆失败: ' + e.message);
            }
        }

        function saveCurrentAsMemory() {
            const task = document.getElementById('taskInput').value.trim();
            if (!task) { alert('请先输入任务内容'); return; }
            document.getElementById('newMemoryContent').value = task;
            document.getElementById('newMemoryType').value = 'instruction';
            if (!memoryPanelOpen) toggleMemoryPanel();
            setTimeout(() => addMemory(), 100);
        }

        // ==================== 免确认功能 ====================
        async function setSkipConfirmation(toolName, skip) {
            try {
                await fetch('/api/agent/skip-confirmation', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tool_name: toolName, skip })
                });
            } catch (e) {
                console.error('设置免确认失败', e);
            }
        }

        // 重写confirmStep，支持免确认
        const originalConfirmStep = confirmStep;
        confirmStep = async function(stepIndex, confirmed) {
            if (confirmed) {
                const skipCheckbox = document.getElementById(`skipConfirm_${stepIndex}`);
                if (skipCheckbox && skipCheckbox.checked) {
                    // 获取工具名称
                    const step = currentCtx && currentCtx.steps ? currentCtx.steps[stepIndex] : null;
                    if (step && step.tool_name) {
                        await setSkipConfirmation(step.tool_name, true);
                    }
                }
            }
            return originalConfirmStep(stepIndex, confirmed);
        };

        // 保存当前上下文供confirmStep使用
        let currentCtx = null;
        const originalRenderSteps = renderSteps;
        renderSteps = function(ctx) {
            currentCtx = ctx;
            return originalRenderSteps(ctx);
        };

        // 初始化
        loadTools();
    </script>
</body>
</html>
