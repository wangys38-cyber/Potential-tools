<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具集</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231a1a1a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='2' y='7' width='20' height='14' rx='2' ry='2'/><path d='M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16'/></svg>">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="工具集">
    <link rel="stylesheet" href="/static/css/theme.css?v={{ STATIC_VERSION }}">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="preload" href="/static/js/components.js?v={{ STATIC_VERSION }}" as="script">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #fff;
            color: #1d1d1f;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== Nav ===== */
        .nav {
            background: #fff;
            padding: 0 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.08);
            position: sticky; top: 0; z-index: 100;
            height: 52px;
        }
        .nav-left { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
        .nav-center { display: flex; align-items: center; gap: 2px; position: absolute; left: 50%; transform: translateX(-50%); }
        .nav-category {
            background: none; border: none; cursor: pointer;
            color: #86868b; font-size: 13px; font-weight: 400;
            padding: 5px 12px; border-radius: 8px; transition: all 0.15s ease;
            font-family: inherit; white-space: nowrap;
        }
        .nav-category:hover { color: #1d1d1f; background: #f5f5f7; }
        .nav-category.active { color: #1d1d1f; background: #f5f5f7; font-weight: 500; }
        .nav-logo {
            font-size: 17px; font-weight: 600;
            color: #1d1d1f; letter-spacing: -0.3px;
            text-decoration: none;
            display: flex; align-items: center; gap: 8px;
        }
        .nav-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; margin-left: auto; }
        .nav-search-btn { display: flex; align-items: center; justify-content: center; }
        .nav-search-box {
            display: none; align-items: center; gap: 8px;
            padding: 6px 12px; border-radius: 8px;
            background: #f5f5f7; border: 1px solid #d2d2d7;
        }
        .nav-search-box.show { display: flex; }
        .nav-search-box svg { width: 16px; height: 16px; color: #86868b; flex-shrink: 0; }
        .nav-search-box input {
            border: none; background: none; outline: none;
            font-size: 13px; color: #1d1d1f; width: 180px; font-family: inherit;
        }
        .nav-search-box input::placeholder { color: #aeaeb2; }
        .nav-btn {
            width: 34px; height: 34px; border-radius: 8px;
            border: 1px solid #e8e8ed; background: #fff;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s ease; flex-shrink: 0;
            color: #1d1d1f;
        }
        .nav-btn:hover { background: #f5f5f7; border-color: #d2d2d7; }
        .user-info { display: flex; align-items: center; gap: 8px; }
        .user-info .avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 1px solid #e8e8ed; }
        .user-info .avatar-placeholder {
            width: 30px; height: 30px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: #1d1d1f; color: #fff; font-weight: 600; font-size: 13px;
        }
        .user-info .logout-btn {
            color: #86868b; text-decoration: none; font-size: 12px;
            padding: 5px 12px; border-radius: 980px; transition: all 0.15s; border: 1px solid #e8e8ed;
            background: #fff;
        }
        .user-info .logout-btn:hover { background: rgba(255,59,48,0.06); color: #ff3b30; border-color: rgba(255,59,48,0.2); }
        .user-info .login-btn {
            color: #fff; text-decoration: none; font-size: 13px; font-weight: 500;
            padding: 6px 16px; border-radius: 8px;
            background: #1d1d1f; transition: background 0.15s ease; border: none;
        }
        .user-info .login-btn:hover { background: #333; }

        /* ===== Page Header ===== */
        .page-header {
            max-width: 1200px; margin: 0 auto;
            padding: 40px 24px 24px;
        }
        .page-header h1 {
            font-size: 28px; font-weight: 600;
            letter-spacing: -0.5px; color: #1d1d1f;
            margin-bottom: 6px;
        }
        .page-header p {
            font-size: 15px; color: #86868b;
            font-weight: 400;
        }

        /* ===== Dashboard Stats ===== */
        .dashboard-stats {
            max-width: 1200px; margin: 0 auto 24px; padding: 0 24px;
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
        }
        .stat-card {
            background: #fff;
            border: 1px solid #e8e8ed;
            border-radius: 12px; padding: 16px 20px;
            display: flex; align-items: center; gap: 12px;
            transition: border-color 0.15s ease;
        }
        .stat-card:hover { border-color: #d2d2d7; }
        .stat-icon {
            width: 40px; height: 40px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            background: #f5f5f7; flex-shrink: 0;
        }
        .stat-icon svg { width: 20px; height: 20px; stroke: #1d1d1f; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .stat-info { flex: 1; min-width: 0; }
        .stat-value {
            font-size: 24px; font-weight: 600; line-height: 1;
            color: #1d1d1f;
        }
        .stat-label { font-size: 13px; color: #86868b; margin-top: 4px; }

        /* ===== Tools Grid ===== */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px 48px; }
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 16px;
        }
        .tool-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px; cursor: pointer;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            border: 1px solid #e8e8ed;
            display: flex; flex-direction: column;
        }
        .tool-card:hover {
            border-color: #d2d2d7;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .tool-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .tool-icon {
            width: 44px; height: 44px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            background: #fff; flex-shrink: 0;
        }
        .tool-icon svg { width: 22px; height: 22px; stroke: #1d1d1f; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .tool-card h2 { font-size: 16px; font-weight: 600; color: #1d1d1f; letter-spacing: -0.2px; }
        .tool-badge {
            font-size: 10px; padding: 2px 8px; border-radius: 6px;
            font-weight: 500; margin-top: 3px; display: inline-block;
            background: #f5f5f7; color: #86868b;
            border: 1px solid #e8e8ed;
            letter-spacing: 0.3px;
        }
        .tool-card p {
            font-size: 13px; color: #86868b; line-height: 1.6; margin-bottom: 12px; flex: 1;
        }
        .feature-list { list-style: none; margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 6px; }
        .feature-list li {
            font-size: 11px; padding: 3px 8px; border-radius: 6px;
            background: #fafafa; color: #86868b;
            border: 1px solid #e8e8ed;
        }
        .tool-footer { display: flex; align-items: center; justify-content: space-between; }
        .tool-btn {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 7px 16px; background: #1d1d1f; color: #fff;
            border-radius: 8px; text-decoration: none;
            font-weight: 500; font-size: 13px; border: none; cursor: pointer;
            transition: background 0.15s ease; font-family: inherit;
        }
        .tool-btn:hover { background: #333; }
        .tool-shortcut {
            margin-left: auto;
            width: 24px; height: 24px;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 500;
            color: #86868b;
            background: #fafafa;
            border: 1px solid #e8e8ed;
            flex-shrink: 0;
        }
        .fav-btn {
            background: none; border: none; cursor: pointer;
            padding: 6px; color: #1d1d1f; transition: opacity 0.15s ease;
            border-radius: 6px; opacity: 0.3;
            display: flex; align-items: center; justify-content: center;
        }
        .fav-btn:hover { opacity: 0.7; }
        .fav-btn.active { opacity: 1; }
        .fav-btn svg { width: 16px; height: 16px; }

        /* ===== Favorites & Recent ===== */
        .tb-recent-bar { margin-bottom: 16px; }
        .tb-recent-title {
            font-size: 12px; font-weight: 500;
            color: #86868b; margin-bottom: 10px;
            display: flex; align-items: center; gap: 6px;
        }
        .tb-recent-list { display: flex; gap: 8px; flex-wrap: wrap; }
        .tb-recent-item {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 6px 14px; border-radius: 980px;
            background: #fff;
            border: 1px solid #e8e8ed;
            cursor: pointer; transition: all 0.15s ease;
            font-size: 13px; color: #1d1d1f;
            text-decoration: none;
        }
        .tb-recent-item:hover { border-color: #d2d2d7; background: #fafafa; }
        .tb-recent-item-icon { display: flex; align-items: center; }
        .tb-recent-item-icon svg { width: 14px; height: 14px; stroke: #1d1d1f; fill: none; stroke-width: 1.8; }
        .tb-recent-item-time { font-size: 11px; color: #aeaeb2; }

        /* ===== No Results ===== */
        .no-results {
            text-align: center; padding: 60px 20px; color: #86868b;
        }
        .no-results-icon { margin-bottom: 12px; display: flex; justify-content: center; }
        .no-results-icon svg { width: 40px; height: 40px; stroke: #d2d2d7; fill: none; stroke-width: 1.5; }

        /* ===== Footer ===== */
        .footer {
            text-align: center; padding: 32px 24px; color: #86868b;
            font-size: 12px; border-top: 1px solid #e8e8ed;
            background: #fff;
        }
        .footer a {
            color: #1d1d1f; text-decoration: none;
            font-weight: 500;
        }
        .footer a:hover { text-decoration: underline; }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .dashboard-stats { grid-template-columns: 1fr; padding: 0 14px; gap: 8px; }
            .stat-card { padding: 14px 16px; }
            .stat-icon { width: 36px; height: 36px; }
            .stat-value { font-size: 20px; }
            .nav { padding: 0 14px; height: 48px; }
            .nav-center { display: none; }
            .nav-right { gap: 6px; }
            .page-header { padding: 24px 14px 16px; }
            .page-header h1 { font-size: 22px; }
            .page-header p { font-size: 14px; }
            .container { padding: 0 14px 32px; }
            .tools-grid { grid-template-columns: 1fr; gap: 10px; }
            .tool-card { padding: 16px; }
            .tool-icon { width: 40px; height: 40px; }
            .tool-card h2 { font-size: 15px; }
            .tool-card p { font-size: 13px; }
            .nav-btn { width: 32px; height: 32px; }
            .user-info .logout-btn { padding: 4px 10px; font-size: 11px; }
            .user-info .login-btn { padding: 6px 12px; font-size: 12px; }
            .user-info .avatar, .user-info .avatar-placeholder { width: 28px; height: 28px; font-size: 12px; }
            .footer { padding: 24px 16px; font-size: 11px; }
        }
        @media (max-width: 480px) {
            .page-header h1 { font-size: 20px; }
            .tool-card { padding: 14px; }
            .tool-icon { width: 36px; height: 36px; }
        }
        @media (max-width: 360px) {
            .nav { padding: 0 10px; }
            .nav-btn[title="设置"] { display: none; }
            .tool-card { padding: 12px; }
            .tool-shortcut { display: none; }
        }
        /* 首页强制隐藏统一导航栏，避免重复 */
        .pt-nav-bar, #ptNavBar, .tb-nav-bar, #tb-nav-bar { display: none !important; }
    </style>
    <link rel="stylesheet" href="/static/css/ux-enhancements.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/de-ai.css?v={{ STATIC_VERSION }}"><link rel="stylesheet" href="/static/css/components.css?v={{ STATIC_VERSION }}">    <link rel="stylesheet" href="/static/css/mobile.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/design-system.css?v={{ STATIC_VERSION }}">

</head>
<body>

    <div class="nav">
        <div class="nav-left">
        </div>
        <div class="nav-center">
            <span style="cursor:pointer;margin-right:4px;display:flex;align-items:center;" onclick="location.href='/'">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
                </svg>
            </span>
            <button class="nav-category active" data-cat="all" onclick="setCategory('all')">全部</button>
            <button class="nav-category" data-cat="fav" onclick="setCategory('fav')">收藏</button>
            <button class="nav-category" data-cat="notes" onclick="setCategory('notes')">笔记</button>
            <button class="nav-category" data-cat="convert" onclick="setCategory('convert')">转换</button>
            <button class="nav-category" data-cat="analysis" onclick="setCategory('analysis')">分析</button>
            <button class="nav-category" data-cat="dev" onclick="setCategory('dev')">研发</button>
            <button class="nav-category" data-cat="office" onclick="setCategory('office')">办公</button>
            <button class="nav-category" data-cat="manage" onclick="setCategory('manage')">管理</button>
            <button class="nav-category" data-cat="fun" onclick="setCategory('fun')">趣味</button>
        </div>
        <div class="nav-right">
            <button class="nav-btn nav-search-btn" onclick="toggleNavSearch()" title="搜索">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35" stroke-linecap="round"/></svg>
            </button>
            <div class="nav-search-box" id="navSearchBox">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35" stroke-linecap="round"/></svg>
                <input type="text" id="navSearchInput" placeholder="搜索工具..." oninput="filterTools()" autofocus>
                <button onclick="toggleNavSearch()" style="background:none;border:none;cursor:pointer;color:inherit;font-size:16px;padding:0 4px;">×</button>
            </div>
            <a href="/settings" target="_blank" rel="noopener noreferrer" class="nav-btn" title="设置">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </a>
            <button class="nav-btn" onclick="toggleTheme()" id="theme-btn" title="切换主题">
                <svg class="theme-icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                <svg class="theme-icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 1v2M12 21v2M4.22 4.22l1.41 1.42M18.36 18.36l1.41 1.42M1 12h2M21 12h2M4.22 19.78l1.41-1.42M18.36 5.64l1.42-1.42"/></svg>
            </button>
            <div class="user-info">
                {% if current_user %}
                    {% if current_user.avatar %}
                        <img src="{{ current_user.avatar }}" class="avatar" alt="avatar">
                    {% else %}
                        <div class="avatar-placeholder">{{ current_user.name[:1] if current_user.name else '?' }}</div>
                    {% endif %}
                    <a href="/auth/logout" class="logout-btn">退出</a>
                {% else %}
                    <a href="/login" class="login-btn">登录</a>
                {% endif %}
            </div>
        </div>
    </div>

    <div class="page-header">
        <h1>工具集</h1>
        <p><span id="toolCount">10</span> 款工具 · 持续更新</p>
    </div>

    <!-- Dashboard Stats -->
    <div class="dashboard-stats" id="dashboard-stats">
        <div class="stat-card">
            <div class="stat-icon tools">
                <svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
            </div>
            <div class="stat-info">
                <div class="stat-value" id="stat-total">0</div>
                <div class="stat-label">可用工具</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon fav">
                <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            </div>
            <div class="stat-info">
                <div class="stat-value" id="stat-fav">0</div>
                <div class="stat-label">已收藏</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon recent">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <div class="stat-info">
                <div class="stat-value" id="stat-recent">0</div>
                <div class="stat-label">最近使用</div>
            </div>
        </div>
    </div>

    <div class="container">
        <div id="fav-bar" class="tb-recent-bar" style="display:none">
            <div class="tb-recent-title">我的收藏</div>
            <div class="tb-recent-list" id="fav-list"></div>
        </div>
        <div id="recent-bar" class="tb-recent-bar" style="display:none">
            <div class="tb-recent-title">最近使用 <a href="javascript:void(0)" onclick="clearRecent()" style="font-size:12px;font-weight:400;color:#86868b;margin-left:8px;text-decoration:none;">清除记录</a></div>
            <div class="tb-recent-list" id="recent-list"></div>
        </div>
        <div class="tools-grid" id="tools-grid"></div>
        <div class="no-results" id="no-results" style="display:none">
            <div class="no-results-icon">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35" stroke-linecap="round"/></svg>
            </div>
            <p>没有找到匹配的工具</p>
        </div>
    </div>

    <div class="footer">
        <p>Potential Tools v6.0 · <a href="https://github.com/wangys38-cyber/Potential-tools" target="_blank" rel="noopener noreferrer">GitHub</a></p>
    </div>

    <script>window._USER_PREFIX={{ ('u' ~ current_user.id ~ '_') if current_user else '' | tojson }};</script>
    <script src="/static/js/components.js?v={{ STATIC_VERSION }}"></script>
    <script>
    // ===== PWA Service Worker 注册 =====
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
            navigator.serviceWorker.register('/static/sw.js').catch(function(e) {
                console.log('SW registration failed:', e);
            });
        });
    }
    </script>
    <script>
    // ===== SVG Icon Library =====
    const ICONS = {

    // 动态更新工具数量
    document.addEventListener('DOMContentLoaded', function() {
        const countEl = document.getElementById('toolCount');
        if (countEl) countEl.textContent = TOOLS.length;
    });

    let currentCategory = 'all';

    // ===== Favorites =====
    const FAV_KEY = (window._USER_PREFIX || '') + 'toolbox_favorites';
    {% if current_user %}
    (function(){
        if(localStorage.getItem('toolbox_favorites') !== null){
            if(localStorage.getItem(FAV_KEY) === null){
                localStorage.setItem(FAV_KEY, localStorage.getItem('toolbox_favorites'));
            }
            localStorage.removeItem('toolbox_favorites');
        }
    })();
    {% endif %}
    function getFavorites() {
        try { return JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); } catch(e) { return []; }
    }
    function toggleFavorite(toolId, event) {
        if (event) { event.preventDefault(); event.stopPropagation(); }
        let favs = getFavorites();
        const wasFav = favs.includes(toolId);
        if (wasFav) {
            favs = favs.filter(f => f !== toolId);
        } else {
            favs.push(toolId);
        }
        try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch(e) {}

        const btn = event && event.currentTarget ? event.currentTarget : null;
        if (btn) {
            btn.classList.toggle('active', !wasFav);
            btn.innerHTML = wasFav ? ICONS.star : ICONS.star;
            btn.querySelector('svg').setAttribute('fill', wasFav ? 'none' : 'currentColor');
            btn.title = wasFav ? '收藏' : '取消收藏';
        }

        if (currentCategory === 'fav') {
            renderTools();
        }
        renderFavBar();
        updateDashboardStats();
    }
    function isFavorite(toolId) {
        return getFavorites().includes(toolId);
    }

    // ===== Render tools =====
    function renderTools() {
        const grid = document.getElementById('tools-grid');
        const noResults = document.getElementById('no-results');
        const navSearchInput = document.getElementById('navSearchInput');
        const query = (navSearchInput?.value || '').toLowerCase().trim();

        let filtered = TOOLS.filter(t => {
            const catMatch = currentCategory === 'all' || t.cat === currentCategory ||
                             (currentCategory === 'fav' && isFavorite(t.id));
            const qMatch = !query ||
                t.name.toLowerCase().includes(query) ||
                t.desc.toLowerCase().includes(query) ||
                t.features.some(f => f.toLowerCase().includes(query));
            return catMatch && qMatch;
        });

        if (filtered.length === 0) {
            grid.innerHTML = '';
            noResults.style.display = 'block';
            return;
        }
        noResults.style.display = 'none';

        const favs = getFavorites();
        grid.innerHTML = filtered.map((t, i) => {
            const origIdx = TOOLS.indexOf(t);
            const isFav = isFavorite(t.id);
            const iconSvg = ICONS[t.icon] || ICONS.tools;
            return `
            <div class="tool-card" onclick="openTool('/${t.id}')">
                <div class="tool-header">
                    <div class="tool-icon">${iconSvg}</div>
                    <div>
                        <h2>${t.name}</h2>
                        ${t.badge ? `<span class="tool-badge">${t.badge}</span>` : ''}
                    </div>
                    <span class="tool-shortcut" title="快捷键 ${origIdx + 1}">${origIdx + 1}</span>
                </div>
                <p>${t.desc}</p>
                <ul class="feature-list">
                    ${t.features.map(f => `<li>${f}</li>`).join('')}
                </ul>
                <div class="tool-footer">
                    <button onclick="handleCardClick(event, '/${t.id}')" class="tool-btn">打开</button>
                    <button onclick="toggleFavorite('${t.id}', event)" class="fav-btn ${isFav ? 'active' : ''}" title="${isFav ? '取消收藏' : '收藏'}">
                        <svg viewBox="0 0 24 24" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                    </button>
                </div>
            </div>
            `;
        }).join('');
    }

    function renderFavBar() {
        const favs = getFavorites();
        const bar = document.getElementById('fav-bar');
        if (!bar) return;
        if (favs.length === 0) {
            bar.style.display = 'none';
            return;
        }
        bar.style.display = 'block';
        const list = document.getElementById('fav-list');
        const esc = (s) => { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; };
        list.innerHTML = favs.map(id => {
            const tool = TOOLS.find(t => t.id === id);
            if (!tool) return '';
            const iconSvg = ICONS[tool.icon] || ICONS.tools;
            return `<a href="/${esc(id)}" target="_blank" rel="noopener noreferrer" class="tb-recent-item" onclick="event.preventDefault();openTool('/${esc(id)}')">
                <span class="tb-recent-item-icon">${iconSvg}</span>
                <span>${esc(tool.name)}</span>
            </a>`;
        }).join('');
    }

    function filterTools() { renderTools(); }

    function toggleNavSearch() {
        const box = document.getElementById('navSearchBox');
        const btn = document.querySelector('.nav-search-btn');
        if (box.classList.contains('show')) {
            box.classList.remove('show');
            btn.style.display = 'flex';
            document.getElementById('navSearchInput').value = '';
            renderTools();
        } else {
            box.classList.add('show');
            btn.style.display = 'none';
            setTimeout(() => document.getElementById('navSearchInput').focus(), 50);
        }
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            const box = document.getElementById('navSearchBox');
            if (box && box.classList.contains('show')) {
                toggleNavSearch();
            }
        }
    });

    function setCategory(cat) {
        currentCategory = cat;
        document.querySelectorAll('.nav-category').forEach(c => c.classList.toggle('active', c.dataset.cat === cat));
        renderTools();
    }

    function openTool(url) {
        const toolId = url.replace('/', '');
        const tool = TOOLS.find(t => t.id === toolId);
        if (tool && window.ToolboxRecent) {
            ToolboxRecent.record(tool.id, tool.name, tool.icon);
        }
        window.location.href = url;
    }
    function handleCardClick(e, url) { e.preventDefault(); e.stopPropagation(); openTool(url); }

    // ===== Recently Used =====
    function renderRecent() {
        if (!window.ToolboxRecent) return;
        const recent = ToolboxRecent.getAll();
        const bar = document.getElementById('recent-bar');
        const list = document.getElementById('recent-list');
        if (recent.length === 0) {
            bar.style.display = 'none';
            return;
        }
        bar.style.display = 'block';
        list.innerHTML = recent.map(r => {
            const tool = TOOLS.find(t => t.id === r.id);
            if (!tool) return '';
            const mins = Math.floor((Date.now() - r.time) / 60000);
            const timeStr = mins < 1 ? '刚刚' : mins < 60 ? mins + '分钟前' : Math.floor(mins/60) + '小时前';
            const esc = (s) => { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; };
            const iconSvg = ICONS[tool.icon] || ICONS.tools;
            return `<a href="/${esc(r.id)}" target="_blank" rel="noopener noreferrer" class="tb-recent-item" onclick="event.preventDefault();openTool('/${esc(r.id)}')">
                <span class="tb-recent-item-icon">${iconSvg}</span>
                <span>${esc(tool.name)}</span>
                <span class="tb-recent-item-time">${esc(timeStr)}</span>
            </a>`;
        }).join('');
    }

    function clearRecent() {
        if (window.ToolboxRecent) ToolboxRecent.clear();
        renderRecent();
    }

    // ===== Theme =====
    function toggleTheme() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const next = isDark ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        const moon = document.querySelector('#theme-btn .theme-icon-moon');
        const sun = document.querySelector('#theme-btn .theme-icon-sun');
        if (moon && sun) {
            moon.style.display = isDark ? '' : 'none';
            sun.style.display = isDark ? 'none' : '';
        }
        try { localStorage.setItem('toolbox_theme', next); } catch(e) {}
    }

    (function() {
        let saved = 'auto';
        try { saved = localStorage.getItem('toolbox_theme') || 'auto'; } catch(e) {}
        const sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = saved === 'dark' || (saved === 'auto' && sysDark);
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        document.addEventListener('DOMContentLoaded', function() {
            const moon = document.querySelector('#theme-btn .theme-icon-moon');
            const sun = document.querySelector('#theme-btn .theme-icon-sun');
            if (moon && sun) {
                moon.style.display = isDark ? 'none' : '';
                sun.style.display = isDark ? '' : 'none';
            }
        });
    })();

    document.addEventListener('keydown', e => {
        if (document.activeElement.tagName !== 'INPUT' && /^[1-9]$/.test(e.key)) {
            const idx = parseInt(e.key) - 1;
            if (TOOLS[idx]) {
                openTool('/' + TOOLS[idx].id);
            }
        }
    });

    // ===== Dashboard 统计更新 =====
    function updateDashboardStats() {
        const totalEl = document.getElementById('stat-total');
        const favEl = document.getElementById('stat-fav');
        const recentEl = document.getElementById('stat-recent');
        if (totalEl) totalEl.textContent = TOOLS.length;
        if (favEl) favEl.textContent = getFavorites().length;
        if (recentEl) {
            const recent = window.ToolboxRecent ? ToolboxRecent.getAll() : [];
            recentEl.textContent = recent.length;
        }
    }

    renderTools();
    renderRecent();
    renderFavBar();
    updateDashboardStats();
    document.addEventListener('visibilitychange', function() {
        if (!document.hidden) {
            renderRecent();
            renderFavBar();
            updateDashboardStats();
        }
    });
    document.addEventListener('userprefix-ready', function() {
        renderRecent();
        renderFavBar();
        updateDashboardStats();
    });
    </script>
