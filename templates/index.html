<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具集</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231a1a1a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='2' y='7' width='20' height='14' rx='2' ry='2'/><path d='M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16'/></svg>">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="工具集">
    <link rel="stylesheet" href="/static/css/theme.css?v={{ STATIC_VERSION }}">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="preload" href="/static/js/components.js?v={{ STATIC_VERSION }}" as="script">
    
    <link rel="stylesheet" href="/static/css/ux-enhancements.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/de-ai.css?v={{ STATIC_VERSION }}"><link rel="stylesheet" href="/static/css/components.css?v={{ STATIC_VERSION }}">    <link rel="stylesheet" href="/static/css/mobile.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/design-system.css?v={{ STATIC_VERSION }}">

<link rel="stylesheet" href="/static/css/page/index.css?v={{ STATIC_VERSION }}">
<link rel="stylesheet" href="/static/css/page/index-hero.css?v={{ STATIC_VERSION }}">
</head>
<body>

    {% include '_navbar.html' %}

    <nav class="nav">
      <div class="nav-left">
        <span class="logo">UNIQ</span>
      </div>
      <div class="nav-center">
        <div class="nav-tabs">
          <button class="nav-tab active" data-tab="home">Home</button>
          <button class="nav-tab" data-tab="explore">Explore</button>
          <button class="nav-tab" data-tab="about">About</button>
        </div>
      </div>
      <div class="nav-right">
        <button class="nav-icon-btn" id="navSearchBtn" title="搜索">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </button>
        <button class="sign-in-btn">Sign in</button>
      </div>
    </nav>

    <div id="hero-section">
      <div class="hero-bg-text">POTENTIAL</div>
      <div class="floating-elements">
        <span class="float-star" style="top:15%;left:12%;">✦</span>
        <span class="float-star" style="top:25%;right:15%;animation-delay:1s;">✧</span>
        <span class="float-star" style="top:60%;left:8%;animation-delay:2s;">✦</span>
        <span class="float-star" style="top:70%;right:10%;animation-delay:0.5s;">✧</span>
        <div class="float-bubble" style="top:20%;right:25%;animation-delay:1.5s;">Hi!</div>
        <div class="float-bubble" style="top:55%;left:20%;animation-delay:3s;">✨</div>
      </div>
      <div class="hero-title-section">
        <div class="hero-badge">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8l-6.2 4.5 2.4-7.4L2 9.4h7.6z"/></svg>
          Potential Tools v8.0
        </div>
        <h1>选个工具，牛马一天</h1>
        <p class="hero-sub">悬停抬起 · 一键直达</p>
      </div>
      <div class="hero-cards-wrap">
        <div class="hero-cards hero-cards-scroll" id="heroCards">
          <!-- 由内联 JS 渲染 -->
        </div>
      </div>
      <div class="hero-more-tools" id="heroMoreTools">
        <div class="hero-more-title">更多工具</div>
        <div class="hero-more-list" id="heroMoreList"></div>
      </div>
    </div>

    <!-- Dashboard Stats -->
    <div class="dashboard-stats" id="dashboard-stats">
        <div class="stat-card">
            <div class="stat-icon tools">
                <svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
            </div>
            <div class="stat-info">
                <div class="stat-value" id="stat-total">0</div>
                <div class="stat-label">可用工具</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon fav">
                <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            </div>
            <div class="stat-info">
                <div class="stat-value" id="stat-fav">0</div>
                <div class="stat-label">已收藏</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon recent">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <div class="stat-info">
                <div class="stat-value" id="stat-recent">0</div>
                <div class="stat-label">最近使用</div>
            </div>
        </div>
    </div>

    <div class="container" id="toolsSourceContainer" style="display:none;">
        <!-- 工具集成工作流 -->
        <div id="workflow-section" style="margin-bottom:20px;display:none">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
                <div style="font-size:14px;font-weight:600;color:#1d1d1f;display:flex;align-items:center;gap:8px">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v18l7-5 7 5V3z"/></svg>
                    工具联动
                </div>
            </div>
            <div id="workflow-list" style="display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;"></div>
        </div>

        <div id="fav-bar" class="tb-recent-bar" style="display:none">
            <div class="tb-recent-title">我的收藏</div>
            <div class="tb-recent-list" id="fav-list"></div>
        </div>
        <div id="recent-bar" class="tb-recent-bar" style="display:none">
            <div class="tb-recent-title">最近使用 <a href="javascript:void(0)" onclick="clearRecent()" style="font-size:12px;font-weight:400;color:#86868b;margin-left:8px;text-decoration:none;">清除记录</a></div>
            <div class="tb-recent-list" id="recent-list"></div>
        </div>
        <div class="tools-grid" id="tools-grid"></div>
        <div class="no-results" id="no-results" style="display:none">
            <div class="no-results-icon">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35" stroke-linecap="round"/></svg>
            </div>
            <p>没有找到匹配的工具</p>
        </div>
    </div>

    <div class="footer">
        <p>Potential Tools v8.0 · <a href="https://github.com/wangys38-cyber/Potential-tools" target="_blank" rel="noopener noreferrer">GitHub</a></p>
    </div>

    <script>window._USER_PREFIX={{ ('u' ~ current_user.id ~ '_') if current_user else '' | tojson }};</script>
    <script src="/static/js/components.js?v={{ STATIC_VERSION }}"></script>
    
    
<script src="/static/js/v5-sync.js?v={{ STATIC_VERSION }}"></script>
<script src="/static/js/ux-enhancements.js?v={{ STATIC_VERSION }}"></script>

<!-- 访问次数 -->

<div class="visit-counter" id="visitCounter">
    <span class="label">访问</span>
    <span class="num" id="visitNum">0</span>
</div>

  var MAIN_TAGS = ['AI Powered', 'Fast Send', 'Smart Q&A', 'Quick Note', 'Deep Link'];
  var MAIN_ANIMALS = [CLOUD_SVG, ROBOT_SVG, PLANET_HALO_SVG, FLOWER_SVG, HEART_MONSTER_SVG];

  function parseTool(tc) {
    var nameEl = tc.querySelector('.tc-name') || tc.querySelector('[class*=name]');
    var descEl = tc.querySelector('.tc-desc') || tc.querySelector('[class*=desc]');
    var linkEl = tc.querySelector('a') || tc.closest('a');
    var name = nameEl ? nameEl.textContent.trim() : tc.textContent.trim().slice(0, 10);
    var desc = descEl ? descEl.textContent.trim() : '';
    var url = linkEl ? linkEl.getAttribute('href') : (tc.getAttribute('data-url') || '');
    if (!url) {
      var onclick = tc.getAttribute('onclick') || '';
      var m = onclick.match(/openTool\(['"]([^'"]+)['"]\)/);
      if (m) url = m[1];
      else {
        var m2 = onclick.match(/location\.href=['"]([^'"]+)['"]/);
        if (m2) url = m2[1];
      }
    }
    if (!url) url = '#';
    return { name: name, desc: desc, url: url };
  }

  function renderHeroCards() {
    var grid = document.getElementById('tools-grid');
    var wrap = document.getElementById('heroCards');
    var moreList = document.getElementById('heroMoreList');
    var moreWrap = document.getElementById('heroMoreTools');
    if (!grid || !wrap) return;
    var cards = grid.querySelectorAll('.tool-card');
    if (!cards.length) { setTimeout(renderHeroCards, 300); return; }

    var allTools = [];
    cards.forEach(function(tc) { allTools.push(parseTool(tc)); });

    // 筛选主要工具（按 MAIN_TOOLS 顺序）
    var mainTools = [];
    var otherTools = [];
    MAIN_TOOLS.forEach(function(key) {
      var found = allTools.find(function(t) { return t.url && t.url.indexOf(key) >= 0; });
      if (found) mainTools.push(found);
    });
    allTools.forEach(function(t) {
      var isMain = mainTools.some(function(m) { return m.url === t.url; });
      if (!isMain) otherTools.push(t);
    });

    // 渲染主要工具卡片
    wrap.innerHTML = '';
    mainTools.forEach(function(t, idx) {
      var card = document.createElement('a');
      card.className = 'hero-card';
      card.href = t.url;
      card.style.background = MAIN_COLORS[idx % MAIN_COLORS.length];
      card.innerHTML =
        '<div class="hc-tag">' + (MAIN_TAGS[idx % MAIN_TAGS.length] || '') + '</div>' +
        '<div class="hc-animal">' + MAIN_ANIMALS[idx % MAIN_ANIMALS.length] + '</div>' +
        '<div class="hc-name">' + t.name + '</div>' +
        (t.desc ? '<div class="hc-desc">' + t.desc + '</div>' : '');
      wrap.appendChild(card);
    });

    // 渲染其余工具列表
    if (moreList) {
      moreList.innerHTML = '';
      otherTools.forEach(function(t) {
        var item = document.createElement('a');
        item.className = 'hero-more-item';
        item.href = t.url;
        item.textContent = t.name;
        item.title = t.desc || t.name;
        moreList.appendChild(item);
      });
      if (moreWrap) {
        moreWrap.style.display = otherTools.length ? 'block' : 'none';
      }
    }

    bindHover();
  }

  function bindHover() {
    var wrap = document.getElementById('heroCards');
    if (!wrap) return;
    var cards = wrap.querySelectorAll('.hero-card');
    cards.forEach(function(card, idx) {
      card.addEventListener('mouseenter', function() {
        cards.forEach(function(c, i) {
          c.classList.remove('hover-active', 'hover-left', 'hover-right');
          if (i === idx) c.classList.add('hover-active');
          else if (i < idx) c.classList.add('hover-left');
          else c.classList.add('hover-right');
        });
      });
    });
    wrap.addEventListener('mouseleave', function() {
      cards.forEach(function(c) {
        c.classList.remove('hover-active', 'hover-left', 'hover-right');
      });
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() { setTimeout(renderHeroCards, 500); });
  } else {
    setTimeout(renderHeroCards, 500);
  }
})();
</script>
