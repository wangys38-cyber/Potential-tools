<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>姣忔棩绔欎細鍔╂墜 - Potential Tools</title>
    <link rel="stylesheet" href="/static/css/theme.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/v5-glass.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/ux-enhancements.css?v={{ STATIC_VERSION }}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #fff;
            min-height: 100vh;
            color: var(--text-primary);
        }
        .header {
            padding: 24px 32px;
            background: rgba(255,255,255,0.1);
            
            border-bottom: 1px solid rgba(255,255,255,0.15);
            display: flex; align-items: center; gap: 16px;
        }
        .header h1 { font-size: 22px; font-weight: 700; color: #fff; }
        .header p { font-size: 13px; color: rgba(255,255,255,0.7); margin-top: 2px; }
        .back-btn {
            width: 36px; height: 36px; border-radius: 10px;
            background: rgba(255,255,255,0.15); border: none; color: #fff;
            font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .back-btn:hover { background: rgba(255,255,255,0.25); }
        .container { max-width: 900px; margin: 0 auto; padding: 24px 20px; }

        .panel {
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(0,0,0,0.06);
        }
        .panel-title {
            font-size: 15px; font-weight: 700; margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
        }
        .panel-title .badge {
            font-size: 10px; padding: 2px 8px; border-radius: 10px;
            background: rgba(102,126,234,0.1); color: #667eea; font-weight: 600;
        }

        .input-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .input-row input {
            flex: 1; padding: 8px 12px; border: 1px solid var(--border);
            border-radius: 8px; font-size: 13px; background: var(--bg-secondary);
            color: var(--text-primary);
        }
        .input-row input:focus { outline: none; border-color: #667eea; }

        textarea {
            width: 100%; min-height: 80px; padding: 10px 12px;
            border: 1px solid var(--border); border-radius: 10px;
            background: var(--bg-secondary); color: var(--text-primary);
            font-size: 13px; line-height: 1.6; resize: vertical;
            font-family: inherit;
        }
        textarea:focus { outline: none; border-color: #667eea; }

        .action-btn {
            padding: 8px 16px; border-radius: 10px; border: none;
            font-size: 13px; font-weight: 600; cursor: pointer;
            transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
        }
        .action-btn.primary { background: #fff; color: #fff; }
        .action-btn.primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(102,126,234,0.4); }
        .action-btn.ghost { background: var(--bg-secondary); color: var(--text-primary); }
        .action-btn.ghost:hover { background: var(--bg-hover); }
        .action-btn.success { background: #10b981; color: #fff; }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

        .tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .tag {
            padding: 4px 10px; border-radius: 6px; font-size: 12px;
            background: rgba(102,126,234,0.1); color: #667eea;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .tag .remove { cursor: pointer; opacity: 0.6; }
        .tag .remove:hover { opacity: 1; }

        .output-area {
            background: var(--bg-secondary); border-radius: 10px;
            padding: 16px; font-size: 13px; line-height: 1.8;
            white-space: pre-wrap; word-break: break-word;
            min-height: 120px; border: 1px solid var(--border);
        }
        .output-area.empty { color: var(--text-secondary); font-style: italic; }

        .history-item {
            padding: 10px 12px; border-radius: 8px;
            background: var(--bg-secondary); margin-bottom: 6px;
            cursor: pointer; transition: background 0.2s;
            display: flex; justify-content: space-between; align-items: center;
        }
        .history-item:hover { background: var(--bg-hover); }
        .history-date { font-size: 12px; color: var(--text-secondary); }
        .history-preview { font-size: 12px; color: var(--text-primary); flex: 1; margin: 0 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .jira-panel { display: none; margin-top: 10px; padding: 12px; background: var(--bg-secondary); border-radius: 8px; }
        .jira-panel.show { display: block; }

        @media (max-width: 768px) {
            .header { padding: 16px; }
            .header h1 { font-size: 18px; }
            .container { padding: 16px 12px; }
        }
    </style>
    <link rel="stylesheet" href="/static/css/de-ai.css?v={{ STATIC_VERSION }}"><link rel="stylesheet" href="/static/css/components.css?v={{ STATIC_VERSION }}">    <link rel="stylesheet" href="/static/css/mobile.css?v={{ STATIC_VERSION }}">

    <link rel="stylesheet" href="/static/css/design-system.css?v={{ STATIC_VERSION }}">
</head>
<body>
{% include '_navbar.html' %}


    <div class="container">
        <!-- 鏄ㄦ棩瀹屾垚 -->
        <div class="panel">
            <div class="panel-title">
                鉁?鏄ㄦ棩瀹屾垚
                <span class="badge" id="yesterdayCount">0 椤?/span>
                <button class="action-btn ghost" style="margin-left:auto;padding:4px 10px;font-size:11px;" onclick="toggleJiraImport()">馃敆 浠嶫ira瀵煎叆</button>
                <button class="action-btn ghost" style="padding:4px 10px;font-size:11px;" onclick="importMeetingTodos()">馃搵 浠庝細璁邯瑕佸鍏?/button>
            </div>
            <div class="jira-panel" id="jiraPanel">
                <div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;">杈撳叆Jira绛涢€夊櫒URL鎴朖QL锛屽鍏ユ槰鏃ュ凡瑙ｅ喅鐨勯棶棰?/div>
                <div class="input-row">
                    <input type="text" id="jiraUrl" placeholder="Jira绛涢€夊櫒URL 鎴?JQL锛堝锛歱roject=XXX AND status changed to Done after -1d锛?>
                    <button class="action-btn primary" style="flex:0 0 auto;" onclick="importFromJira()">瀵煎叆</button>
                </div>
            </div>
            <div class="input-row">
                <input type="text" id="yesterdayInput" placeholder="杈撳叆涓€椤瑰畬鎴愮殑宸ヤ綔锛屽洖杞︽坊鍔?.." onkeydown="if(event.key==='Enter'){addItem('yesterday');}">
                <button class="action-btn primary" onclick="addItem('yesterday')">娣诲姞</button>
            </div>
            <div class="tag-list" id="yesterdayTags"></div>
        </div>

        <!-- 浠婃棩璁″垝 -->
        <div class="panel">
            <div class="panel-title">
                馃搶 浠婃棩璁″垝
                <span class="badge" id="todayCount">0 椤?/span>
            </div>
            <div class="input-row">
                <input type="text" id="todayInput" placeholder="杈撳叆浠婃棩璁″垝椤癸紝鍥炶溅娣诲姞..." onkeydown="if(event.key==='Enter'){addItem('today');}">
                <button class="action-btn primary" onclick="addItem('today')">娣诲姞</button>
            </div>
            <div class="tag-list" id="todayTags"></div>
        </div>

        <!-- 闃诲椤?-->
        <div class="panel">
            <div class="panel-title">
                鈿狅笍 闃诲椤?
                <span class="badge" id="blockerCount">0 椤?/span>
            </div>
            <div class="input-row">
                <input type="text" id="blockerInput" placeholder="杈撳叆闃诲椤癸紝鍥炶溅娣诲姞..." onkeydown="if(event.key==='Enter'){addItem('blocker');}">
                <button class="action-btn primary" onclick="addItem('blocker')">娣诲姞</button>
            </div>
            <div class="tag-list" id="blockerTags"></div>
        </div>

        <!-- 鑷姩鍖栬缃?-->
        <div class="panel">
            <div class="panel-title" style="cursor:pointer;" onclick="toggleSettings()">
                鈿欙笍 鑷姩鍖栬缃?
                <span class="badge" id="autoStatus">鏈厤缃?/span>
                <span style="margin-left:auto;font-size:12px;" id="settingsToggle">鈻?/span>
            </div>
            <div id="settingsPanel" style="display:none;margin-top:12px;">
                <div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;">淇濆瓨鍚庯紝椤甸潰鍔犺浇鏃惰嚜鍔ㄦ媺鍙朖ira鏁版嵁骞剁敓鎴愮珯浼?/div>
                <div class="input-row">
                    <input type="text" id="cfgJiraUrl" placeholder="Jira绛涢€夊櫒URL 鎴?JQL锛堟瘡鏃ヨ嚜鍔ㄦ媺鍙栨槰鏃ュ凡瑙ｅ喅锛?>
                </div>
                <div class="input-row">
                    <input type="text" id="cfgFeishuWebhook" placeholder="椋炰功Webhook URL锛堝彲閫夛紝鑷姩鎺ㄩ€佺敤锛?>
                </div>
                <div style="display:flex;gap:12px;align-items:center;margin:8px 0;font-size:13px;">
                    <label><input type="checkbox" id="cfgAutoFetch"> 椤甸潰鍔犺浇鏃惰嚜鍔ㄦ媺鍙朖ira</label>
                    <label><input type="checkbox" id="cfgAutoGenerate"> 鎷夊彇鍚庤嚜鍔ㄧ敓鎴愮珯浼氭枃鏈?/label>
                    <label><input type="checkbox" id="cfgAutoPush"> 鐢熸垚鍚庤嚜鍔ㄦ帹閫佸埌椋炰功</label>
                </div>
                <div class="input-row">
                    <input type="time" id="cfgReminderTime" value="09:30" style="flex:0 0 120px;">
                    <label style="font-size:13px;display:flex;align-items:center;gap:6px;"><input type="checkbox" id="cfgReminder"> 姣忔棩鎻愰啋鍐欑珯浼?/label>
                </div>
                <div class="btn-group">
                    <button class="action-btn primary" onclick="saveSettings()">馃捑 淇濆瓨璁剧疆</button>
                    <button class="action-btn ghost" onclick="clearSettings()">馃棏锔?娓呴櫎</button>
                </div>
            </div>
        </div>

        <!-- 鐢熸垚鎸夐挳 -->
        <div class="panel" style="text-align:center;">
            <button class="action-btn primary" style="padding:12px 32px;font-size:15px;" onclick="generateStandup()" id="generateBtn">
                鉁?鐢熸垚绔欎細鏂囨湰
            </button>
            <button class="action-btn ghost" style="padding:12px 20px;font-size:14px;margin-left:8px;" onclick="aiGenerateStandup()" id="aiBtn">
                馃 AI娑﹁壊
            </button>
            <button class="action-btn success" style="padding:12px 24px;font-size:14px;margin-left:8px;" onclick="fullAuto()" id="autoBtn">
                馃殌 涓€閿叏鑷姩
            </button>
            <button class="action-btn ghost" style="padding:12px 20px;font-size:14px;margin-left:8px;" onclick="generateWeeklyReport()" id="weeklyBtn">
                馃搵 鐢熸垚鍛ㄦ姤
            </button>
        </div>

        <!-- 杈撳嚭 -->
        <div class="panel">
            <div class="panel-title">
                馃搵 绔欎細鏂囨湰
                <div style="margin-left:auto;display:flex;gap:6px;">
                    <button class="action-btn ghost" style="padding:4px 10px;font-size:11px;" onclick="copyStandup()">馃搵 澶嶅埗</button>
                    <button class="action-btn ghost" style="padding:4px 10px;font-size:11px;" onclick="pushToFeishu()">馃摠 鎺ㄩ涔?/button>
                    <button class="action-btn ghost" style="padding:4px 10px;font-size:11px;" onclick="saveStandup()">馃捑 淇濆瓨</button>
                </div>
            </div>
            <div class="output-area empty" id="outputArea">濉啓涓婃柟鍐呭鍚庣偣鍑汇€岀敓鎴愮珯浼氭枃鏈€?/div>
        </div>

        <!-- 鍘嗗彶璁板綍 -->
        <div class="panel">
            <div class="panel-title">馃摎 鍘嗗彶璁板綍 <span class="badge" id="historyCount">0 鏉?/span></div>
            <div id="historyList"></div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'standup_history';
        let items = { yesterday: [], today: [], blocker: [] };
        let currentStandup = '';

        function addItem(type) {
            const input = document.getElementById(type + 'Input');
            const val = input.value.trim();
            if (!val) return;
            items[type].push(val);
            input.value = '';
            renderTags(type);
        }

        function removeItem(type, idx) {
            items[type].splice(idx, 1);
            renderTags(type);
        }

        function renderTags(type) {
            const container = document.getElementById(type + 'Tags');
            const count = document.getElementById(type + 'Count');
            count.textContent = items[type].length + ' 椤?;
            container.innerHTML = items[type].map((item, i) =>
                `<span class="tag">${escapeHtml(item)} <span class="remove" onclick="removeItem('${type}',${i})">鉁?/span></span>`
            ).join('');
        }

        function toggleJiraImport() {
            document.getElementById('jiraPanel').classList.toggle('show');
        }

        async function importFromJira() {
            const url = document.getElementById('jiraUrl').value.trim();
            if (!url) { showToast('璇疯緭鍏ira URL鎴朖QL', 'warning'); return; }
            showToast('姝ｅ湪浠嶫ira瀵煎叆...', 'info');
            try {
                const resp = await fetch('/api/jira-search', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ jira_url: url, max_results: 20 })
                });
                const data = await resp.json();
                if (data.error) throw new Error(data.error);
                const issues = data.issues || data.data?.issues || [];
                issues.forEach(issue => {
                    const summary = issue.summary || issue.fields?.summary || issue.key;
                    items.yesterday.push(`[${issue.key}] ${summary}`);
                });
                renderTags('yesterday');
                showToast(`宸插鍏?${issues.length} 鏉ira璁板綍`, 'success');
            } catch(e) {
                showToast('Jira瀵煎叆澶辫触: ' + e.message, 'error');
            }
        }

        function importMeetingTodos() {
            try {
                const raw = sessionStorage.getItem('v5_plan_transfer');
                if (raw) {
                    const data = JSON.parse(raw);
                    if (data.todos) {
                        const lines = data.todos.split('\n').filter(l => l.trim());
                        lines.forEach(l => items.yesterday.push(l.replace(/^[-*鈥d.)\s]+/, '').trim()));
                        renderTags('yesterday');
                        showToast(`宸蹭粠浼氳绾瀵煎叆 ${lines.length} 鏉″緟鍔瀈, 'success');
                        return;
                    }
                }
                showToast('鏆傛棤鍙鍏ョ殑浼氳寰呭姙', 'info');
            } catch(e) {
                showToast('瀵煎叆澶辫触: ' + e.message, 'error');
            }
        }

        function generateStandup() {
            const today = new Date().toLocaleDateString('zh-CN');
            let text = `銆愭瘡鏃ョ珯浼氥€?{today}\n\n`;

            text += `鉁?鏄ㄦ棩瀹屾垚锛歕n`;
            if (items.yesterday.length > 0) {
                items.yesterday.forEach((item, i) => text += `${i+1}. ${item}\n`);
            } else {
                text += `锛堟棤锛塡n`;
            }

            text += `\n馃搶 浠婃棩璁″垝锛歕n`;
            if (items.today.length > 0) {
                items.today.forEach((item, i) => text += `${i+1}. ${item}\n`);
            } else {
                text += `锛堟棤锛塡n`;
            }

            text += `\n鈿狅笍 闃诲椤癸細\n`;
            if (items.blocker.length > 0) {
                items.blocker.forEach((item, i) => text += `${i+1}. ${item}\n`);
            } else {
                text += `锛堟棤锛塡n`;
            }

            currentStandup = text;
            const output = document.getElementById('outputArea');
            output.textContent = text;
            output.classList.remove('empty');
            showToast('绔欎細鏂囨湰宸茬敓鎴?, 'success');
        }

        async function aiGenerateStandup() {
            if (items.yesterday.length === 0 && items.today.length === 0) {
                showToast('璇峰厛濉啓鍐呭', 'warning'); return;
            }
            generateStandup();
            const btn = document.getElementById('aiBtn');
            btn.disabled = true; btn.textContent = '馃 AI娑﹁壊涓?..';
            try {
                const resp = await fetch('/api/generate-minutes', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        transcript: currentStandup,
                        title: '姣忔棩绔欎細',
                        attendees: '',
                        prompt: '璇峰皢浠ヤ笅绔欎細鍐呭娑﹁壊涓虹畝娲佷笓涓氱殑绔欎細姹囨姤鏂囨湰锛屼繚鎸佷笁鐐圭粨鏋勶紙鏄ㄦ棩瀹屾垚/浠婃棩璁″垝/闃诲椤癸級锛岃瑷€绮剧偧锛岄€傚悎鍦ㄥ洟闃熺兢鍙戦€併€?
                    })
                });
                const data = await resp.json();
                if (data.result || data.data) {
                    currentStandup = data.result || data.data;
                    document.getElementById('outputArea').textContent = currentStandup;
                    showToast('AI娑﹁壊瀹屾垚', 'success');
                } else {
                    showToast('AI杩斿洖涓虹┖锛屼娇鐢ㄥ師濮嬫枃鏈?, 'info');
                }
            } catch(e) {
                showToast('AI娑﹁壊澶辫触: ' + e.message, 'error');
            } finally {
                btn.disabled = false; btn.textContent = '馃 AI娑﹁壊';
            }
        }

        function copyStandup() {
            if (!currentStandup) { showToast('璇峰厛鐢熸垚绔欎細鏂囨湰', 'warning'); return; }
            navigator.clipboard.writeText(currentStandup).then(() =>
                showToast('宸插鍒跺埌鍓创鏉?, 'success')
            ).catch(() => showToast('澶嶅埗澶辫触', 'error'));
        }

        async function pushToFeishu() {
            if (!currentStandup) { showToast('璇峰厛鐢熸垚绔欎細鏂囨湰', 'warning'); return; }
            try {
                showToast('姝ｅ湪鎺ㄩ€佸埌椋炰功...', 'info');
                const resp = await fetch('/api/feishu/push', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        type: 'standup',
                        title: '馃棑锔?姣忔棩绔欎細 ' + new Date().toLocaleDateString('zh-CN'),
                        content: currentStandup,
                        summary: currentStandup.substring(0, 200)
                    })
                });
                const data = await resp.json();
                if (data.error) throw new Error(data.error);
                showToast('宸叉帹閫佸埌椋炰功', 'success');
            } catch(e) {
                showToast('鎺ㄩ€佸け璐? ' + e.message, 'error');
            }
        }

        function saveStandup() {
            if (!currentStandup) { showToast('璇峰厛鐢熸垚绔欎細鏂囨湰', 'warning'); return; }
            const history = getHistory();
            history.unshift({
                date: new Date().toISOString(),
                text: currentStandup,
                items: JSON.parse(JSON.stringify(items))
            });
            if (history.length > 30) history.pop();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
            renderHistory();
            showToast('宸蹭繚瀛樺埌鍘嗗彶璁板綍', 'success');
        }

        function getHistory() {
            try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
            catch(e) { return []; }
        }

        // ===== 鐢熸垚鍛ㄦ姤锛氭眹鎬绘渶杩戜竴鍛ㄧ珯浼氳褰?=====
        function generateWeeklyReport() {
            const history = getHistory();
            const oneWeekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
            const recent = history.filter(function(h) {
                return new Date(h.date).getTime() >= oneWeekAgo;
            });
            if (recent.length === 0) {
                showToast('鏈€杩戜竴鍛ㄦ殏鏃犵珯浼氳褰曪紝璇峰厛淇濆瓨绔欎細', 'warning');
                return;
            }
            // 姹囨€诲悇瀛楁
            var completed = [], inProgress = [], nextPlan = [], risks = [];
            recent.forEach(function(h) {
                var items = h.items || {};
                (items.yesterday || []).forEach(function(t) {
                    if (t && t.text) completed.push(t.text);
                });
                (items.today || []).forEach(function(t) {
                    if (t && t.text) inProgress.push(t.text);
                });
                (items.blocker || []).forEach(function(t) {
                    if (t && t.text) risks.push(t.text);
                });
            });
            // 鍘婚噸
            function uniq(arr) { return Array.from(new Set(arr)); }
            var transferData = {
                source: 'daily-standup',
                week_range: new Date(oneWeekAgo).toISOString().split('T')[0] + ' ~ ' + new Date().toISOString().split('T')[0],
                completed: uniq(completed),
                in_progress: uniq(inProgress),
                next_plan: uniq(inProgress),
                risks: uniq(risks),
                standup_count: recent.length,
                timestamp: new Date().toISOString()
            };
            try {
                var prefix = window._USER_PREFIX || '';
                var key = prefix + 'pipeline_daily-standup_' + Date.now();
                localStorage.setItem(key, JSON.stringify(transferData));
                showToast('馃搵 姝ｅ湪璺宠浆鍒板懆鎶ョ敓鎴愬櫒...', 'info');
                setTimeout(function() { window.location.href = '/weekly-report'; }, 500);
            } catch(e) {
                showToast('鉂?鏁版嵁浼犻€掑け璐? ' + e.message, 'error');
            }
        }

        function renderHistory() {
            const history = getHistory();
            document.getElementById('historyCount').textContent = history.length + ' 鏉?;
            const list = document.getElementById('historyList');
            if (history.length === 0) {
                list.innerHTML = '<div style="text-align:center;padding:16px;color:var(--text-secondary);font-size:13px;">鏆傛棤鍘嗗彶璁板綍</div>';
                return;
            }
            list.innerHTML = history.map((h, i) => {
                const d = new Date(h.date);
                const dateStr = d.toLocaleDateString('zh-CN') + ' ' + d.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
                const preview = h.text.replace(/\n/g, ' ').substring(0, 60);
                return `<div class="history-item" onclick="loadHistory(${i})">
                    <span class="history-date">${dateStr}</span>
                    <span class="history-preview">${escapeHtml(preview)}</span>
                    <span style="color:#ef4444;cursor:pointer;font-size:12px;" onclick="event.stopPropagation();deleteHistory(${i})">馃棏锔?/span>
                </div>`;
            }).join('');
        }

        function loadHistory(idx) {
            const history = getHistory();
            const h = history[idx];
            if (!h) return;
            items = h.items || { yesterday: [], today: [], blocker: [] };
            currentStandup = h.text;
            renderTags('yesterday'); renderTags('today'); renderTags('blocker');
            const output = document.getElementById('outputArea');
            output.textContent = h.text;
            output.classList.remove('empty');
            showToast('宸插姞杞藉巻鍙茶褰?, 'info');
        }

        function deleteHistory(idx) {
            const history = getHistory();
            history.splice(idx, 1);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
            renderHistory();
            showToast('宸插垹闄?, 'success');
        }

        function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        function showToast(msg, type) {
            if (typeof ToolboxToast !== 'undefined') { ToolboxToast.show(msg, type || 'info'); return; }
            console.log(msg);
        }

        // ==================== 鑷姩鍖栬缃?====================
        const CFG_KEY = 'standup_auto_config';
        let autoConfig = {};

        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            const toggle = document.getElementById('settingsToggle');
            if (panel.style.display === 'none') {
                panel.style.display = 'block';
                toggle.textContent = '鈻?;
            } else {
                panel.style.display = 'none';
                toggle.textContent = '鈻?;
            }
        }

        function saveSettings() {
            autoConfig = {
                jiraUrl: document.getElementById('cfgJiraUrl').value.trim(),
                feishuWebhook: document.getElementById('cfgFeishuWebhook').value.trim(),
                autoFetch: document.getElementById('cfgAutoFetch').checked,
                autoGenerate: document.getElementById('cfgAutoGenerate').checked,
                autoPush: document.getElementById('cfgAutoPush').checked,
                reminder: document.getElementById('cfgReminder').checked,
                reminderTime: document.getElementById('cfgReminderTime').value,
            };
            localStorage.setItem(CFG_KEY, JSON.stringify(autoConfig));
            updateAutoStatus();
            if (autoConfig.reminder) setupReminder();
            showToast('鑷姩鍖栬缃凡淇濆瓨', 'success');
        }

        function loadSettings() {
            try {
                autoConfig = JSON.parse(localStorage.getItem(CFG_KEY) || '{}');
            } catch(e) { autoConfig = {}; }
            document.getElementById('cfgJiraUrl').value = autoConfig.jiraUrl || '';
            document.getElementById('cfgFeishuWebhook').value = autoConfig.feishuWebhook || '';
            document.getElementById('cfgAutoFetch').checked = !!autoConfig.autoFetch;
            document.getElementById('cfgAutoGenerate').checked = !!autoConfig.autoGenerate;
            document.getElementById('cfgAutoPush').checked = !!autoConfig.autoPush;
            document.getElementById('cfgReminder').checked = !!autoConfig.reminder;
            document.getElementById('cfgReminderTime').value = autoConfig.reminderTime || '09:30';
            updateAutoStatus();
        }

        function clearSettings() {
            localStorage.removeItem(CFG_KEY);
            autoConfig = {};
            document.getElementById('cfgJiraUrl').value = '';
            document.getElementById('cfgFeishuWebhook').value = '';
            document.getElementById('cfgAutoFetch').checked = false;
            document.getElementById('cfgAutoGenerate').checked = false;
            document.getElementById('cfgAutoPush').checked = false;
            document.getElementById('cfgReminder').checked = false;
            updateAutoStatus();
            showToast('璁剧疆宸叉竻闄?, 'success');
        }

        function updateAutoStatus() {
            const status = document.getElementById('autoStatus');
            const features = [];
            if (autoConfig.autoFetch) features.push('鑷姩鎷夊彇');
            if (autoConfig.autoGenerate) features.push('鑷姩鐢熸垚');
            if (autoConfig.autoPush) features.push('鑷姩鎺ㄩ€?);
            if (autoConfig.reminder) features.push('鎻愰啋');
            status.textContent = features.length > 0 ? features.join('+') : '鏈厤缃?;
            status.style.background = features.length > 0 ? 'rgba(16,185,129,0.15)' : 'rgba(102,126,234,0.1)';
            status.style.color = features.length > 0 ? '#10b981' : '#667eea';
        }

        // 涓€閿叏鑷姩锛氭媺鍙朖ira 鈫?鐢熸垚 鈫?鎺ㄩ€侀涔?
        async function fullAuto() {
            const btn = document.getElementById('autoBtn');
            btn.disabled = true;
            const originalText = btn.textContent;
            try {
                // 1. 鎷夊彇Jira
                if (autoConfig.jiraUrl || document.getElementById('jiraUrl').value) {
                    btn.textContent = '馃敆 鎷夊彇Jira涓?..';
                    const url = document.getElementById('jiraUrl').value.trim() || autoConfig.jiraUrl;
                    if (url) {
                        document.getElementById('jiraUrl').value = url;
                        await importFromJira();
                    }
                }

                // 2. 鐢熸垚绔欎細鏂囨湰
                btn.textContent = '鉁?鐢熸垚涓?..';
                generateStandup();
                await new Promise(r => setTimeout(r, 500));

                // 3. 鑷姩鎺ㄩ€侀涔?
                if (autoConfig.autoPush || autoConfig.feishuWebhook) {
                    btn.textContent = '馃摠 鎺ㄩ€侀涔︿腑...';
                    await pushToFeishu();
                }

                // 4. 淇濆瓨鍘嗗彶
                saveStandup();
                showToast('馃帀 鍏ㄨ嚜鍔ㄥ畬鎴愶紒绔欎細宸茬敓鎴愬苟鎺ㄩ€?, 'success');
            } catch(e) {
                showToast('鍏ㄨ嚜鍔ㄦ墽琛屽け璐? ' + e.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        }

        // 姣忔棩鎻愰啋
        let reminderTimer = null;
        function setupReminder() {
            if (!autoConfig.reminder || !autoConfig.reminderTime) return;
            if (reminderTimer) clearInterval(reminderTimer);
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
            reminderTimer = setInterval(() => {
                const now = new Date();
                const [h, m] = autoConfig.reminderTime.split(':').map(Number);
                if (now.getHours() === h && now.getMinutes() === m && now.getSeconds() < 5) {
                    if ('Notification' in window && Notification.permission === 'granted') {
                        new Notification('馃棑锔?姣忔棩绔欎細鎻愰啋', {
                            body: '璇ュ啓浠婂ぉ鐨勭珯浼氫簡锛佺偣鍑绘墦寮€绔欎細鍔╂墜',
                            icon: '/static/favicon.ico'
                        });
                    }
                    showToast('馃棑锔?绔欎細鎻愰啋锛氳鍐欎粖澶╃殑绔欎細浜嗭紒', 'info');
                }
            }, 30000);
        }

        // 椤甸潰鍔犺浇鏃惰嚜鍔ㄦ墽琛?
        async function autoRunOnLoad() {
            loadSettings();
            if (autoConfig.autoFetch && autoConfig.jiraUrl) {
                showToast('馃敆 姝ｅ湪鑷姩鎷夊彇Jira鏁版嵁...', 'info');
                document.getElementById('jiraUrl').value = autoConfig.jiraUrl;
                try {
                    await importFromJira();
                    if (autoConfig.autoGenerate) {
                        generateStandup();
                        if (autoConfig.autoPush) {
                            setTimeout(() => pushToFeishu(), 1000);
                        }
                    }
                } catch(e) {
                    showToast('鑷姩鎷夊彇澶辫触: ' + e.message, 'warning');
                }
            }
            if (autoConfig.reminder) setupReminder();
        }

        // 鍒濆鍖?
        renderTags('yesterday');
        renderTags('today');
        renderTags('blocker');
        renderHistory();
        autoRunOnLoad();
    </script>
    <script src="/static/js/components.js?v={{ STATIC_VERSION }}"></script>
    <script src="/static/js/ux-enhancements.js?v={{ STATIC_VERSION }}"></script>
</body>
</html>
