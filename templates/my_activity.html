<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的活动</title>
    <link rel="stylesheet" href="/static/css/theme.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/design-system.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/components.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/mobile.css?v={{ STATIC_VERSION }}">
    
<link rel="stylesheet" href="/static/css/page/my_activity.css?v={{ STATIC_VERSION }}">
</head>
<body>
    {% include '_navbar.html' %}

    <div class="page-wrap">
        <div class="page-header">
            <div>
                <h1>我的活动</h1>
                <div class="meta">工具使用统计与个人效能分析</div>
            </div>
            <div class="toolbar">
                <a href="/api/export-my-data?format=json" class="btn" id="btn-export-json">
                    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    导出 JSON
                </a>
                <a href="/api/export-my-data?format=csv" class="btn" id="btn-export-csv">
                    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    导出 CSV
                </a>
            </div>
        </div>

        <div class="period-tabs">
            <button class="period-tab active" data-days="7">近 7 天</button>
            <button class="period-tab" data-days="30">近 30 天</button>
            <button class="period-tab" data-days="90">近 90 天</button>
        </div>

        <div id="stats-grid" class="grid">
            <div class="loading"><span class="spinner"></span> 加载中...</div>
        </div>

        <div id="charts-section" style="display:none">
            <div class="card">
                <div class="card-title">每日活动趋势</div>
                <div class="chart-container"><canvas id="dailyChart"></canvas></div>
            </div>

            <div class="card">
                <div class="card-title">工具使用分布</div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center">
                    <div class="chart-container"><canvas id="pieChart"></canvas></div>
                    <div id="pie-legend"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">工具使用详情</div>
                <table class="tool-table">
                    <thead>
                        <tr>
                            <th>工具</th>
                            <th>使用次数</th>
                            <th>占比</th>
                            <th>最后使用</th>
                        </tr>
                    </thead>
                    <tbody id="tool-tbody"></tbody>
                </table>
            </div>
        </div>

        <div id="empty-state" class="card empty-state" style="display:none">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3v18h18"/><path d="M7 14l3-3 3 3 5-5"/></svg>
            <div style="font-size:16px;font-weight:600;margin-bottom:4px">暂无活动数据</div>
            <div style="font-size:13px">使用工具后，这里会显示你的使用统计</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    
<script src="/static/js/page/my_activity.js?v={{ STATIC_VERSION }}"></script>
</body>
</html>
