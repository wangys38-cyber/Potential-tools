<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>研发健康度看板</title>
    <link rel="stylesheet" href="/static/css/theme.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/design-system.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/components.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/mobile.css?v={{ STATIC_VERSION }}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--ds-bg-secondary); min-height: 100vh; color: var(--ds-text); -webkit-font-smoothing: antialiased; }
        .page-wrap { max-width: 1280px; margin: 0 auto; padding: 24px 20px 60px; }
        .page-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
        .page-header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
        .page-header .meta { font-size: 12px; color: var(--ds-text-secondary); text-align: right; }

        .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
        .card {
            background: var(--ds-bg-elevated); border: 1px solid var(--ds-border-light);
            border-radius: var(--ds-radius-xl); padding: 20px;
            box-shadow: var(--ds-shadow-sm); transition: box-shadow 0.2s, transform 0.2s;
            cursor: pointer; position: relative; overflow: hidden;
        }
        .card:hover { box-shadow: var(--ds-shadow-md); transform: translateY(-2px); }
        .card-title { font-size: 14px; font-weight: 600; color: var(--ds-text); display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
        .card-title .badge { margin-left: auto; font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: var(--ds-radius-pill); background: var(--ds-bg-secondary); color: var(--ds-text-secondary); }
        .card-title svg { flex-shrink: 0; }

        .col-4 { grid-column: span 4; }
        .col-6 { grid-column: span 6; }
        .col-8 { grid-column: span 8; }
        .col-12 { grid-column: span 12; }

        .chart-mini { position: relative; height: 140px; }
        .chart-sm { position: relative; height: 180px; }
        .chart-md { position: relative; height: 240px; }

        .stat-row { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
        .stat-item { font-size: 12px; color: var(--ds-text-secondary); }
        .stat-item strong { color: var(--ds-text); font-size: 18px; display: block; font-weight: 700; }

        .mttf-value { font-size: 36px; font-weight: 700; letter-spacing: -1px; color: var(--ds-text); }
        .mttf-unit { font-size: 14px; color: var(--ds-text-secondary); font-weight: 400; }
        .mttf-trend { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: var(--ds-radius-pill); margin-top: 6px; }
        .mttf-trend.up { background: rgba(52,199,89,0.12); color: #34c759; }
        .mttf-trend.down { background: rgba(255,59,48,0.12); color: #ff3b30; }

        .eff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .eff-item { text-align: center; padding: 12px 8px; background: var(--ds-bg-secondary); border-radius: var(--ds-radius-md); }
        .eff-num { font-size: 24px; font-weight: 700; color: var(--ds-text); }
        .eff-label { font-size: 11px; color: var(--ds-text-secondary); margin-top: 2px; }

        .gantt-wrap { overflow-x: auto; }

        .proj-list { font-size: 13px; }
        .proj-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--ds-border-light); }
        .proj-row:last-child { border-bottom: none; }
        .proj-key { color: var(--ds-text-secondary); }
        .proj-val { color: var(--ds-text); font-weight: 500; }
        .tag { display: inline-block; padding: 1px 8px; border-radius: var(--ds-radius-pill); font-size: 11px; font-weight: 600; }
        .tag-active { background: rgba(52,199,89,0.12); color: #34c759; }
        .tag-version { background: var(--ds-bg-secondary); color: var(--ds-text); }

        .empty-hint { text-align: center; padding: 20px 12px; font-size: 12px; color: var(--ds-text-tertiary); }

        @media (max-width: 900px) { .col-4, .col-6, .col-8 { grid-column: span 12; } }
    </style>
</head>
<body>
{% include '_navbar.html' %}

<div class="page-wrap">
    <div class="page-header">
        <div><h1>研发健康度看板</h1></div>
        <div class="meta" id="updateTime">数据更新: -</div>
    </div>

    <div class="grid">
        <!-- Bug 趋势卡片 -->
        <div class="card col-8" onclick="window.location.href='/bug-trend'">
            <div class="card-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                Bug 趋势
                <span class="badge">最近4周</span>
            </div>
            <div class="chart-md" id="bugTrendWrap"><canvas id="bugTrendChart"></canvas></div>
            <div class="stat-row" id="bugSummary"></div>
        </div>

        <!-- MTTF 卡片 -->
        <div class="card col-4" onclick="window.location.href='/mttf-dashboard'">
            <div class="card-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                MTTF 指标
                <span class="badge">最近5次</span>
            </div>
            <div class="mttf-value" id="mttfValue">--<span class="mttf-unit"> h</span></div>
            <div class="mttf-trend" id="mttfTrend" style="display:none;"></div>
            <div class="chart-mini" style="margin-top:12px;" id="mttfTrendWrap"><canvas id="mttfTrendChart"></canvas></div>
        </div>

        <!-- 研发效能卡片 -->
        <div class="card col-6" onclick="window.location.href='/excel-analysis'">
            <div class="card-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                研发效能
                <span class="badge">团队整体</span>
            </div>
            <div class="eff-grid" id="effGrid"></div>
            <div class="chart-sm" id="effTrendWrap"><canvas id="effTrendChart"></canvas></div>
        </div>

        <!-- 版本进度卡片（甘特图） -->
        <div class="card col-6" onclick="window.location.href='/plan-generator'">
            <div class="card-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                版本进度
                <span class="badge">甘特图</span>
            </div>
            <div class="gantt-wrap" id="ganttContainer"></div>
        </div>

        <!-- 项目概览卡片 -->
        <div class="card col-12" onclick="window.location.href='/project-info'" style="cursor:default;">
            <div class="card-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                项目概览
                <span class="badge">E62 / SR5 / SR6</span>
            </div>
            <div class="proj-list" id="projList"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="/static/js/chart-library.js?v={{ STATIC_VERSION }}"></script>
<script>
(function() {
    'use strict';

    function $(id) { return document.getElementById(id); }
    function safeGet(key) { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch(e) { return null; } }

    $('updateTime').textContent = '数据更新: ' + new Date().toLocaleString('zh-CN');

    var charts = {};

    // ========== Bug 趋势（最近4周） ==========
    function renderBugTrend() {
        var crData = safeGet('cr_analysis_result') || safeGet('excel_analysis_last');
        var weeks, newVals, resolvedVals;
        if (crData && crData.daily_stats && crData.daily_stats.length) {
            // 从 daily_stats 按周聚合
            var daily = crData.daily_stats;
            var weekMap = {};
            daily.forEach(function(d) {
                var dt = new Date(d.date);
                if (isNaN(dt)) return;
                var day = dt.getDay() || 7;
                dt.setDate(dt.getDate() + 4 - day);
                var wk = dt.getFullYear() + '-W' + String(Math.ceil(((dt - new Date(dt.getFullYear(),0,1))/86400000+1)/7)).padStart(2,'0');
                if (!weekMap[wk]) weekMap[wk] = { new: 0, resolved: 0 };
                weekMap[wk].new += d.new_count || 0;
                weekMap[wk].resolved += d.resolved_count || 0;
            });
            var wks = Object.keys(weekMap).sort().slice(-4);
            weeks = wks.map(function(w){return w.replace(/^\d{4}-/,'');});
            newVals = wks.map(function(w){return weekMap[w].new;});
            resolvedVals = wks.map(function(w){return weekMap[w].resolved;});
        } else {
            // 默认示例数据
            weeks = ['W30','W31','W32','W33'];
            newVals = [12, 8, 15, 10];
            resolvedVals = [10, 9, 12, 14];
        }

        charts.bugTrend = PTChart.destroy(charts.bugTrend);
        charts.bugTrend = PTChart.create('bugTrendChart', {
            type: 'line',
            data: {
                labels: weeks,
                datasets: [
                    { label: '新增', data: newVals, borderColor: '#ff3b30', backgroundColor: 'rgba(255,59,48,0.1)', fill: true, tension: 0.3, borderWidth: 2, pointRadius: 4 },
                    { label: '解决', data: resolvedVals, borderColor: '#34c759', backgroundColor: 'rgba(52,199,89,0.1)', fill: true, tension: 0.3, borderWidth: 2, pointRadius: 4 }
                ]
            },
            options: { plugins: { legend: { position: 'top' } }, scales: { y: { beginAtZero: true } } }
        });

        var totalNew = newVals.reduce(function(a,b){return a+b;},0);
        var totalResolved = resolvedVals.reduce(function(a,b){return a+b;},0);
        var net = totalNew - totalResolved;
        $('bugSummary').innerHTML =
            '<div class="stat-item"><strong>' + totalNew + '</strong>4周新增</div>' +
            '<div class="stat-item"><strong>' + totalResolved + '</strong>4周解决</div>' +
            '<div class="stat-item"><strong style="color:' + (net>0?'#ff3b30':'#34c759') + ';">' + (net>=0?'+':'') + net + '</strong>净增</div>';
    }

    // ========== MTTF 趋势（最近5次） ==========
    function renderMTTF() {
        var mttfData = safeGet('mttf_history') || safeGet('mttf_results');
        var values, labels;
        if (mttfData && mttfData.length) {
            var recent = mttfData.slice(-5);
            values = recent.map(function(d){return d.value || d.hours || d;});
            labels = recent.map(function(d,i){return '#' + (i+1);});
        } else {
            values = [96.5, 110.2, 105.8, 128.5, 134.2];
            labels = ['#1','#2','#3','#4','#5'];
        }

        var latest = values[values.length - 1];
        var prev = values.length > 1 ? values[values.length - 2] : latest;
        var pct = prev > 0 ? ((latest - prev) / prev * 100).toFixed(1) : 0;
        $('mttfValue').innerHTML = latest + '<span class="mttf-unit"> h</span>';
        var trendEl = $('mttfTrend');
        trendEl.style.display = 'inline-flex';
        trendEl.className = 'mttf-trend ' + (pct >= 0 ? 'up' : 'down');
        trendEl.textContent = (pct >= 0 ? '+' : '') + pct + '% 较上次';

        charts.mttf = PTChart.destroy(charts.mttf);
        charts.mttf = PTChart.create('mttfTrendChart', {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{ label: 'MTTF (h)', data: values, borderColor: '#000000', backgroundColor: 'rgba(0,0,0,0.08)', fill: true, tension: 0.3, borderWidth: 2, pointRadius: 4 }]
            },
            options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: false } } }
        });
    }

    // ========== 研发效能 ==========
    function renderEfficiency() {
        var crData = safeGet('cr_analysis_result') || safeGet('excel_analysis_last');
        var summary = crData && crData.summary ? crData.summary : {};
        var total = summary.total_issues || 156;
        var resolved = summary.total_resolved || 118;
        var rate = total > 0 ? (resolved / total * 100).toFixed(1) : 0;
        var avgTime = summary.avg_resolution_days || 3.2;
        var reopenRate = summary.reopen_rate || 5.8;

        $('effGrid').innerHTML =
            '<div class="eff-item"><div class="eff-num">' + rate + '%</div><div class="eff-label">团队解决率</div></div>' +
            '<div class="eff-item"><div class="eff-num">' + avgTime + 'd</div><div class="eff-label">平均解决时长</div></div>' +
            '<div class="eff-item"><div class="eff-num">' + reopenRate + '%</div><div class="eff-label">Reopen率</div></div>' +
            '<div class="eff-item"><div class="eff-num">' + resolved + '</div><div class="eff-label">已解决</div></div>';

        // 效能趋势（解决率近4周）
        var trendLabels = ['W30','W31','W32','W33'];
        var rateTrend = [72, 75, 78, parseFloat(rate)];
        charts.eff = PTChart.destroy(charts.eff);
        charts.eff = PTChart.create('effTrendChart', {
            type: 'line',
            data: {
                labels: trendLabels,
                datasets: [{ label: '解决率%', data: rateTrend, borderColor: '#34c759', backgroundColor: 'rgba(52,199,89,0.1)', fill: true, tension: 0.3, borderWidth: 2, pointRadius: 3 }]
            },
            options: { plugins: { legend: { display: false } }, scales: { y: { min: 60, max: 100 } } }
        });
    }

    // ========== 版本进度甘特图 ==========
    function renderGantt() {
        var planData = safeGet('project_plan') || safeGet('fix_plan');
        var tasks;
        if (planData && planData.tasks && planData.tasks.length) {
            tasks = planData.tasks.slice(0, 6).map(function(t) {
                return {
                    name: t.title || t.name || '任务',
                    start: t.start_date || t.start || new Date().toISOString().slice(0,10),
                    end: t.end_date || t.end || new Date(Date.now()+7*86400000).toISOString().slice(0,10),
                    progress: t.progress != null ? t.progress : (t.status === 'done' ? 100 : 30)
                };
            });
        } else {
            var today = new Date();
            tasks = [
                { name: 'SR6 CP2 质量攻坚', start: fmt(today, -7), end: fmt(today, 7), progress: 65 },
                { name: 'GPS轨迹偏移修复', start: fmt(today, -3), end: fmt(today, 4), progress: 40 },
                { name: '心率血氧算法优化', start: fmt(today, -10), end: fmt(today, 2), progress: 85 },
                { name: 'MTTF可靠性验证', start: fmt(today, 0), end: fmt(today, 14), progress: 20 },
                { name: '版本发布准备', start: fmt(today, 10), end: fmt(today, 17), progress: 0 }
            ];
        }
        PTChart.renderGantt('ganttContainer', tasks, { rowHeight: 32, labelWidth: 140, dayWidth: 20 });
    }

    function fmt(date, offset) {
        var d = new Date(date.getTime() + offset * 86400000);
        return d.toISOString().slice(0, 10);
    }

    // ========== 项目概览 ==========
    function renderProjectOverview() {
        var rows = [
            { key: '当前版本', val: 'v5.4.0 (阶段8)', tag: 'version' },
            { key: '项目状态', val: '活跃开发中', tag: 'active' },
            { key: '负责产品线', val: 'E62 / SR5 / SR6 智能手表' },
            { key: '当前里程碑', val: 'SR6 CP2 质量攻坚' },
            { key: '代码仓库', val: 'github.com/wangys38-cyber/Potential-tools' },
            { key: '部署平台', val: 'Railway (wangys666.top)' },
            { key: '技术栈', val: 'Flask + 原生前端 + Blueprint' }
        ];
        $('projList').innerHTML = rows.map(function(r) {
            var val = r.val;
            if (r.tag === 'version') val = '<span class="tag tag-version">' + val + '</span>';
            if (r.tag === 'active') val = '<span class="tag tag-active">' + val + '</span>';
            return '<div class="proj-row"><span class="proj-key">' + r.key + '</span><span class="proj-val">' + val + '</span></div>';
        }).join('');
    }

    // ========== 初始化 ==========
    renderBugTrend();
    renderMTTF();
    renderEfficiency();
    renderGantt();
    renderProjectOverview();

    // 异步拉取 API 数据（如果有）
    fetch('/api/dashboard/stats').then(function(r){return r.json();}).then(function(data){
        if (data.status === 'success' && data.data) {
            // 可在此处用真实数据覆盖默认值
        }
    }).catch(function(){});
})();
</script>
<script src="/static/js/components.js?v={{ STATIC_VERSION }}"></script>
</body>
</html>
