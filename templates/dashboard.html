<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>研发健康度看板</title>
    <link rel="stylesheet" href="/static/css/theme.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/design-system.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/components.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/mobile.css?v={{ STATIC_VERSION }}">
    
<link rel="stylesheet" href="/static/css/page/dashboard.css?v={{ STATIC_VERSION }}">
</head>
<body>
{% include '_navbar.html' %}

<div class="page-wrap">
    <div class="page-header">
        <div><h1>研发健康度看板</h1></div>
        <div class="meta" id="updateTime">数据更新: -</div>
    </div>

    <div class="grid">
        <!-- Bug 趋势卡片 -->
        <div class="card col-8" onclick="window.location.href='/bug-trend'">
            <div class="card-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                Bug 趋势
                <span class="badge">最近4周</span>
            </div>
            <div class="chart-md" id="bugTrendWrap"><canvas id="bugTrendChart"></canvas></div>
            <div class="stat-row" id="bugSummary"></div>
        </div>

        <!-- MTTF 卡片 -->
        <div class="card col-4" onclick="window.location.href='/mttf-dashboard'">
            <div class="card-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                MTTF 指标
                <span class="badge">最近5次</span>
            </div>
            <div class="mttf-value" id="mttfValue">--<span class="mttf-unit"> h</span></div>
            <div class="mttf-trend" id="mttfTrend" style="display:none;"></div>
            <div class="chart-mini" style="margin-top:12px;" id="mttfTrendWrap"><canvas id="mttfTrendChart"></canvas></div>
        </div>

        <!-- 研发效能卡片 -->
        <div class="card col-6" onclick="window.location.href='/excel-analysis'">
            <div class="card-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                研发效能
                <span class="badge">团队整体</span>
            </div>
            <div class="eff-grid" id="effGrid"></div>
            <div class="chart-sm" id="effTrendWrap"><canvas id="effTrendChart"></canvas></div>
        </div>

        <!-- 版本进度卡片（甘特图） -->
        <div class="card col-6" onclick="window.location.href='/plan-generator'">
            <div class="card-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                版本进度
                <span class="badge">甘特图</span>
            </div>
            <div class="gantt-wrap" id="ganttContainer"></div>
        </div>

        <!-- 项目概览卡片 -->
        <div class="card col-12" onclick="window.location.href='/project-info'" style="cursor:default;">
            <div class="card-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                项目概览
                <span class="badge">E62 / SR5 / SR6</span>
            </div>
            <div class="proj-list" id="projList"></div>
        </div>
    </div>
</div>

{# v8.0 目标4：Chart.js 与 chart-library 改为按需加载，首屏先渲染数字 #}

<script src="/static/js/components.js?v={{ STATIC_VERSION }}"></script>
<script src="/static/js/page/dashboard.js?v={{ STATIC_VERSION }}"></script>
</body>
</html>
