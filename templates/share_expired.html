<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>链接已失效 - Potential Tools</title>
    <link rel="stylesheet" href="/static/css/theme.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/mobile.css?v={{ STATIC_VERSION }}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f5f5f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a1a1a;
        }
        .expired-card {
            background: #fff;
            border-radius: 20px;
            padding: 48px 40px;
            text-align: center;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            max-width: 420px;
            width: 90%;
        }
        .expired-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        .expired-title {
            font-size: 22px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 8px;
        }
        .expired-desc {
            font-size: 14px;
            color: #86868b;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .expired-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 24px;
            border-radius: 980px;
            background: #1a1a1a;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.15s ease;
        }
        .expired-btn:hover { background: #333; transform: translateY(-1px); }
    </style>
</head>
<body>
<div class="expired-card">
    <div class="expired-icon">🔗</div>
    <div class="expired-title">链接已失效</div>
    <div class="expired-desc">该共享工作空间不存在或已过期。<br>请联系分享者获取最新链接。</div>
    <a href="/" class="expired-btn">🏠 返回首页</a>
</div>
</body>
</html>
