<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bug 趋势看板</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231d1d1f' stroke-width='2'><rect x='3' y='3' width='18' height='18' rx='2'/><path d='M9 9h6v6H9z'/></svg>">
    <link rel="stylesheet" href="/static/css/theme.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/design-system.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/components.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/mobile.css?v={{ STATIC_VERSION }}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--ds-bg-secondary); min-height: 100vh; color: var(--ds-text); -webkit-font-smoothing: antialiased; }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px 20px 60px; }
        .page-title { font-size: 24px; font-weight: 700; margin-bottom: 20px; color: var(--ds-text); }

        .upload-zone { border: 2px dashed var(--ds-border); border-radius: var(--ds-radius-xl); padding: 36px; text-align: center; cursor: pointer; transition: all 0.2s; background: var(--ds-bg-elevated); margin-bottom: 16px; }
        .upload-zone:hover, .upload-zone.dragover { border-color: var(--ds-text); background: var(--ds-bg-tertiary); }
        .upload-zone-text { font-size: 15px; color: var(--ds-text); font-weight: 500; }
        .upload-zone-hint { font-size: 12px; color: var(--ds-text-secondary); margin-top: 6px; }

        .version-list { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
        .version-pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: var(--ds-radius-pill); font-size: 13px; font-weight: 500; border: 1px solid var(--ds-border); background: var(--ds-bg-elevated); color: var(--ds-text); transition: all 0.2s; }
        .version-pill.active { background: var(--ds-text); color: var(--ds-bg); border-color: var(--ds-text); }
        .version-pill .remove { cursor: pointer; opacity: 0.6; font-size: 16px; line-height: 1; }
        .version-pill .remove:hover { opacity: 1; }

        .card { background: var(--ds-bg-elevated); border-radius: var(--ds-radius-xl); padding: 24px; margin-bottom: 16px; border: 1px solid var(--ds-border-light); }
        .card-title { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: var(--ds-text); display: flex; align-items: center; justify-content: space-between; }
        .chart-wrap { position: relative; height: 340px; }
        .chart-wrap-sm { position: relative; height: 280px; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
        .stat-card { background: var(--ds-bg-elevated); border-radius: var(--ds-radius-lg); padding: 16px; border: 1px solid var(--ds-border-light); }
        .stat-label { font-size: 12px; color: var(--ds-text-secondary); margin-bottom: 4px; }
        .stat-value { font-size: 26px; font-weight: 700; color: var(--ds-text); }

        .btn { padding: 8px 16px; border-radius: var(--ds-radius-md); border: 1px solid var(--ds-border); background: var(--ds-bg-elevated); cursor: pointer; font-size: 13px; color: var(--ds-text); transition: all 0.15s; font-family: inherit; }
        .btn:hover { background: var(--ds-bg-tertiary); }
        .btn-primary { background: var(--ds-text); color: var(--ds-bg); border-color: var(--ds-text); }
        .btn-primary:hover { opacity: 0.85; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }

        .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .data-table th { text-align: left; padding: 10px 12px; background: var(--ds-bg-secondary); color: var(--ds-text-secondary); font-weight: 600; border-bottom: 1px solid var(--ds-border-light); white-space: nowrap; }
        .data-table td { padding: 10px 12px; border-bottom: 1px solid var(--ds-border-light); color: var(--ds-text); }
        .data-table tbody tr:hover { background: var(--ds-bg-secondary); }
        .table-wrap { max-height: 360px; overflow: auto; border-radius: var(--ds-radius-md); border: 1px solid var(--ds-border-light); }

        .heatmap-wrap { overflow-x: auto; }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--ds-text-secondary); }
        .tabs { display: flex; gap: 4px; margin-bottom: 16px; background: var(--ds-bg-elevated); padding: 4px; border-radius: var(--ds-radius-lg); border: 1px solid var(--ds-border-light); width: fit-content; }
        .tab { padding: 8px 18px; border-radius: var(--ds-radius-md); cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; color: var(--ds-text-secondary); }
        .tab.active { background: var(--ds-text); color: var(--ds-bg); }

        .source-tabs { display: flex; gap: 4px; margin-bottom: 16px; background: var(--ds-bg-elevated); padding: 4px; border-radius: var(--ds-radius-lg); border: 1px solid var(--ds-border-light); width: fit-content; }
        .source-tab { padding: 8px 20px; border-radius: var(--ds-radius-md); cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s; color: var(--ds-text-secondary); }
        .source-tab.active { background: var(--ds-text); color: var(--ds-bg); }

        .jira-panel { background: var(--ds-bg-elevated); border-radius: var(--ds-radius-xl); padding: 20px; border: 1px solid var(--ds-border-light); margin-bottom: 16px; }
        .jira-config { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 14px; }
        .jira-config input, .jira-input-row input { padding: 9px 12px; border-radius: var(--ds-radius-md); border: 1px solid var(--ds-border); background: var(--ds-bg); color: var(--ds-text); font-size: 13px; width: 100%; }
        .jira-input-row { display: flex; gap: 10px; }
        .jira-input-row input { flex: 1; }
        .jira-hint { font-size: 12px; color: var(--ds-text-secondary); margin-top: 8px; }
        .error-msg { background: rgba(255,59,48,0.1); color: #ff3b30; padding: 10px 14px; border-radius: var(--ds-radius-md); font-size: 13px; margin-top: 10px; display: none; }
        .loading { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .container { padding: 16px 14px; }
            .chart-wrap { height: 260px; }
            .jira-config { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
{% include '_navbar.html' %}

<script>window._USER_PREFIX='{% if current_user %}u{{ current_user.id }}_{% endif %}';</script>
<div class="container">
    <h1 class="page-title">Bug 趋势看板</h1>

    <div class="source-tabs">
        <div class="source-tab active" data-source="excel" onclick="switchSource('excel')">Excel 上传</div>
        <div class="source-tab" data-source="jira" onclick="switchSource('jira')">Jira 导入</div>
    </div>

    <div id="excelPanel">
        <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
            <div class="upload-zone-text">点击或拖拽上传 CR Excel 文件</div>
            <div class="upload-zone-hint">支持 .xlsx / .xls，可上传多个版本进行对比（最多 3 个）</div>
            <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none" onchange="handleFile(this.files[0])">
        </div>
        <div class="version-list" id="versionList"></div>
    </div>

    <div id="jiraPanel" style="display:none">
        <div class="jira-panel">
            <div class="jira-config">
                <input type="text" id="jiraDomain" placeholder="Jira 域名">
                <input type="text" id="jiraEmail" placeholder="用户名/邮箱">
                <input type="password" id="jiraToken" placeholder="API Token / 密码">
            </div>
            <div class="jira-input-row">
                <input type="text" id="jiraInput" placeholder="粘贴 Jira 搜索链接或输入 JQL">
                <button class="btn btn-primary" id="jiraImportBtn" onclick="importFromJira()">导入 CR</button>
            </div>
            <div class="jira-hint">支持 Jira 搜索 URL 或 JQL。配置仅存本地浏览器。</div>
            <div class="error-msg" id="jiraError"></div>
        </div>
    </div>

    <div id="dashboard" style="display:none">
        <div class="stats-grid" id="statsGrid"></div>

        <div class="card">
            <div class="card-title">
                <span>Bug 增长 vs 解决曲线</span>
                <button class="btn btn-sm" onclick="exportWeeklyCSV()">导出 CSV</button>
            </div>
            <div class="chart-wrap" id="trendWrap"><canvas id="trendChart"></canvas></div>
        </div>

        <div class="card">
            <div class="card-title"><span>累计未解决 Bug 趋势</span></div>
            <div class="chart-wrap" id="cumulativeWrap"><canvas id="cumulativeChart"></canvas></div>
        </div>

        <div class="card">
            <div class="card-title"><span>每周对比表</span></div>
            <div class="table-wrap">
                <table class="data-table" id="weeklyTable">
                    <thead><tr><th>周</th><th>新增</th><th>解决</th><th>净增</th><th>累计未解决</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <div class="card-title"><span>模块趋势热力图（周 x 模块）</span></div>
            <div class="heatmap-wrap" id="heatmapContainer"></div>
        </div>

        <div class="card">
            <div class="card-title"><span>研发每周解决数堆叠面积图</span></div>
            <div class="chart-wrap" id="devTrendWrap"><canvas id="devTrendChart"></canvas></div>
        </div>
    </div>

    <div id="emptyState" class="empty-state">
        <div style="margin-bottom:12px;">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.4;"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        </div>
        <p>上传 CR Excel 后自动生成趋势看板</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="/static/js/chart-library.js?v={{ STATIC_VERSION }}"></script>
<script>
(function() {
    'use strict';

    // ========== 多版本数据存储 ==========
    var versions = []; // { name, data, color }
    var VERSION_COLORS = ['#000000', '#007aff', '#34c759'];
    var trendChart = null, cumulativeChart = null, devTrendChart = null;
    var currentAgg = null;

    // ========== 文件上传 ==========
    var uploadZone = document.getElementById('uploadZone');
    uploadZone.addEventListener('dragover', function(e) { e.preventDefault(); uploadZone.classList.add('dragover'); });
    uploadZone.addEventListener('dragleave', function() { uploadZone.classList.remove('dragover'); });
    uploadZone.addEventListener('drop', function(e) { e.preventDefault(); uploadZone.classList.remove('dragover'); if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });

    window.handleFile = function(file) {
        if (!file) return;
        if (versions.length >= 3) { alert('最多支持 3 个版本对比，请先移除一个版本'); return; }
        var reader = new FileReader();
        reader.onload = function(e) {
            var wb = XLSX.read(e.target.result, {type:'array'});
            var ws = wb.Sheets[wb.SheetNames[0]];
            var data = XLSX.utils.sheet_to_json(ws, {defval:''});
            var versionName = file.name.replace(/\.(xlsx|xls)$/i, '');
            versions.push({ name: versionName, data: data, color: VERSION_COLORS[versions.length % 3] });
            renderVersionList();
            processData();
        };
        reader.readAsArrayBuffer(file);
    };

    window.removeVersion = function(idx) {
        versions.splice(idx, 1);
        // 重新分配颜色
        versions.forEach(function(v, i) { v.color = VERSION_COLORS[i % 3]; });
        renderVersionList();
        if (versions.length === 0) {
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('emptyState').style.display = 'block';
        } else {
            processData();
        }
    };

    function renderVersionList() {
        var list = document.getElementById('versionList');
        list.innerHTML = versions.map(function(v, i) {
            return '<div class="version-pill active"><span style="width:8px;height:8px;border-radius:50%;background:' + v.color + ';display:inline-block;"></span>' +
                '<span>' + v.name + '</span><span class="remove" onclick="removeVersion(' + i + ')">&times;</span></div>';
        }).join('');
    }

    // ========== 数据处理 ==========
    function detectColumns(data) {
        if (!data.length) return {};
        var keys = Object.keys(data[0]);
        return {
            createdKey: keys.find(function(k) { return /创建|created|提交|发现|日期|date|time/i.test(k); }) || keys[0],
            resolvedKey: keys.find(function(k) { return /解决日期|关闭日期|resolved.*date|closed.*date|fix.*date/i.test(k); }),
            statusKey: keys.find(function(k) { return /状态|status|state/i.test(k); }),
            severityKey: keys.find(function(k) { return /严重|severity|priority|级别/i.test(k); }),
            moduleKey: keys.find(function(k) { return /模块|module|component|组件/i.test(k); }),
            developerKey: keys.find(function(k) { return /研发|开发|负责人|assignee|developer|owner/i.test(k); })
        };
    }

    function isResolved(row, cols) {
        if (!cols.statusKey) return false;
        var s = String(row[cols.statusKey] || '').toLowerCase();
        return /已解决|已关闭|关闭|resolved|closed|done|fixed|完成/i.test(s);
    }

    function getWeekKey(dateStr) {
        if (!dateStr) return null;
        var d = new Date(dateStr);
        if (isNaN(d.getTime())) {
            var parts = String(dateStr).split(/[-\/]/);
            if (parts.length >= 3) d = new Date(parts[0], parts[1]-1, parts[2]);
        }
        if (isNaN(d.getTime())) return null;
        var day = d.getDay() || 7;
        d.setDate(d.getDate() + 4 - day);
        var yearStart = new Date(d.getFullYear(), 0, 1);
        var weekNum = Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
        return d.getFullYear() + '-W' + String(weekNum).padStart(2, '0');
    }

    function getWeekLabel(weekKey) {
        var parts = weekKey.split('-W');
        return parts[0] + '年第' + parseInt(parts[1]) + '周';
    }

    function aggregateByWeek(data) {
        var cols = detectColumns(data);
        var weekMap = {};
        data.forEach(function(row) {
            var cWeek = getWeekKey(row[cols.createdKey]);
            if (cWeek) {
                if (!weekMap[cWeek]) weekMap[cWeek] = { created: 0, resolved: 0 };
                weekMap[cWeek].created++;
            }
            if (cols.resolvedKey && row[cols.resolvedKey]) {
                var rWeek = getWeekKey(row[cols.resolvedKey]);
                if (rWeek) {
                    if (!weekMap[rWeek]) weekMap[rWeek] = { created: 0, resolved: 0 };
                    weekMap[rWeek].resolved++;
                }
            } else if (isResolved(row, cols) && cWeek) {
                weekMap[cWeek].resolved++;
            }
        });
        var weeks = Object.keys(weekMap).sort();
        if (weeks.length === 0) return { labels: [], created: [], resolved: [], open: [] };
        // 补全缺失周
        var allWeeks = [];
        var start = weeks[0].split('-W').map(Number);
        var end = weeks[weeks.length-1].split('-W').map(Number);
        for (var y = start[0]; y <= end[0]; y++) {
            var maxW = y === end[0] ? end[1] : 53;
            var minW = y === start[0] ? start[1] : 1;
            for (var w = minW; w <= maxW; w++) {
                allWeeks.push(y + '-W' + String(w).padStart(2, '0'));
            }
        }
        var cumC = 0, cumR = 0;
        return {
            labels: allWeeks.map(getWeekLabel),
            weekKeys: allWeeks,
            created: allWeeks.map(function(w) { cumC += (weekMap[w]?.created || 0); return weekMap[w]?.created || 0; }),
            resolved: allWeeks.map(function(w) { cumR += (weekMap[w]?.resolved || 0); return weekMap[w]?.resolved || 0; }),
            open: allWeeks.map(function(w, i) {
                var c = allWeeks.slice(0, i+1).reduce(function(s, x) { return s + (weekMap[x]?.created || 0); }, 0);
                var r = allWeeks.slice(0, i+1).reduce(function(s, x) { return s + (weekMap[x]?.resolved || 0); }, 0);
                return c - r;
            })
        };
    }

    function processData() {
        if (versions.length === 0) return;
        document.getElementById('emptyState').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';

        // 合并所有版本数据用于统计
        var allData = [];
        versions.forEach(function(v) { allData = allData.concat(v.data); });

        renderStats(allData);
        renderTrendChart();
        renderCumulativeChart();
        renderWeeklyTable();
        renderHeatmap(allData);
        renderDevTrend(allData);
    }

    // ========== 统计卡片 ==========
    function renderStats(data) {
        var cols = detectColumns(data);
        var total = data.length;
        var resolved = data.filter(function(r) { return isResolved(r, cols); }).length;
        var unresolved = total - resolved;
        var rate = total > 0 ? (resolved / total * 100).toFixed(1) : 0;
        document.getElementById('statsGrid').innerHTML =
            '<div class="stat-card"><div class="stat-label">Bug 总数</div><div class="stat-value">' + total + '</div></div>' +
            '<div class="stat-card"><div class="stat-label">已解决</div><div class="stat-value" style="color:#34c759;">' + resolved + '</div></div>' +
            '<div class="stat-card"><div class="stat-label">未解决</div><div class="stat-value" style="color:#ff3b30;">' + unresolved + '</div></div>' +
            '<div class="stat-card"><div class="stat-label">解决率</div><div class="stat-value">' + rate + '%</div></div>';
    }

    // ========== 趋势图（多版本对比） ==========
    function renderTrendChart() {
        trendChart = PTChart.destroy(trendChart);
        var datasets = versions.map(function(v) {
            var agg = aggregateByWeek(v.data);
            return {
                label: v.name + ' - 新增',
                data: agg.created,
                borderColor: v.color,
                backgroundColor: v.color + '18',
                fill: true, tension: 0.3, borderWidth: 2, pointRadius: 3
            };
        });
        // 每个版本再加一条解决线（虚线）
        versions.forEach(function(v) {
            var agg = aggregateByWeek(v.data);
            datasets.push({
                label: v.name + ' - 解决',
                data: agg.resolved,
                borderColor: v.color,
                backgroundColor: 'transparent',
                fill: false, tension: 0.3, borderWidth: 2, borderDash: [5, 3], pointRadius: 3
            });
        });
        // 使用第一个版本的 labels
        var labels = versions.length > 0 ? aggregateByWeek(versions[0].data).labels : [];
        trendChart = PTChart.create('trendChart', {
            type: 'line',
            data: { labels: labels, datasets: datasets },
            options: {
                plugins: { legend: { position: 'top' } },
                scales: { y: { beginAtZero: true, title: { display: true, text: 'Bug 数量' } } }
            }
        });
    }

    // ========== 累计未解决 ==========
    function renderCumulativeChart() {
        cumulativeChart = PTChart.destroy(cumulativeChart);
        var datasets = versions.map(function(v) {
            var agg = aggregateByWeek(v.data);
            return {
                label: v.name,
                data: agg.open,
                borderColor: v.color,
                backgroundColor: v.color + '18',
                fill: true, tension: 0.3, borderWidth: 2, pointRadius: 3
            };
        });
        var labels = versions.length > 0 ? aggregateByWeek(versions[0].data).labels : [];
        cumulativeChart = PTChart.create('cumulativeChart', {
            type: 'line',
            data: { labels: labels, datasets: datasets },
            options: {
                plugins: { legend: { position: 'top' } },
                scales: { y: { beginAtZero: true, title: { display: true, text: '未解决数' } } }
            }
        });
    }

    // ========== 每周对比表 ==========
    function renderWeeklyTable() {
        if (versions.length === 0) return;
        var agg = aggregateByWeek(versions[0].data);
        currentAgg = agg;
        var tbody = document.querySelector('#weeklyTable tbody');
        tbody.innerHTML = agg.labels.map(function(label, i) {
            var net = agg.created[i] - agg.resolved[i];
            var netColor = net > 0 ? '#ff3b30' : net < 0 ? '#34c759' : 'var(--ds-text-secondary)';
            return '<tr><td>' + label + '</td><td>' + agg.created[i] + '</td><td>' + agg.resolved[i] +
                '</td><td style="color:' + netColor + ';font-weight:600;">' + (net >= 0 ? '+' : '') + net +
                '</td><td>' + Math.max(0, agg.open[i]) + '</td></tr>';
        }).join('');
    }

    window.exportWeeklyCSV = function() {
        if (!currentAgg) return;
        var rows = [['周', '新增', '解决', '净增', '累计未解决']];
        currentAgg.labels.forEach(function(label, i) {
            rows.push([label, currentAgg.created[i], currentAgg.resolved[i], currentAgg.created[i]-currentAgg.resolved[i], Math.max(0, currentAgg.open[i])]);
        });
        var csv = '\ufeff' + rows.map(function(r) { return r.join(','); }).join('\n');
        var blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = 'bug_trend_weekly.csv'; a.click();
        URL.revokeObjectURL(url);
    };

    // ========== 模块趋势热力图 ==========
    function renderHeatmap(data) {
        var container = document.getElementById('heatmapContainer');
        if (!data.length) { PTChart.showEmpty('heatmapContainer', '暂无数据'); return; }
        var cols = detectColumns(data);
        if (!cols.moduleKey) { PTChart.showEmpty('heatmapContainer', '未检测到模块列'); return; }

        var weekModuleMap = {};
        var moduleSet = {};
        var weekSet = {};
        data.forEach(function(row) {
            var week = getWeekKey(row[cols.createdKey]);
            var mod = row[cols.moduleKey] || '未分类';
            if (week && mod) {
                if (!weekModuleMap[week]) weekModuleMap[week] = {};
                weekModuleMap[week][mod] = (weekModuleMap[week][mod] || 0) + 1;
                moduleSet[mod] = true;
                weekSet[week] = true;
            }
        });

        var weeks = Object.keys(weekSet).sort().slice(-12);
        var modules = Object.keys(moduleSet).sort(function(a, b) {
            var ca = weeks.reduce(function(s, w) { return s + (weekModuleMap[w]?.[a] || 0); }, 0);
            var cb = weeks.reduce(function(s, w) { return s + (weekModuleMap[w]?.[b] || 0); }, 0);
            return cb - ca;
        }).slice(0, 15);

        if (weeks.length === 0 || modules.length === 0) {
            PTChart.showEmpty('heatmapContainer', '暂无模块趋势数据');
            return;
        }

        var matrix = modules.map(function(mod) {
            return weeks.map(function(w) { return weekModuleMap[w]?.[mod] || 0; });
        });

        PTChart.renderHeatmap('heatmapContainer', {
            labels: { x: weeks.map(function(w) { return w.replace(/^\d{4}-/, ''); }), y: modules },
            matrix: matrix
        }, { cellWidth: 44, cellHeight: 30, labelWidth: 100 });
    }

    // ========== 研发每周解决数堆叠面积图 ==========
    function renderDevTrend(data) {
        devTrendChart = PTChart.destroy(devTrendChart);
        if (!data.length) return;
        var cols = detectColumns(data);
        if (!cols.developerKey) { PTChart.showEmpty('devTrendWrap', '未检测到研发列'); return; }

        var devWeekMap = {};
        var devSet = {};
        var weekSet = {};
        data.forEach(function(row) {
            if (!isResolved(row, cols)) return;
            var dev = row[cols.developerKey] || '未分配';
            var week = getWeekKey(row[cols.resolvedKey] || row[cols.createdKey]);
            if (dev && week) {
                if (!devWeekMap[dev]) devWeekMap[dev] = {};
                devWeekMap[dev][week] = (devWeekMap[dev][week] || 0) + 1;
                devSet[dev] = true;
                weekSet[week] = true;
            }
        });

        var weeks = Object.keys(weekSet).sort();
        var devs = Object.keys(devSet).sort(function(a, b) {
            var ca = Object.values(devWeekMap[a]).reduce(function(s, v) { return s + v; }, 0);
            var cb = Object.values(devWeekMap[b]).reduce(function(s, v) { return s + v; }, 0);
            return cb - ca;
        }).slice(0, 8);

        if (weeks.length === 0 || devs.length === 0) {
            PTChart.showEmpty('devTrendWrap', '暂无研发解决数据');
            return;
        }

        var colors = ['#000000','#007aff','#34c759','#ff9500','#af52de','#ff3b30','#5856d6','#ff2d55'];
        var datasets = devs.map(function(dev, i) {
            return {
                label: dev,
                data: weeks.map(function(w) { return devWeekMap[dev]?.[w] || 0; }),
                backgroundColor: colors[i % colors.length] + '33',
                borderColor: colors[i % colors.length],
                borderWidth: 1.5, fill: true, tension: 0.3, pointRadius: 2
            };
        });

        devTrendChart = PTChart.create('devTrendChart', {
            type: 'line',
            data: { labels: weeks.map(getWeekLabel), datasets: datasets },
            options: {
                plugins: { legend: { position: 'top' } },
                scales: {
                    x: { stacked: true },
                    y: { stacked: true, beginAtZero: true, title: { display: true, text: '解决数' } }
                }
            }
        });
    }

    // ========== Source 切换 ==========
    window.switchSource = function(src) {
        document.querySelectorAll('.source-tab').forEach(function(t) { t.classList.toggle('active', t.dataset.source === src); });
        document.getElementById('excelPanel').style.display = src === 'excel' ? 'block' : 'none';
        document.getElementById('jiraPanel').style.display = src === 'jira' ? 'block' : 'none';
    };

    // ========== Jira 导入（简化版） ==========
    window.importFromJira = async function() {
        var domain = document.getElementById('jiraDomain').value.trim();
        var email = document.getElementById('jiraEmail').value.trim();
        var token = document.getElementById('jiraToken').value.trim();
        var input = document.getElementById('jiraInput').value.trim();
        var errorEl = document.getElementById('jiraError');
        var btn = document.getElementById('jiraImportBtn');
        if (!domain || !input) { errorEl.textContent = '请填写域名和搜索条件'; errorEl.style.display = 'block'; return; }
        btn.disabled = true; btn.innerHTML = '<span class="loading"></span> 导入中...';
        errorEl.style.display = 'none';
        try {
            var resp = await fetch('/api/jira-search', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({domain:domain, email:email, api_token:token, jira_url:input, max_results:500})
            });
            var data = await resp.json();
            if (!resp.ok) throw new Error(data.error || '导入失败');
            if (!data.issues || !data.issues.length) throw new Error('未找到 CR 数据');
            // 转换为统一格式
            var rows = data.issues.map(function(issue) {
                return {
                    '创建日期': (issue.created||'').slice(0,10),
                    '解决日期': (issue.resolved||'').slice(0,10),
                    '状态': issue.status || 'Open',
                    '模块': issue.version || '未分类',
                    '研发': issue.assignee || ''
                };
            });
            versions.push({ name: 'Jira导入', data: rows, color: VERSION_COLORS[versions.length % 3] });
            renderVersionList();
            processData();
            switchSource('excel');
        } catch(e) {
            errorEl.textContent = e.message; errorEl.style.display = 'block';
        } finally {
            btn.disabled = false; btn.textContent = '导入 CR';
        }
    };

    // 加载 Jira 配置
    try {
        var cfg = JSON.parse(localStorage.getItem(window._USER_PREFIX + 'jira_config') || '{}');
        if (cfg.domain) document.getElementById('jiraDomain').value = cfg.domain;
        if (cfg.email) document.getElementById('jiraEmail').value = cfg.email;
        if (cfg.token) document.getElementById('jiraToken').value = cfg.token;
    } catch(e) {}
    ['jiraDomain','jiraEmail','jiraToken'].forEach(function(id) {
        document.getElementById(id).addEventListener('change', function() {
            localStorage.setItem(window._USER_PREFIX + 'jira_config', JSON.stringify({
                domain: document.getElementById('jiraDomain').value,
                email: document.getElementById('jiraEmail').value,
                token: document.getElementById('jiraToken').value
            }));
        });
    });

    // ========== 从 CR 分析中转数据 ==========
    (function importFromPipeline() {
        try {
            var prefix = window._USER_PREFIX || '';
            var pattern = new RegExp('^' + prefix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + 'pipeline_cr-analysis_\\d+$');
            var matchedKeys = [];
            for (var i = 0; i < localStorage.length; i++) {
                var k = localStorage.key(i);
                if (k && pattern.test(k)) matchedKeys.push(k);
            }
            if (matchedKeys.length === 0) return;
            matchedKeys.sort();
            var latestKey = matchedKeys[matchedKeys.length - 1];
            var data = JSON.parse(localStorage.getItem(latestKey) || 'null');
            matchedKeys.forEach(function(k) { localStorage.removeItem(k); });
            if (!data) return;
            var trendData = [];
            if (data.src === 'cr' && data.td) {
                if (data.agg === 'weekly') {
                    trendData = data.td.map(function(item) {
                        return { '创建日期': item.w, '状态': 'Open', '模块': '未分类' };
                    });
                } else {
                    trendData = data.td.map(function(item) {
                        return {
                            '创建日期': item.c || '', '解决日期': item.r || '',
                            '模块': item.m || '未分类', '状态': item.s || 'Open', '研发': ''
                        };
                    });
                }
            }
            if (trendData.length) {
                versions.push({ name: data.fn || 'CR分析导入', data: trendData, color: VERSION_COLORS[0] });
                renderVersionList();
                processData();
            }
        } catch(e) { console.warn('Pipeline import error:', e); }
    })();
})();
</script>
<script src="/static/js/components.js?v={{ STATIC_VERSION }}"></script>
