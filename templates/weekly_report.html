    <script>window._USER_PREFIX='{% if current_user %}u{{ current_user.id }}_{% endif %}';</script>
    <script>
    // v5.0 鎺ユ敹绔欎細鍔╂墜涓浆鏁版嵁锛岃嚜鍔ㄥ～鍏呭懆鎶?
    (function importFromStandup() {
        try {
            var prefix = window._USER_PREFIX || '';
            var pattern = new RegExp('^' + prefix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + 'pipeline_daily-standup_\\d+$');
            var matchedKeys = [];
            for (var i = 0; i < localStorage.length; i++) {
                var k = localStorage.key(i);
                if (k && pattern.test(k)) matchedKeys.push(k);
            }
            if (matchedKeys.length === 0) return;
            matchedKeys.sort();
            var latestKey = matchedKeys[matchedKeys.length - 1];
            var data = JSON.parse(localStorage.getItem(latestKey) || 'null');
            matchedKeys.forEach(function(k) { localStorage.removeItem(k); });
            if (!data || data.source !== 'daily-standup') return;

            // 濉厖鍚勫瓧娈?
            if (data.week_range) {
                var wr = document.getElementById('weekRange');
                if (wr) wr.value = data.week_range;
            }
            function fillTextarea(id, arr, prefix) {
                var el = document.getElementById(id);
                if (!el || !arr || arr.length === 0) return;
                el.value = arr.map(function(t, i) { return (prefix || '') + (i + 1) + '. ' + t; }).join('\n');
            }
            fillTextarea('notes', data.completed, '');
            fillTextarea('meetings', data.in_progress, '');
            fillTextarea('crIssues', data.risks, '');
            fillTextarea('extra', data.next_plan, '');

            // 鏄剧ず瀵煎叆鎻愮ず
            var banner = document.createElement('div');
            banner.style.cssText = 'margin:0 0 16px;padding:12px 16px;border-radius:10px;background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);font-size:13px;color:#059669;';
            banner.textContent = '鉁?宸蹭粠绔欎細鍔╂墜瀵煎叆 ' + data.standup_count + ' 澶╃珯浼氳褰曪紝鑷姩濉厖鍛ㄦ姤绱犳潗锛屽彲缂栬緫鍚庣敓鎴?;
            var page = document.querySelector('.page');
            if (page) page.insertBefore(banner, page.firstChild);
        } catch(e) { console.warn('Weekly report import error:', e); }
    })();
    </script>
