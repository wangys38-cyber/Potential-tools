<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能知识库 - 工具集</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23333' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 19.5A2.5 2.5 0 0 1 6.5 17H20'/><path d='M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z'/></svg>">
    <link rel="stylesheet" href="/static/css/theme.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/ux-enhancements.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/de-ai.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/components.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/mobile.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/design-system.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/perf-mobile.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/ui-polish.css?v={{ STATIC_VERSION }}">
    <style>
        .kb-page {
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px 20px;
        }
        .kb-page h1 {
            font-size: 18px;
            font-weight: 600;
            color: #1d1d1f;
            margin: 0 0 4px;
        }
        .kb-page .subtitle {
            font-size: 13px;
            color: #86868b;
            margin: 0 0 16px;
        }

        .kb-layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 16px;
            height: calc(100vh - 120px);
        }

        /* 左侧 */
        .kb-sidebar {
            background: #fff;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .kb-sidebar-header {
            padding: 10px 12px;
            border-bottom: 1px solid #e5e5ea;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f5f5f7;
        }
        .kb-sidebar-title {
            font-size: 13px;
            font-weight: 600;
            color: #1d1d1f;
        }
        .kb-refresh-btn {
            font-size: 12px;
            padding: 3px 8px;
            border: 1px solid #d2d2d7;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            color: #333;
        }
        .kb-refresh-btn:hover {
            background: #f5f5f7;
        }

        .kb-doc-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px;
        }
        .kb-doc-item {
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 2px;
        }
        .kb-doc-item:hover {
            background: #f5f5f7;
        }
        .kb-doc-title {
            font-size: 13px;
            color: #1d1d1f;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .kb-doc-meta {
            font-size: 11px;
            color: #86868b;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .kb-cat-tag {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 3px;
        }
        .kb-delete-link {
            color: #ff3b30;
            cursor: pointer;
            margin-left: auto;
            font-size: 11px;
        }

        .kb-upload-section {
            padding: 10px;
            border-top: 1px solid #e5e5ea;
        }
        .kb-upload-btn {
            display: block;
            width: 100%;
            padding: 8px;
            background: #f5f5f7;
            border: 1px dashed #d2d2d7;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            font-size: 12px;
            color: #666;
        }
        .kb-upload-btn:hover {
            border-color: #999;
            color: #333;
        }
        .kb-paste-area textarea,
        .kb-paste-area input {
            width: 100%;
            padding: 6px 8px;
            margin-top: 6px;
            border: 1px solid #d2d2d7;
            border-radius: 4px;
            font-size: 12px;
            box-sizing: border-box;
        }
        .kb-paste-area textarea {
            height: 50px;
            resize: vertical;
        }
        .kb-paste-btn {
            width: 100%;
            margin-top: 6px;
            padding: 6px;
            background: #007aff;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .kb-paste-btn:hover {
            background: #0056b3;
        }

        /* 右侧 */
        .kb-main {
            display: flex;
            flex-direction: column;
            background: #fff;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            overflow: hidden;
        }
        .kb-chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background: #f5f5f7;
            border-bottom: 1px solid #e5e5ea;
        }
        .kb-chat-title {
            font-size: 13px;
            font-weight: 600;
            color: #1d1d1f;
        }
        .kb-header-actions {
            display: flex;
            gap: 6px;
        }
        .kb-action-btn {
            font-size: 12px;
            padding: 3px 8px;
            border: 1px solid #d2d2d7;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            color: #333;
        }
        .kb-action-btn:hover {
            background: #f5f5f7;
        }

        .kb-chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }
        .kb-message {
            margin-bottom: 14px;
            display: flex;
            gap: 10px;
        }
        .kb-message.user {
            flex-direction: row-reverse;
        }
        .kb-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            background: #f5f5f7;
            border: 1px solid #e5e5ea;
        }
        .kb-bubble {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.6;
            word-break: break-word;
            background: #f5f5f7;
        }
        .kb-message.user .kb-bubble {
            background: #007aff;
            color: #fff;
        }
        .kb-bubble h2, .kb-bubble h3, .kb-bubble h4 {
            margin: 8px 0 4px;
        }
        .kb-bubble ul {
            margin: 4px 0;
            padding-left: 18px;
        }
        .kb-bubble li {
            margin: 2px 0;
        }
        .kb-bubble code {
            background: rgba(0,0,0,0.06);
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 12px;
        }

        .kb-context {
            margin-top: 8px;
            padding: 6px 10px;
            background: #f0f7ff;
            border-left: 2px solid #007aff;
            border-radius: 0 4px 4px 0;
            font-size: 11px;
            color: #666;
        }
        .kb-context-title {
            font-weight: 600;
            color: #007aff;
            margin-bottom: 2px;
        }

        .kb-input-area {
            padding: 12px;
            border-top: 1px solid #e5e5ea;
            display: flex;
            gap: 8px;
        }
        .kb-input {
            flex: 1;
            padding: 9px 12px;
            border: 1px solid #d2d2d7;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }
        .kb-input:focus {
            border-color: #007aff;
        }
        .kb-send-btn {
            padding: 9px 20px;
            background: #007aff;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        .kb-send-btn:hover {
            background: #0056b3;
        }
        .kb-send-btn:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .kb-empty {
            text-align: center;
            padding: 60px 20px;
            color: #86868b;
        }
        .kb-empty-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }
        .kb-empty-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }
        .kb-empty-desc {
            font-size: 12px;
        }

        @media (max-width: 900px) {
            .kb-layout {
                grid-template-columns: 1fr;
                height: auto;
            }
        }
    </style>
</head>
<body>
{% include '_navbar.html' %}

<div class="kb-page">
    <h1>智能知识库</h1>
    <p class="subtitle">上传文档，AI 自动检索关联</p>

    <div class="kb-layout">
        <!-- 左侧 -->
        <div class="kb-sidebar">
            <div class="kb-sidebar-header">
                <span class="kb-sidebar-title">文档列表</span>
                <button class="kb-refresh-btn" onclick="loadDocs()">刷新</button>
            </div>
            <div class="kb-doc-list" id="docList"></div>
            <div class="kb-upload-section">
                <label class="kb-upload-btn" for="fileInput">
                    上传文件（TXT/PDF/Word/Excel/CSV/图片）
                </label>
                <input type="file" id="fileInput" accept=".txt,.md,.pdf,.docx,.xlsx,.xls,.csv,.png,.jpg,.jpeg" style="display:none" onchange="uploadFile(this)">
                <div class="kb-paste-area">
                    <textarea id="manualContent" placeholder="粘贴文本..."></textarea>
                    <input type="text" id="manualTitle" placeholder="标题">
                    <button class="kb-paste-btn" onclick="uploadManual()">添加</button>
                </div>
            </div>
        </div>

        <!-- 右侧 -->
        <div class="kb-main">
            <div class="kb-chat-header">
                <span class="kb-chat-title">问答</span>
                <div class="kb-header-actions">
                    <button class="kb-action-btn" onclick="clearChat()">清空对话</button>
                    <button class="kb-action-btn" onclick="clearCache()">清缓存</button>
                </div>
            </div>
            <div class="kb-chat-area" id="chatArea">
                <div class="kb-empty">
                    <div class="kb-empty-icon">💬</div>
                    <div class="kb-empty-title">知识库问答</div>
                    <div class="kb-empty-desc">上传文档后在这里提问</div>
                </div>
            </div>
            <div class="kb-input-area">
                <input type="text" class="kb-input" id="questionInput" placeholder="输入问题..." onkeypress="if(event.key==='Enter')sendQuestion()">
                <button class="kb-send-btn" id="sendBtn" onclick="sendQuestion()">发送</button>
            </div>
        </div>
    </div>
</div>

<script>
async function loadDocs() {
    try {
        const res = await fetch('/knowledge-base/api/documents');
        const data = await res.json();
        if (data.status === 'success') renderDocs(data.documents);
    } catch (e) { console.error(e); }
}

function renderDocs(docs) {
    const el = document.getElementById('docList');
    if (!docs || docs.length === 0) {
        el.innerHTML = '<div style="padding:20px;text-align:center;color:#999;font-size:12px;">暂无文档</div>';
        return;
    }
    const catColors = {
        'CR数据': '#fee2e2', 'SOP操作指南': '#dcfce7', '项目计划': '#dbeafe',
        '技术文档': '#f3e8ff', '图片资料': '#fff7ed', '测试文档': '#cffafe', '其他': '#f3f4f6'
    };
    el.innerHTML = docs.map(d => `
        <div class="kb-doc-item">
            <div class="kb-doc-title">${d.title}</div>
            <div class="kb-doc-meta">
                <span class="kb-cat-tag" style="background:${catColors[d.category]||'#f3f4f6'};">${d.category||'其他'}</span>
                <span>${d.chunk_count} 片段</span>
                <span class="kb-delete-link" onclick="deleteDoc('${d.doc_id}')">删除</span>
            </div>
        </div>`).join('');
}

async function deleteDoc(id) {
    if (!confirm('删除该文档？')) return;
    await fetch(`/knowledge-base/api/documents/${id}`, { method: 'DELETE' });
    loadDocs();
}

async function clearChat() {
    if (!confirm('清空对话历史？')) return;
    await fetch('/knowledge-base/api/clear-history', { method: 'POST' });
    document.getElementById('chatArea').innerHTML = `
        <div class="kb-empty">
            <div class="kb-empty-icon">💬</div>
            <div class="kb-empty-title">知识库问答</div>
            <div class="kb-empty-desc">上传文档后在这里提问</div>
        </div>`;
}

async function clearCache() {
    await fetch('/knowledge-base/api/clear-cache', { method: 'POST' });
    alert('缓存已清');
}

async function uploadFile(input) {
    const file = input.files[0];
    if (!file) return;
    const btn = document.querySelector('.kb-upload-btn');
    const isImage = file.type.startsWith('image/');
    btn.textContent = isImage ? '识别中...' : '上传中...';
    const fd = new FormData();
    fd.append('file', file);
    try {
        const res = await fetch('/knowledge-base/api/upload-file', { method: 'POST', body: fd });
        const data = await res.json();
        alert(data.status === 'success' ? '完成' : '失败: ' + (data.error||''));
        loadDocs();
    } catch (e) { alert('失败'); }
    btn.textContent = '上传文件（TXT/PDF/Word/Excel/CSV/图片）';
    input.value = '';
}

async function uploadManual() {
    const title = document.getElementById('manualTitle').value.trim();
    const content = document.getElementById('manualContent').value.trim();
    if (!content) { alert('输入内容'); return; }
    const fd = new FormData();
    fd.append('title', title);
    fd.append('content', content);
    const res = await fetch('/knowledge-base/api/documents', { method: 'POST', body: fd });
    const data = await res.json();
    if (data.status === 'success') {
        document.getElementById('manualTitle').value = '';
        document.getElementById('manualContent').value = '';
        loadDocs();
    } else { alert('失败'); }
}

async function sendQuestion() {
    const input = document.getElementById('questionInput');
    const q = input.value.trim();
    if (!q) return;
    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    btn.textContent = '...';
    addMessage('user', q);
    input.value = '';
    const loadingId = addMessage('ai', '检索中...');
    try {
        const res = await fetch('/knowledge-base/api/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question: q })
        });
        const data = await res.json();
        removeMessage(loadingId);
        if (data.status === 'success') addMessage('ai', data.answer, data.contexts);
        else addMessage('ai', '出错: ' + (data.error||''));
    } catch (e) {
        removeMessage(loadingId);
        addMessage('ai', '请求失败');
    }
    btn.disabled = false;
    btn.textContent = '发送';
}

function renderMarkdown(text) {
    if (!text) return '';
    let h = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    h = h.replace(/^### (.*)$/gm, '<h4 style="margin:8px 0 4px;font-size:13px;">$1</h4>');
    h = h.replace(/^## (.*)$/gm, '<h3 style="margin:10px 0 6px;font-size:14px;">$1</h3>');
    h = h.replace(/^# (.*)$/gm, '<h2 style="margin:12px 0 8px;font-size:15px;">$1</h2>');
    h = h.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
    h = h.replace(/^[-*] (.*)$/gm, '<li>$1</li>');
    h = h.replace(/(<li>.*<\/li>\n?)+/g, '<ul style="margin:4px 0;padding-left:18px;">$&</ul>');
    h = h.replace(/\n/g, '<br>');
    h = h.replace(/<\/li><br>/g, '</li>').replace(/<br><li/g, '<li');
    return h;
}

function addMessage(role, content, contexts) {
    const area = document.getElementById('chatArea');
    const empty = area.querySelector('.kb-empty');
    if (empty) empty.remove();
    const div = document.createElement('div');
    div.className = 'kb-message ' + role;
    div.id = 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2,5);
    const avatar = role === 'user' ? '👤' : '🤖';
    const body = role === 'ai' ? renderMarkdown(content) : content;
    let html = `<div class="kb-avatar">${avatar}</div><div class="kb-bubble">${body}`;
    if (contexts && contexts.length > 0) {
        html += '<div class="kb-context"><div class="kb-context-title">参考来源</div>' +
            contexts.map(c => `• ${c.title}`).join('<br>') + '</div>';
    }
    html += '</div>';
    div.innerHTML = html;
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
    return div.id;
}

function removeMessage(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
}

loadDocs();
</script>
</body>
</html>
