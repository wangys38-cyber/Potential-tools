<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能知识库 - 工具集</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 19.5A2.5 2.5 0 0 1 6.5 17H20'/><path d='M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z'/></svg>">
    <link rel="stylesheet" href="/static/css/theme.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/ux-enhancements.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/de-ai.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/components.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/mobile.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/design-system.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/perf-mobile.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/ui-polish.css?v={{ STATIC_VERSION }}">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #fce7f3 40%, #fef3c7 100%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        .kb-fullpage {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 56px);
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* 顶栏 */
        .kb-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0 12px;
            border-bottom: 1px solid rgba(255,255,255,.3);
        }
        .kb-topbar h1 { font-size: 18px; font-weight: 700; margin: 0; color: #1e1b4b; letter-spacing: -.3px; }
        .kb-topbar .actions { display: flex; gap: 6px; }
        .kb-btn {
            font-size: 12px; padding: 6px 14px; border: 1px solid rgba(255,255,255,.5); border-radius: 20px;
            background: rgba(255,255,255,.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            cursor: pointer; color: #4b5563; transition: all .2s; font-weight: 500;
        }
        .kb-btn:hover { background: rgba(255,255,255,.7); color: #111827; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,0,0,.08); }
        .kb-btn-primary {
            background: rgba(99,102,241,.8); color: #fff; border-color: transparent;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        .kb-btn-primary:hover { background: rgba(79,70,229,.9); color: #fff; }

        /* 聊天区 */
        .kb-chat {
            flex: 1;
            overflow-y: auto;
            padding: 24px 0;
        }
        .kb-chat::-webkit-scrollbar { width: 5px; }
        .kb-chat::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); border-radius: 3px; }

        .kb-msg {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            animation: fadeIn .25s ease-out;
        }
        @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
        .kb-msg.user { flex-direction: row-reverse; }
        .kb-avatar {
            width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; font-size: 15px;
            background: rgba(255,255,255,.5); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,.6);
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
        }
        .kb-bubble {
            max-width: 75%; padding: 14px 18px; border-radius: 18px;
            font-size: 14px; line-height: 1.7; word-break: break-word;
        }
        .kb-msg.ai .kb-bubble {
            background: rgba(255,255,255,.55); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,.6);
            box-shadow: 0 4px 16px rgba(0,0,0,.06);
            border-top-left-radius: 6px;
        }
        .kb-msg.user .kb-bubble {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff; border-top-right-radius: 6px;
            box-shadow: 0 4px 16px rgba(99,102,241,.3);
        }
        .kb-bubble h3 { margin: 8px 0 4px; font-size: 14px; }
        .kb-bubble h2 { margin: 6px 0 3px; font-size: 15px; }
        .kb-bubble p { margin: 3px 0; }
        .kb-bubble hr { margin: 4px 0; border: none; border-top: 1px solid rgba(0,0,0,.08); }
        .kb-bubble br { line-height: 0; }
        .kb-bubble ul { margin: 2px 0; padding-left: 18px; }
        .kb-bubble li { margin: 1px 0; }
        .kb-bubble code { background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
        .dots::after { content: ''; animation: dots 1.5s steps(4) infinite; }
        @keyframes dots { 0%{content:'';} 25%{content:'.';} 50%{content:'..';} 75%{content:'...';} }

        /* 反馈按钮 */
        .kb-feedback {
            display: flex; gap: 4px; margin-top: 6px;
        }
        .kb-fb-btn {
            font-size: 12px; padding: 3px 10px; border: 1px solid rgba(255,255,255,.5); border-radius: 12px;
            background: rgba(255,255,255,.4); backdrop-filter: blur(8px); cursor: pointer; color: #9ca3af; transition: all .15s;
        }
        .kb-fb-btn:hover { color: #111827; background: rgba(255,255,255,.7); }
        .kb-fb-btn.active-up { color: #10b981; border-color: #10b981; }
        .kb-fb-btn.active-down { color: #ef4444; border-color: #ef4444; }

        .kb-context {
            margin-top: 8px; padding: 10px 12px; background: rgba(255,255,255,.4);
            backdrop-filter: blur(8px);
            border-left: 2px solid rgba(99,102,241,.5); border-radius: 0 10px 10px 0;
            font-size: 12px; color: #6b7280;
        }
        .kb-context-title { font-weight: 600; color: #6366f1; margin-bottom: 3px; }

        /* 输入区 */
        .kb-inputbar {
            padding: 12px 0 20px;
            border-top: 1px solid rgba(255,255,255,.3);
        }
        .kb-input-wrap {
            display: flex; gap: 10px; align-items: center;
        }
        .kb-input {
            flex: 1; padding: 14px 18px; border: 1px solid rgba(255,255,255,.5); border-radius: 18px;
            font-size: 14px; outline: none; transition: all .2s;
            background: rgba(255,255,255,.5); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 4px 16px rgba(0,0,0,.06);
        }
        .kb-input:focus { border-color: rgba(99,102,241,.5); box-shadow: 0 0 0 4px rgba(99,102,241,.12), 0 4px 16px rgba(0,0,0,.08); background: rgba(255,255,255,.7); }
        .kb-mic {
            padding: 13px 15px; background: rgba(255,255,255,.5); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,.5); border-radius: 18px;
            font-size: 16px; cursor: pointer; transition: all .2s;
        }
        .kb-mic:hover { background: rgba(255,255,255,.8); }
        .kb-mic.recording { background: #ef4444; border-color: #ef4444; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .6; } }
        .kb-send {
            padding: 13px 28px; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; border: none;
            border-radius: 18px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s;
            box-shadow: 0 4px 16px rgba(99,102,241,.3);
        }
        .kb-send:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99,102,241,.4); }
        .kb-send:disabled { opacity: .5; cursor: not-allowed; transform: none; }

        .kb-empty {
            text-align: center; padding: 80px 20px; color: #9ca3af;
        }
        .kb-empty .icon { font-size: 56px; margin-bottom: 12px; filter: drop-shadow(0 4px 12px rgba(0,0,0,.1)); }
        .kb-empty .title { font-size: 18px; font-weight: 600; color: #1e1b4b; margin-bottom: 4px; }
        .kb-empty .desc { font-size: 13px; }

        /* 抽屉 */
        .kb-drawer-overlay {
            display: none; position: fixed; inset: 0; background: rgba(30,27,75,.2); backdrop-filter: blur(4px); z-index: 100;
        }
        .kb-drawer-overlay.open { display: block; }
        .kb-drawer {
            position: fixed; top: 0; right: -420px; width: 400px; height: 100vh;
            background: rgba(255,255,255,.7); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            z-index: 101; transition: right .3s cubic-bezier(.4,0,.2,1);
            box-shadow: -8px 0 30px rgba(0,0,0,.1); display: flex; flex-direction: column;
        }
        .kb-drawer.open { right: 0; }
        .kb-drawer-header {
            padding: 20px 20px 16px; border-bottom: 1px solid rgba(255,255,255,.4);
            display: flex; justify-content: space-between; align-items: center;
        }
        .kb-drawer-header h3 { margin: 0; font-size: 16px; font-weight: 600; color: #1e1b4b; }
        .kb-drawer-body { flex: 1; overflow-y: auto; padding: 16px; }
        .kb-doc-item {
            padding: 8px 10px; border-radius: 12px; cursor: pointer; margin-bottom: 6px;
            background: rgba(255,255,255,.5); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,.6);
            transition: all .2s cubic-bezier(.4,0,.2,1);
            display: flex; align-items: center; gap: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,.04);
        }
        .kb-doc-item:hover {
            background: rgba(255,255,255,.75);
            box-shadow: 0 4px 12px rgba(0,0,0,.08);
            transform: translateY(-1px);
        }
        .kb-doc-icon {
            width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; font-size: 14px;
            box-shadow: inset 0 1px 2px rgba(255,255,255,.5);
        }
        .kb-doc-info { flex: 1; min-width: 0; }
        .kb-doc-title { font-size: 12.5px; font-weight: 600; margin-bottom: 2px; color: #1e1b4b; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .kb-doc-meta { font-size: 10px; color: #9ca3af; display: flex; gap: 6px; align-items: center; }
        .kb-cat-tag { font-size: 10px; padding: 2px 8px; border-radius: 6px; font-weight: 500; }
        .kb-delete { color: #ef4444; cursor: pointer; margin-left: auto; opacity: 0; transition: opacity .15s; font-size: 12px; }
        .kb-doc-item:hover .kb-delete { opacity: .8; }
        .kb-upload-area {
            padding: 16px; border-top: 1px solid rgba(255,255,255,.4);
        }
    </style>
</head>
<body>
{% include '_navbar.html' %}

<div class="kb-fullpage">
    <div class="kb-topbar">
        <h1>智能知识库</h1>
        <div class="actions">
            <button class="kb-btn" onclick="loadInsights()">洞察</button>
            <button class="kb-btn" onclick="loadHistory()">历史</button>
            <button class="kb-btn" onclick="exportChat()">导出</button>
            <button class="kb-btn" onclick="clearChat()">清空</button>
            <button class="kb-btn" onclick="clearCache()">清缓存</button>
            <button class="kb-btn" onclick="reindexAll()">重建索引</button>
            <button class="kb-btn kb-btn-primary" onclick="openDrawer()">📁 文档</button>
        </div>
    </div>

    <div class="kb-chat" id="chatArea">
        <div class="kb-empty">
            <div class="icon">💬</div>
            <div class="title">智能知识库问答</div>
            <div class="desc">上传文档后在这里提问，AI自动检索关联</div>
        </div>
    </div>

    <div class="kb-inputbar" id="inputBar">
        <div class="kb-input-wrap">
            <input type="text" class="kb-input" id="questionInput" placeholder="输入问题，或Ctrl+V粘贴图片..." onkeypress="if(event.key==='Enter')sendQuestion()" onpaste="handlePaste(event)">
            <button class="kb-mic" id="micBtn" onclick="toggleMic()" title="语音输入">🎤</button>
            <button class="kb-send" id="sendBtn" onclick="sendQuestion()">发送</button>
        </div>
    </div>
</div>

<style>
/* 豆包风格：首次进入输入框居中 */
body.kb-centered .kb-fullpage { justify-content: center; }
body.kb-centered .kb-chat { flex: 0; overflow: visible; }
body.kb-centered .kb-empty { padding: 0 0 24px; }
body.kb-centered .kb-empty .icon { font-size: 64px; margin-bottom: 16px; }
body.kb-centered .kb-empty .title { font-size: 22px; margin-bottom: 6px; }
body.kb-centered .kb-empty .desc { font-size: 14px; margin-bottom: 24px; }
body.kb-centered .kb-inputbar { border-top: none; padding-top: 0; padding-bottom: 0; }
body.kb-centered .kb-inputbar .kb-input-wrap { max-width: 700px; margin: 0 auto; }
body.kb-centered .kb-input { padding: 16px 20px; font-size: 15px; }
body.kb-centered .kb-send { padding: 16px 28px; }
</style>

<!-- 抽屉：文档管理 -->
<div class="kb-drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="kb-drawer" id="drawer">
    <div class="kb-drawer-header">
        <h3>文档管理</h3>
        <button class="kb-btn" onclick="closeDrawer()">✕</button>
    </div>
    <div class="kb-drawer-body">
        <input type="text" id="docSearchInput" placeholder="全文搜索..." 
               style="width:100%;padding:7px 10px;border:1px solid #e5e7eb;border-radius:6px;font-size:12px;box-sizing:border-box;outline:none;margin-bottom:8px;"
               oninput="handleSearch(this.value)">
        <div id="docList"></div>
        <div id="searchResults" style="display:none;"></div>
    </div>
    <div class="kb-upload-area">
        <label style="display:block;padding:12px;background:rgba(255,255,255,.4);backdrop-filter:blur(12px);border:1.5px dashed rgba(99,102,241,.3);border-radius:14px;text-align:center;cursor:pointer;font-size:12px;color:#6366f1;transition:all .2s;" for="fileInput">
            📎 上传文件（TXT/PDF/Word/Excel/CSV/图片）
        </label>
        <input type="file" id="fileInput" accept=".txt,.md,.pdf,.docx,.xlsx,.xls,.csv,.png,.jpg,.jpeg" style="display:none" onchange="uploadFile(this)">
        <textarea id="manualContent" placeholder="粘贴文本..." style="width:100%;padding:10px;margin-top:8px;border:1px solid rgba(255,255,255,.5);border-radius:12px;font-size:12px;box-sizing:border-box;height:40px;resize:vertical;background:rgba(255,255,255,.5);backdrop-filter:blur(12px);outline:none;"></textarea>
        <input type="text" id="manualTitle" placeholder="标题" style="width:100%;padding:10px;margin-top:6px;border:1px solid rgba(255,255,255,.5);border-radius:12px;font-size:12px;box-sizing:border-box;background:rgba(255,255,255,.5);backdrop-filter:blur(12px);outline:none;">
        <button class="kb-btn kb-btn-primary" style="width:100%;margin-top:8px;padding:10px;" onclick="uploadManual()">添加文档</button>
    </div>
</div>

<script>
let lastMsgId = null;

function openDrawer() {
    document.getElementById('drawer').classList.add('open');
    document.getElementById('drawerOverlay').classList.add('open');
    loadDocs();
}
function closeDrawer() {
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('drawerOverlay').classList.remove('open');
}

async function loadDocs() {
    try {
        const res = await fetch('/knowledge-base/api/documents');
        const data = await res.json();
        if (data.status === 'success') renderDocs(data.documents);
    } catch (e) {}
}

function renderDocs(docs) {
    const el = document.getElementById('docList');
    if (!docs || !docs.length) { el.innerHTML = '<div style="padding:40px;text-align:center;color:#999;font-size:13px;">暂无文档<br><span style="font-size:11px;color:#bbb;">点击下方上传文档</span></div>'; return; }
    const colors = {'CR数据':'#fee2e2','SOP操作指南':'#dcfce7','项目计划':'#dbeafe','技术文档':'#f3e8ff','图片资料':'#fff7ed','测试文档':'#cffafe','其他':'#f3f4f6'};
    const icons = {'CR数据':'🐛','SOP操作指南':'📋','项目计划':'📅','技术文档':'📄','图片资料':'🖼️','测试文档':'🧪','其他':'📁'};
    el.innerHTML = docs.map(d => `
        <div class="kb-doc-item">
            <div class="kb-doc-icon" style="background:${colors[d.category]||'#f3f4f6'}">${icons[d.category]||'📄'}</div>
            <div class="kb-doc-info">
                <div class="kb-doc-title">${d.title}</div>
                <div class="kb-doc-meta">
                    <span class="kb-cat-tag" style="background:${colors[d.category]||'#f3f4f6'}">${d.category||'其他'}</span>
                    <span>${d.chunk_count}片段</span>
                </div>
            </div>
            <span class="kb-delete" onclick="deleteDoc('${d.doc_id}')">删除</span>
        </div>`).join('');
}

async function deleteDoc(id) {
    if (!confirm('删除？')) return;
    await fetch(`/knowledge-base/api/documents/${id}`, { method: 'DELETE' });
    loadDocs();
}

async function clearChat() {
    if (!confirm('清空对话？')) return;
    await fetch('/knowledge-base/api/clear-history', { method: 'POST' });
    document.getElementById('chatArea').innerHTML = `
        <div class="kb-empty"><div class="icon">💬</div><div class="title">智能知识库问答</div><div class="desc">上传文档后在这里提问</div></div>`;
}

async function clearCache() {
    await fetch('/knowledge-base/api/clear-cache', { method: 'POST' });
    alert('缓存已清');
}

async function reindexAll() {
    if (!confirm('重新索引所有文档？\n\n用于换模型后重建向量库，可能需要几分钟。')) return;
    const btn = event.target;
    btn.disabled = true;
    try {
        await fetch('/knowledge-base/api/reindex-all', { method: 'POST' });
        // 轮询进度
        const timer = setInterval(async () => {
            const r = await fetch('/knowledge-base/api/reindex-status');
            const s = await r.json();
            btn.textContent = `索引中 ${s.done}/${s.total}`;
            if (!s.running) {
                clearInterval(timer);
                btn.textContent = '重建索引';
                btn.disabled = false;
                alert(`完成: ${s.done}个成功${s.failed.length ? ', 失败: ' + s.failed.length + '个' : ''}`);
                loadDocuments();
            }
        }, 2000);
    } catch (e) {
        alert('失败: ' + e.message);
        btn.textContent = '重建索引';
        btn.disabled = false;
    }
}

async function loadInsights() {
    try {
        const res = await fetch('/knowledge-base/api/insights');
        const data = await res.json();
        if (data.status === 'success') {
            const ins = data.insights;
            let html = '## 知识洞察\\n\\n';
            html += `**覆盖**: ${ins.coverage||''}\\n\\n`;
            if (ins.gaps) html += `**缺失**: ${ins.gaps.join('、')}\\n\\n`;
            if (ins.suggestions) html += `**建议**: ${ins.suggestions.join('、')}\\n\\n`;
            if (ins.categories) { html += '**分类**: '; for (const [k,v] of Object.entries(ins.categories)) html += `${k}(${v}) `; html += '\\n'; }
            document.getElementById('chatArea').innerHTML = '';
            addMessage('ai', html);
        }
    } catch (e) { alert('失败'); }
}

async function loadHistory() {
    try {
        const res = await fetch('/knowledge-base/api/chat-history');
        const data = await res.json();
        if (data.status === 'success' && data.history.length) {
            document.getElementById('chatArea').innerHTML = '';
            for (const h of data.history.reverse()) {
                addMessage('user', h.question);
                addMessage('ai', h.answer);
            }
        } else { alert('暂无历史'); }
    } catch (e) { alert('失败'); }
}

function exportChat() { window.open('/knowledge-base/api/export', '_blank'); }

async function uploadFile(input) {
    const file = input.files[0];
    if (!file) return;
    const isImg = file.type.startsWith('image/');
    const label = document.querySelector('.kb-upload-area label');
    label.textContent = isImg ? '识别中...' : '上传中...';
    const fd = new FormData();
    fd.append('file', file);
    try {
        const res = await fetch('/knowledge-base/api/upload-file', { method: 'POST', body: fd });
        const data = await res.json();
        alert(data.status === 'success' ? '完成' : '失败: ' + (data.error||''));
        loadDocs();
    } catch (e) { alert('失败'); }
    label.textContent = '📎 上传文件（TXT/PDF/Word/Excel/CSV/图片）';
    input.value = '';
}

async function uploadManual() {
    const title = document.getElementById('manualTitle').value.trim();
    const content = document.getElementById('manualContent').value.trim();
    if (!content) { alert('输入内容'); return; }
    const btn = event.target;
    btn.disabled = true;
    btn.textContent = '上传中...';
    const fd = new FormData();
    fd.append('title', title);
    fd.append('content', content);
    try {
        const res = await fetch('/knowledge-base/api/documents', { method: 'POST', body: fd });
        const data = await res.json();
        if (data.status === 'success') {
            document.getElementById('manualTitle').value = '';
            document.getElementById('manualContent').value = '';
            loadDocs();
        } else {
            alert('失败: ' + (data.error||''));
        }
    } catch (e) { alert('上传失败'); }
    btn.disabled = false;
    btn.textContent = '添加文档';
}

let _micBusy = false;
function toggleMic() {
    const btn = document.getElementById('micBtn');
    if (_micBusy) return;
    if (btn.classList.contains('recording')) {
        // 停止录音
        _micBusy = true;
        btn.textContent = '识别中...';
        fetch('/knowledge-base/api/mic-stop', { method: 'POST' })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                _micBusy = false;
                btn.classList.remove('recording');
                btn.textContent = '🎤';
                if (data.status === 'success' && data.text) {
                    const input = document.getElementById('questionInput');
                    input.value = input.value ? input.value + ' ' + data.text : data.text;
                    input.focus();
                } else if (data.status !== 'success') {
                    alert('识别失败: ' + (data.error || ''));
                }
            })
            .catch(function(e) {
                _micBusy = false;
                btn.classList.remove('recording');
                btn.textContent = '🎤';
                alert('停止失败: ' + e.message);
            });
    } else {
        // 开始录音
        _micBusy = true;
        fetch('/knowledge-base/api/mic-start', { method: 'POST' })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                _micBusy = false;
                if (data.status === 'recording' || data.status === 'already') {
                    btn.classList.add('recording');
                    btn.textContent = '⏹';
                } else {
                    alert('启动失败: ' + (data.error || ''));
                }
            })
            .catch(function(e) {
                _micBusy = false;
                alert('启动失败: ' + e.message);
            });
    }
}

function handlePaste(e) {
    const items = e.clipboardData.items;
    for (const item of items) {
        if (item.type.startsWith('image/')) {
            e.preventDefault();
            const file = item.getAsFile();
            uploadPastedImage(file);
            return;
        }
    }
}

async function uploadPastedImage(file) {
    const input = document.getElementById('questionInput');
    const placeholder = input.placeholder;
    input.placeholder = '图片识别中...';
    const fd = new FormData();
    fd.append('file', file, 'pasted.png');
    try {
        const res = await fetch('/knowledge-base/api/upload-file', { method: 'POST', body: fd });
        const data = await res.json();
        input.placeholder = placeholder;
        if (data.status === 'success') {
            alert('图片已识别并加入知识库：' + (data.title || ''));
        } else {
            alert('图片识别失败: ' + (data.error || ''));
        }
    } catch (e) {
        input.placeholder = placeholder;
        alert('图片上传失败: ' + e.message);
    }
}

async function sendQuestion() {
    const input = document.getElementById('questionInput');
    const q = input.value.trim();
    if (!q) return;
    document.body.classList.remove('kb-centered');
    const btn = document.getElementById('sendBtn');
    btn.disabled = true; btn.textContent = '...';
    addMessage('user', q);
    input.value = '';
    const loadingId = addMessage('ai', '<span style="color:#999;">正在思考<span class="dots">...</span></span>');
    try {
        const res = await fetch('/knowledge-base/api/ask', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question: q })
        });
        const data = await res.json();
        removeMessage(loadingId);
        if (data.status === 'success') {
            lastMsgId = addMessage('ai', data.answer, data.contexts);
        } else {
            addMessage('ai', '出错: ' + (data.error||''));
        }
    } catch (e) { removeMessage(loadingId); addMessage('ai', '请求失败'); }
    btn.disabled = false; btn.textContent = '发送';
}

function renderMD(text) {
    if (!text) return '';
    let h = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    h = h.replace(/^### (.*)$/gm, '<h4 style="margin:8px 0 4px;font-size:14px;">$1</h4>');
    h = h.replace(/^## (.*)$/gm, '<h3 style="margin:10px 0 6px;font-size:15px;">$1</h3>');
    h = h.replace(/^# (.*)$/gm, '<h2 style="margin:12px 0 8px;font-size:16px;">$1</h2>');
    h = h.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
    h = h.replace(/^[-*] (.*)$/gm, '<li>$1</li>');
    h = h.replace(/(<li>.*<\/li>\n?)+/g, '<ul style="margin:4px 0;padding-left:18px;">$&</ul>');
    h = h.replace(/\n/g, '<br>');
    h = h.replace(/<\/li><br>/g, '</li>').replace(/<br><li/g, '<li');
    return h;
}

function addMessage(role, content, contexts) {
    const area = document.getElementById('chatArea');
    const empty = area.querySelector('.kb-empty');
    if (empty) empty.remove();
    const div = document.createElement('div');
    div.className = 'kb-msg ' + role;
    const id = 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2,5);
    div.id = id;
    const avatar = role === 'user' ? '👤' : '🤖';
    let html = `<div class="kb-avatar">${avatar}</div><div class="kb-bubble">`;
    let answerHtml = (role === 'ai' && content.includes('<span')) ? content : (role === 'ai' ? renderMD(content) : content);
    // 把[来源N]替换成灰色小号文档名
    if (role === 'ai' && contexts && contexts.length) {
        for (let i = 0; i < contexts.length; i++) {
            const n = i + 1;
            const title = contexts[i].title || '文档' + n;
            // 转义HTML
            const safeTitle = title.replace(/</g,'&lt;').replace(/>/g,'&gt;');
            const tag = `<span style="color:#999;font-size:11px;background:#f5f5f5;padding:1px 4px;border-radius:3px;margin:0 1px;">${safeTitle}</span>`;
            answerHtml = answerHtml.replace(new RegExp('\\[来源' + n + '\\]', 'g'), tag);
            // 也处理[1][2]这种简写
            answerHtml = answerHtml.replace(new RegExp('\\[' + n + '\\]', 'g'), tag);
        }
    }
    html += answerHtml;
    if (contexts && contexts.length) {
        html += '<div class="kb-context"><div class="kb-context-title">参考来源</div>' +
            contexts.map((c,i) => {
                let line = `<span style="color:#999;font-size:11px;">[${i+1}] ${c.title}</span>`;
                if (c.doc_id && !c.doc_id.startsWith('cr_')) {
                    line += ` <a href="/knowledge-base/api/download/${c.doc_id}" style="display:inline-flex;align-items:center;gap:2px;font-size:10px;color:#3b82f6;background:#eff6ff;padding:1px 6px;border-radius:4px;text-decoration:none;margin-left:4px;border:1px solid #bfdbfe;">⬇ 下载</a>`;
                }
                return line;
            }).join('<br>') + '</div>';
    }
    if (role === 'ai') {
        html += `<div class="kb-feedback">
            <button class="kb-fb-btn" onclick="feedback(this,'up')">👍 有用</button>
            <button class="kb-fb-btn" onclick="feedback(this,'down')">👎 没用</button>
            <button class="kb-fb-btn" onclick="exportAnswer(this,'md')">📄 MD</button>
            <button class="kb-fb-btn" onclick="exportAnswer(this,'xlsx')">📊 Excel</button>
            <button class="kb-fb-btn" onclick="exportAnswer(this,'docx')">📝 Word</button>
        </div>`;
    }
    html += '</div>';
    div.innerHTML = html;
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
    return id;
}

function removeMessage(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
}

async function exportAnswer(btn, format) {
    const msgDiv = btn.closest('.kb-msg');
    const bubble = msgDiv.querySelector('.kb-bubble');
    // 排除反馈按钮区域
    const feedback = bubble.querySelector('.kb-feedback');
    const text = feedback ? bubble.innerText.replace(feedback.innerText, '') : bubble.innerText;
    btn.textContent = '导出中...';
    try {
        const res = await fetch('/knowledge-base/api/export-answer', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({text: text, format: format})
        });
        if (!res.ok) throw new Error('导出失败');
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const now = new Date().toISOString().slice(0,10);
        a.download = `知识库回答_${now}.${format}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    } catch (e) {
        alert('导出失败: ' + e.message);
    }
    btn.textContent = format === 'md' ? '📄 MD' : (format === 'xlsx' ? '📊 Excel' : '📝 Word');
}

async function feedback(btn, type) {
    const msgDiv = btn.closest('.kb-msg');
    const q = msgDiv.querySelector('.kb-bubble').innerText.substring(0, 200);
    // 取消其他按钮
    btn.parentElement.querySelectorAll('.kb-fb-btn').forEach(b => b.classList.remove('active-up','active-down'));
    btn.classList.add(type === 'up' ? 'active-up' : 'active-down');
    // 记录反馈
    try {
        await fetch('/knowledge-base/api/feedback', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question: q, feedback: type })
        });
    } catch (e) {}
}

let searchTimer = null;
function handleSearch(val) {
    clearTimeout(searchTimer);
    if (!val.trim()) {
        document.getElementById('searchResults').style.display = 'none';
        document.getElementById('docList').style.display = '';
        return;
    }
    searchTimer = setTimeout(async () => {
        try {
            const res = await fetch(`/knowledge-base/api/search?q=${encodeURIComponent(val)}`);
            const data = await res.json();
            if (data.status === 'success' && data.results.length) {
                document.getElementById('docList').style.display = 'none';
                const sr = document.getElementById('searchResults');
                sr.style.display = '';
                sr.innerHTML = '<div style="font-size:11px;color:#9ca3af;margin-bottom:4px;">' + data.count + '条结果</div>' +
                    data.results.map(r => `<div style="padding:6px 8px;margin-bottom:2px;background:#f9fafb;border-radius:4px;font-size:12px;">
                        <div style="font-weight:600;">${r.title}</div>
                        <div style="color:#6b7280;font-size:11px;">${r.content.substring(0,120)}...</div>
                    </div>`).join('');
            }
        } catch (e) {}
    }, 300);
}

loadDocs();
loadChatHistory();
checkReindexStatus();

async function checkReindexStatus() {
    try {
        const r = await fetch('/knowledge-base/api/reindex-status');
        const s = await r.json();
        const btns = document.querySelectorAll('.kb-btn');
        for (const b of btns) {
            if (b.textContent.includes('重建索引') || b.textContent.includes('索引中')) {
                if (s.running) {
                    b.textContent = `索引中 ${s.done}/${s.total}`;
                    b.disabled = true;
                    const timer = setInterval(async () => {
                        const r2 = await fetch('/knowledge-base/api/reindex-status');
                        const s2 = await r2.json();
                        b.textContent = `索引中 ${s2.done}/${s2.total}`;
                        if (!s2.running) {
                            clearInterval(timer);
                            b.textContent = '重建索引';
                            b.disabled = false;
                        }
                    }, 2000);
                } else {
                    b.textContent = '重建索引';
                    b.disabled = false;
                }
            }
        }
    } catch (e) {}
}

async function loadChatHistory() {
    try {
        const r = await fetch('/knowledge-base/api/chat-history');
        const history = await r.json();
        if (history && history.length) {
            const area = document.getElementById('chatArea');
            const empty = area.querySelector('.kb-empty');
            if (empty) empty.remove();
            for (const item of history) {
                addMessage('user', item.question);
                addMessage('ai', item.answer);
            }
            area.scrollTop = area.scrollHeight;
        } else {
            document.body.classList.add('kb-centered');
        }
    } catch (e) {
        document.body.classList.add('kb-centered');
    }
}
