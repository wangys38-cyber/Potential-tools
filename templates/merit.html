<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>功德+1 </title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%231d1d1f%22 stroke-width=%222%22><rect x=%223%22 y=%223%22 width=%2218%22 height=%2218%22 rx=%222%22/><path d=%22M9 9h6v6H9z%22/></svg>">
    <link rel="stylesheet" href="/static/css/theme.css?v={{ STATIC_VERSION }}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            color: #1d1d1f;
            user-select: none;
            -webkit-user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* 移除星星粒子 */
        .stars { display: none !important; }

        /* 顶部按钮 */
        .reset-btn {
            position: fixed;
            top: 68px;
            left: 20px;
            z-index: 100;
            background: #ffffff;
            border: 1px solid #d2d2d7;
            border-radius: 10px;
            padding: 8px 16px;
            color: #1d1d1f;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: inherit;
        }
        .reset-btn:hover {
            background: #f5f5f7;
            border-color: #1d1d1f;
        }

        /* 总功德卡片 */
        .total-merit {
            position: fixed;
            top: 68px;
            right: 20px;
            z-index: 100;
            background: #ffffff;
            border: 1px solid #e8e8ed;
            border-radius: 16px;
            padding: 14px 22px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            min-width: 130px;
        }
        .total-merit .label {
            font-size: 11px;
            color: #86868b;
            letter-spacing: 2px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .total-merit .value {
            font-size: 32px;
            font-weight: 700;
            line-height: 1;
            color: #1d1d1f;
            font-variant-numeric: tabular-nums;
        }
        .total-merit .unit {
            font-size: 12px;
            color: #86868b;
            margin-left: 2px;
            font-weight: 500;
        }

        /* 场景 */
        .scene {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            cursor: pointer;
        }
        .fish-area {
            position: relative;
            width: 380px;
            height: 340px;
        }

        /* 木鱼主体容器 */
        .wooden-fish-wrap {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: transform 0.06s ease-out;
            z-index: 5;
        }
        .wooden-fish-wrap.knock {
            transform: translate(-50%, -48%) scale(0.97);
        }

        /* 木鱼锤 */
        .mallet-wrap {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%) rotate(-20deg);
            transform-origin: bottom center;
            transition: transform 0.1s ease-out;
            z-index: 6;
            pointer-events: none;
        }
        .mallet-wrap.knock {
            transform: translateX(-50%) rotate(10deg);
            transition: transform 0.05s ease-in;
        }

        /* 提示文字 */
        .hint {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            color: #aeaeb2;
            letter-spacing: 4px;
            white-space: nowrap;
        }

        /* 今日功德 */
        .today-merit {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: #f5f5f7;
            border-radius: 14px;
            padding: 12px 28px;
            text-align: center;
            min-width: 140px;
        }
        .today-merit .label {
            font-size: 11px;
            color: #86868b;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }
        .today-merit .value {
            font-size: 24px;
            font-weight: 700;
            color: #1d1d1f;
            font-variant-numeric: tabular-nums;
        }
        .today-merit .date {
            font-size: 10px;
            color: #aeaeb2;
            margin-top: 2px;
        }

        /* 功德弹出动画 */
        .merit-popup {
            position: absolute;
            font-size: 28px;
            font-weight: 700;
            color: #1d1d1f;
            pointer-events: none;
            z-index: 20;
            animation: popupFloat 1s ease-out forwards;
        }
        @keyframes popupFloat {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.2); }
        }

        /* 成就弹窗 */
        .achievement {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            z-index: 200;
            background: #ffffff;
            border: 1px solid #e8e8ed;
            border-radius: 20px;
            padding: 32px 40px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0,0,0,0.12);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            max-width: 320px;
        }
        .achievement.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }
        .achievement .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .achievement .title {
            font-size: 20px;
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 6px;
        }
        .achievement .desc {
            font-size: 14px;
            color: #86868b;
            line-height: 1.5;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .fish-area { width: 300px; height: 280px; }
            .fish-svg { width: 280px; height: 210px; }
            .mallet-wrap { width: 150px; height: 140px; top: -40px; }
            .total-merit { padding: 10px 16px; min-width: 100px; top: 64px; right: 12px; }
            .total-merit .value { font-size: 24px; }
            .reset-btn { padding: 8px 14px; top: 64px; left: 12px; font-size: 12px; }
            .today-merit { padding: 10px 22px; bottom: 24px; }
            .today-merit .value { font-size: 20px; }
            .hint { font-size: 11px; letter-spacing: 3px; }
            .achievement { padding: 24px 28px; }
        }
        @media (max-width: 360px) {
            .fish-area { width: 260px; height: 240px; }
            .fish-svg { width: 240px; height: 180px; }
            .mallet-wrap { width: 130px; height: 120px; top: -35px; }
            .total-merit { min-width: 85px; padding: 8px 12px; }
            .total-merit .value { font-size: 20px; }
            .reset-btn { left: 8px; padding: 7px 12px; }
            .hint { font-size: 10px; letter-spacing: 2px; }
            .merit-popup { font-size: 22px; }
        }
    </style>

                    <g opacity="0.25" fill="none" stroke="rgba(255,200,180,0.6)" stroke-width="1.5">

                        <path d="M 310 155 Q 318 152 320 160 Q 318 168 308 165"/>
                        <circle cx="312" cy="142" r="1.5" fill="rgba(255,200,180,0.5)"/>

                    <circle cx="180" cy="55" r="4" fill="rgba(255,200,160,0.2)" stroke="rgba(255,180,140,0.3)" stroke-width="1"/>

        <div class="hint">点击木鱼 · 积攒功德</div>

    <div class="today-merit">
        <div class="label">今日功德</div>
        <div class="value" id="todayMerit">0</div>
        <div class="date" id="todayDate"></div>
    </div>

    <div class="achievement" id="achievement">
        <div class="icon" id="achIcon"></div>
        <div class="title" id="achTitle">功德圆满</div>
        <div class="desc" id="achDesc">恭喜达成新成就</div>
    </div>

    <script>
        // 按用户隔离存储 key，游客使用默认 key
        const _USER_PREFIX = {% if current_user %}'u{{ current_user.id }}_'{% else %}''{% endif %};
        const STORAGE_KEY_TOTAL = _USER_PREFIX + 'merit_total';
        const STORAGE_KEY_HISTORY = _USER_PREFIX + 'merit_history';
        const STORAGE_KEY_ACH = _USER_PREFIX + 'merit_achievements';

        function getTodayStr() {
            const now = new Date();
            return now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
        }

        function loadData() {
            const total = parseInt(localStorage.getItem(STORAGE_KEY_TOTAL) || '0');
            let history = {};
            try { history = JSON.parse(localStorage.getItem(STORAGE_KEY_HISTORY) || '{}'); } catch (e) { history = {}; }
            const today = getTodayStr();
            return { total, history, today, todayMerit: history[today] || 0 };
        }

        function saveData(total, history) {
            localStorage.setItem(STORAGE_KEY_TOTAL, String(total));
            localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(history));
        }

        let audioCtx = null;
        function playKnockSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const now = audioCtx.currentTime;
                // 低频木质敲击
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(180, now);
                osc1.frequency.exponentialRampToValueAtTime(60, now + 0.15);
                gain1.gain.setValueAtTime(0.55, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                osc1.connect(gain1); gain1.connect(audioCtx.destination);
                osc1.start(now); osc1.stop(now + 0.22);
                // 高频泛音
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'triangle';
                osc2.frequency.setValueAtTime(320, now);
                osc2.frequency.exponentialRampToValueAtTime(110, now + 0.1);
                gain2.gain.setValueAtTime(0.18, now);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                osc2.connect(gain2); gain2.connect(audioCtx.destination);
                osc2.start(now); osc2.stop(now + 0.14);
            } catch (e) {}
        }

        let meritData = loadData();

        function updateUI() {
            document.getElementById('totalMerit').textContent = meritData.total;
            document.getElementById('todayMerit').textContent = meritData.todayMerit;
            const date = new Date();
            const weekdays = ['日','一','二','三','四','五','六'];
            document.getElementById('todayDate').textContent = meritData.today + ' · 星期' + weekdays[date.getDay()];
        }

        function showMeritPopup(x, y) {
            const popup = document.createElement('div');
            popup.className = 'merit-popup';
            popup.textContent = '功德 +1';
            popup.style.left = (x - 40) + 'px';
            popup.style.top = (y - 30) + 'px';
            document.body.appendChild(popup);
            setTimeout(() => popup.remove(), 1200);
        }

        function showRipple(x, y) {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 800);
        }

        function showFlash(area) {
            const flash = document.createElement('div');
            flash.className = 'flash';
            area.appendChild(flash);
            setTimeout(() => flash.remove(), 400);
        }

        const scene = document.getElementById('scene');
        const fishArea = document.getElementById('fishArea');
        const woodenFish = document.getElementById('woodenFish');
        const mallet = document.getElementById('mallet');
        let knockTimer = null;
        let malletTimer = null;

        function knock(e) {
            e.preventDefault();
            const x = e.clientX || (window.innerWidth / 2);
            const y = e.clientY || (window.innerHeight / 2);

            meritData.total += 1;
            meritData.todayMerit += 1;
            meritData.history[meritData.today] = meritData.todayMerit;
            saveData(meritData.total, meritData.history);
            updateUI();

            playKnockSound();

            // 锤子挥下
            mallet.classList.remove('knock');
            void mallet.offsetWidth;
            mallet.classList.add('knock');
            clearTimeout(malletTimer);
            malletTimer = setTimeout(() => mallet.classList.remove('knock'), 400);

            // 木鱼按压（延迟到锤子接触时刻）
            setTimeout(() => {
                woodenFish.classList.add('knock');
                showFlash(fishArea);
                clearTimeout(knockTimer);
                knockTimer = setTimeout(() => woodenFish.classList.remove('knock'), 80);
            }, 120);

            showMeritPopup(x, y);
            showRipple(x, y);
            checkAchievement(meritData.total);
        }

        scene.addEventListener('click', knock);
        scene.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            knock({ clientX: touch.clientX, clientY: touch.clientY, preventDefault: () => {} });
        });

        const achievements = [
            { count: 10, icon: '', title: '初结善缘', desc: '功德+10，善念初起' },
            { count: 50, icon: '', title: '积善成德', desc: '功德+50，德行渐增' },
            { count: 100, icon: '', title: '百善孝先', desc: '功德+100，福报渐近' },
            { count: 500, icon: '', title: '功德无量', desc: '功德+500，福泽深厚' },
            { count: 1000, icon: '', title: '千载难逢', desc: '功德+1000，修行有成' },
            { count: 5000, icon: '', title: '功德圆满', desc: '功德+5000，大功告成' },
            { count: 10000, icon: '', title: '万德归一', desc: '功德+10000，功德圆满' },
        ];
        let triggeredAchievements = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY_ACH) || '[]'));

        function checkAchievement(total) {
            for (const ach of achievements) {
                if (total >= ach.count && !triggeredAchievements.has(ach.count)) {
                    triggeredAchievements.add(ach.count);
                    localStorage.setItem(STORAGE_KEY_ACH, JSON.stringify([...triggeredAchievements]));
                    showAchievement(ach);
                    break;
                }
            }
        }

        function showAchievement(ach) {
            const el = document.getElementById('achievement');
            document.getElementById('achIcon').textContent = ach.icon;
            document.getElementById('achTitle').textContent = ach.title;
            document.getElementById('achDesc').textContent = ach.desc;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 2500);
        }

        function resetMerit() {
            if (!confirm('确定要重置所有功德吗？此操作不可恢复。')) return;
            meritData = { total: 0, history: {}, today: getTodayStr(), todayMerit: 0 };
            triggeredAchievements.clear();
            localStorage.removeItem(STORAGE_KEY_TOTAL);
            localStorage.removeItem(STORAGE_KEY_HISTORY);
            localStorage.removeItem(STORAGE_KEY_ACH);
            updateUI();
        }

        function createStars() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 60; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (2 + Math.random() * 3) + 's';
                container.appendChild(star);
            }
        }

        function checkDayChange() {
            const today = getTodayStr();
            if (today !== meritData.today) { meritData = loadData(); updateUI(); }
        }
        setInterval(checkDayChange, 60000);

        updateUI();
    </script>
    <script>window._USER_PREFIX='{% if current_user %}u{{ current_user.id }}_{% endif %}';</script>

</body>
