<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>插件管理 - Potential Tools</title>
    <link rel="stylesheet" href="/static/css/style.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/page/plugins.css?v={{ STATIC_VERSION }}">
</head>
<body>
    {% include 'nav.html' %}

    <div class="plugins-container">
        <div class="plugins-header">
            <div>
                <h1>🔌 插件管理</h1>
                <p class="plugins-subtitle">扩展平台功能，打造专属工作流</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="reloadPlugins()">🔄 重新加载</button>
                <button class="btn btn-secondary" onclick="showInstallModal()">📦 安装插件</button>
            </div>
        </div>

        <div class="plugins-stats">
            <div class="stat-card">
                <div class="stat-value" id="totalCount">0</div>
                <div class="stat-label">总插件数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="enabledCount">0</div>
                <div class="stat-label">已启用</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="disabledCount">0</div>
                <div class="stat-label">已禁用</div>
            </div>
        </div>

        <div class="plugins-grid" id="pluginsGrid">
            <div class="empty-state">加载中...</div>
        </div>
    </div>

    <!-- 安装插件弹窗 -->
    <div class="modal-overlay" id="installModal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>安装插件</h3>
                <button class="modal-close" onclick="closeInstallModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>插件来源</label>
                    <select id="installSource" onchange="switchInstallSource()">
                        <option value="local">本地目录</option>
                        <option value="url">URL 下载</option>
                        <option value="market">插件市场</option>
                    </select>
                </div>
                <div id="localInstall" class="form-group">
                    <label>将插件文件夹放入 plugins/ 目录后点击刷新</label>
                    <button class="btn btn-secondary" onclick="reloadPlugins()">刷新插件列表</button>
                </div>
                <div id="urlInstall" class="form-group" style="display:none;">
                    <label>插件 ZIP 下载地址</label>
                    <input type="text" id="pluginUrl" placeholder="https://example.com/plugin.zip">
                    <button class="btn btn-primary" onclick="installFromUrl()" style="margin-top:8px;">下载并安装</button>
                </div>
                <div id="marketInstall" class="form-group" style="display:none;">
                    <p style="color:#86868b;font-size:13px;">插件市场即将上线，敬请期待</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 插件配置弹窗 -->
    <div class="modal-overlay" id="settingsModal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="settingsTitle">插件配置</h3>
                <button class="modal-close" onclick="closeSettingsModal()">&times;</button>
            </div>
            <div class="modal-body" id="settingsBody">
                <div class="empty-state">加载中...</div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeSettingsModal()">取消</button>
                <button class="btn btn-primary" onclick="saveSettings()">保存</button>
            </div>
        </div>
    </div>

    <script src="/static/js/page/plugins.js?v={{ STATIC_VERSION }}"></script>
</body>
</html>
