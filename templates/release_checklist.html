<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>版本发布检查清单</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%231d1d1f%22 stroke-width=%222%22><rect x=%223%22 y=%223%22 width=%2218%22 height=%2218%22 rx=%222%22/><path d=%22M9 9h6v6H9z%22/></svg>">
    <link rel="stylesheet" href="/static/css/theme.css?v={{ STATIC_VERSION }}">
    

<link rel="stylesheet" href="/static/css/ux-enhancements.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/de-ai.css?v={{ STATIC_VERSION }}"><link rel="stylesheet" href="/static/css/components.css?v={{ STATIC_VERSION }}">    <link rel="stylesheet" href="/static/css/mobile.css?v={{ STATIC_VERSION }}">

    <link rel="stylesheet" href="/static/css/design-system.css?v={{ STATIC_VERSION }}">
<link rel="stylesheet" href="/static/css/page/release_checklist.css?v={{ STATIC_VERSION }}">
</head>
<body>
{% include '_navbar.html' %}

    <div class="container">
        <div class="version-input">
            <label>版本号：</label>
            <input type="text" id="versionInput" placeholder="如：V1.78 / V7.9.0.0" oninput="saveState()">
            <button class="btn" onclick="linkToPlan()"> 关联项目计划</button>
        </div>
        <div class="progress-bar">
            <div class="progress-header">
                <span class="progress-text">总体完成度</span>
                <span class="progress-percent" id="progressPercent">0%</span>
            </div>
            <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
        </div>
        <div class="stage-tabs" id="stageTabs"></div>
        <div id="checklistContainer"></div>
        <div class="actions">
            <button class="btn btn-primary" onclick="exportChecklist()"> 导出检查结果</button>
            <button class="btn" onclick="resetAll()"> 重置全部</button>
        </div>
    </div>
    <script>
        const STAGES = [
            { id: 'bringup', name: 'Bring up', icon: '', items: [
                {title: '硬件基本功能验证', desc: '开机、充电、按键、屏幕、传感器基础功能正常'},
                {title: '基础通信验证', desc: '蓝牙/WiFi/NFC 连接与基本数据传输'},
                {title: '驱动 Bring up', desc: '各模块驱动加载正常，无严重报错'},
                {title: '电源管理基础', desc: '开关机、休眠唤醒、基础功耗测量'},
                {title: '开发环境就绪', desc: '调试口、日志输出、烧录工具可用'},
            ]},
            { id: 'cp', name: 'CP (Customer Prototype)', icon: '', items: [
                {title: '核心功能完整', desc: '所有 P0 功能可演示，无 Blocker Bug'},
                {title: '性能基线达标', desc: '启动时间、响应速度、帧率达到基线要求'},
                {title: '续航初步验证', desc: '典型场景续航达到预期 80% 以上'},
                {title: '稳定性测试', desc: '72小时连续运行无死机重启'},
                {title: 'CR 问题收敛', desc: 'P0/P1 Bug 全部解决，P2 解决率 > 70%'},
                {title: '硬件版本锁定', desc: '硬件 BOM 锁定，无重大变更'},
            ]},
            { id: 'df', name: 'DF (Design For Manufacturing)', icon: '', items: [
                {title: '量产工艺验证', desc: '产线测试流程跑通，良率达标'},
                {title: 'EMC/可靠性测试', desc: 'EMC、高低温、跌落、防水等测试通过'},
                {title: '功耗最终验证', desc: '所有场景续航达到规格书要求'},
                {title: '固件功能完整', desc: '所有功能开发完成，P0/P1 Bug 清零'},
                {title: 'CR 解决率 > 95%', desc: '遗留问题均为 P3 且有规避方案'},
                {title: 'MTTF 达标', desc: '平均无故障时间达到可靠性指标'},
                {title: '认证测试通过', desc: 'SRRC/CE/FCC/BQB 等认证测试完成'},
            ]},
            { id: 'rrr', name: 'RRR (Release Readiness Review)', icon: '', items: [
                {title: '零 Blocker Bug', desc: '无任何阻断发布的严重问题'},
                {title: 'CR 全部关闭', desc: '所有已知问题解决或接受风险'},
                {title: '量产固件锁定', desc: '固件版本冻结，签名验证通过'},
                {title: '用户手册就绪', desc: '说明书、快速指南、保修卡完成'},
                {title: 'OTA 升级验证', desc: '升级路径测试通过，回滚方案就绪'},
                {title: '客服培训完成', desc: 'FAQ、常见问题处理流程培训完毕'},
                {title: '发布审批通过', desc: '项目经理、测试、质量三方签字'},
            ]},
        ];

        // 按用户隔离存储 key
        const _USER_PREFIX = {% if current_user %}'u{{ current_user.id }}_'{% else %}''{% endif %};
        const STORAGE_KEY = _USER_PREFIX + 'release_checklist_state';

        let currentStage = 'bringup';
        let state = {};

        function loadState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                state = saved ? JSON.parse(saved) : {};
            } catch(e) { state = {}; }
            if (!state.checks) state.checks = {};
            if (!state.version) state.version = '';
            document.getElementById('versionInput').value = state.version || '';
        }

        function saveState() {
            state.version = document.getElementById('versionInput').value;
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
            updateProgress();
        }

        function renderTabs() {
            const tabs = document.getElementById('stageTabs');
            tabs.innerHTML = STAGES.map(s => {
                const checked = countStage(s.id);
                const total = s.items.length;
                return `<div class="stage-tab ${s.id===currentStage?'active':''}" onclick="selectStage('${s.id}')">
                    <span>${s.icon}</span>${s.name}
                    <span class="stage-count">${checked}/${total}</span>
                </div>`;
            }).join('');
        }

        function selectStage(id) {
            currentStage = id;
            renderTabs();
            renderChecklist();
        }

        function countStage(stageId) {
            const stage = STAGES.find(s => s.id === stageId);
            return stage.items.filter((_,i) => state.checks[`${stageId}_${i}`]).length;
        }

        function renderChecklist() {
            const stage = STAGES.find(s => s.id === currentStage);
            const checked = countStage(currentStage);
            const total = stage.items.length;
            const isGo = checked === total;
            const container = document.getElementById('checklistContainer');
            container.innerHTML = `
                <div class="checklist">
                    <div class="checklist-title">
                        ${stage.icon} ${stage.name} 检查项
                        <span class="go-badge ${isGo?'go':'nogo'}">${isGo?' GO':' NO-GO'} (${checked}/${total})</span>
                    </div>
                    ${stage.items.map((item,i) => {
                        const key = `${currentStage}_${i}`;
                        const isChecked = state.checks[key];
                        return `<div class="check-item ${isChecked?'checked':''}">
                            <input type="checkbox" ${isChecked?'checked':''} onchange="toggleItem('${key}', this.checked)">
                            <div class="check-item-content">
                                <div class="check-item-title">${item.title}</div>
                                <div class="check-item-desc">${item.desc}</div>
                            </div>
                        </div>`;
                    }).join('')}
                </div>
            `;
        }

        function toggleItem(key, checked) {
            state.checks[key] = checked;
            saveState();
            renderTabs();
            renderChecklist();
        }

        function updateProgress() {
            let total = 0, checked = 0;
            STAGES.forEach(s => { total += s.items.length; checked += countStage(s.id); });
            const pct = total ? Math.round(checked/total*100) : 0;
            document.getElementById('progressPercent').textContent = pct + '%';
            document.getElementById('progressFill').style.width = pct + '%';
        }

        function linkToPlan() {
            if (confirm('跳转到软件计划生成器，可创建关联的项目计划？')) {
                window.location.href = '/plan-generator';
            }
        }

        function exportChecklist() {
            const version = state.version || '未命名版本';
            let text = `版本发布检查清单 — ${version}\n生成时间：${new Date().toLocaleString('zh-CN')}\n\n`;
            STAGES.forEach(s => {
                const checked = countStage(s.id);
                text += `\n【${s.icon} ${s.name}】${checked===s.items.length?' GO':' NO-GO'} (${checked}/${s.items.length})\n`;
                s.items.forEach((item,i) => {
                    const key = `${s.id}_${i}`;
                    text += `${state.checks[key]?'':''} ${item.title}\n`;
                });
            });
            const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `发布检查清单_${version}.txt`;
            a.click(); URL.revokeObjectURL(url);
        }

        function resetAll() {
            if (confirm('确定重置所有检查项？')) {
                state = {checks:{}, version: state.version};
                saveState();
                renderTabs();
                renderChecklist();
            }
        }

        loadState();
        renderTabs();
        renderChecklist();
        updateProgress();
    </script>
<script src="/static/js/v5-ux.js?v={{ STATIC_VERSION }}"></script>
<script src="/static/js/v5-sync.js?v={{ STATIC_VERSION }}"></script>
<script src="/static/js/components.js?v={{ STATIC_VERSION }}"></script>
<script src="/static/js/ux-enhancements.js?v={{ STATIC_VERSION }}"></script>
</body>
</html>
