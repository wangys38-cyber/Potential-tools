<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLD 生成器 — 工具集</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231d1d1f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'/><polyline points='14 2 14 8 20 8'/></svg>">
    <link rel="stylesheet" href="/static/css/theme.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/ux-enhancements.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/de-ai.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/components.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/mobile.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/design-system.css?v={{ STATIC_VERSION }}">
    
<link rel="stylesheet" href="/static/css/page/hld_generator.css?v={{ STATIC_VERSION }}">
</head>
<body>
{% include '_navbar.html' %}
    <div class="container">
        <h1 class="page-title">HLD 生成器</h1>

        <!-- 上传区域 -->
        <div class="upload-zone" id="uploadZone">
            <div class="upload-icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9 15 12 12 15 15"/></svg>
            </div>
            <div class="upload-text">点击或拖拽上传 OD Excel 文件</div>
            <div class="upload-hint">支持 .xlsx / .xls 格式，自动解析 Feature 并生成 HLD</div>
            <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none">
        </div>

        <!-- 统计栏 -->
        <div class="stats-bar" id="statsBar" style="display:none">
            <div class="stat-card">
                <div class="stat-value" id="totalCount">0</div>
                <div class="stat-label">Feature 总数</div>
            </div>
            <div class="stat-card stat-enhanced">
                <div class="stat-value" id="enhancedCount">0</div>
                <div class="stat-label">GPS/Fitness 增强</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="standardCount">0</div>
                <div class="stat-label">标准 Feature</div>
            </div>
        </div>

        <!-- 操作栏 -->
        <div class="action-bar" id="actionBar" style="display:none">
            <button class="btn" id="generateBtn" onclick="generateAll()">
                <span id="generateBtnText">生成全部 HLD 并下载 ZIP</span>
            </button>
            <button class="btn btn-secondary" onclick="reupload()">重新上传</button>
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <!-- Feature 列表 -->
        <div id="featureListContainer" style="display:none">
            <div class="feature-list">
                <div class="feature-header">
                    <div>ID</div>
                    <div>Feature Name</div>
                    <div>Priority</div>
                    <div>Type</div>
                    <div>分类</div>
                    <div>标签</div>
                </div>
                <div id="featureRows"></div>
            </div>
        </div>

        <!-- 空状态 -->
        <div class="empty-state" id="emptyState">
            <div class="empty-icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>
            </div>
            <p>上传 OD Excel 文件后，这里会显示解析到的 Feature 列表</p>
        </div>
    </div>

    <!-- 预览弹窗 -->
    <div class="preview-modal" id="previewModal">
        <div class="preview-content">
            <div class="preview-header">
                <div class="preview-title" id="previewTitle">HLD 预览</div>
                <button class="preview-close" onclick="closePreview()">×</button>
            </div>
            <div class="preview-body" id="previewBody"></div>
        </div>
    </div>

    
<script src="/static/js/page/hld_generator.js?v={{ STATIC_VERSION }}"></script>
</body>
</html>
