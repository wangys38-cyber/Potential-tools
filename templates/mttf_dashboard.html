<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTTF可靠性测试看板 - Potential Tools</title>
    <link rel="stylesheet" href="/static/css/theme.css?v={{ STATIC_VERSION }}">
    
    <link rel="stylesheet" href="/static/css/ux-enhancements.css?v={{ STATIC_VERSION }}">
    
    <link rel="stylesheet" href="/static/css/de-ai.css?v={{ STATIC_VERSION }}"><link rel="stylesheet" href="/static/css/components.css?v={{ STATIC_VERSION }}">    <link rel="stylesheet" href="/static/css/mobile.css?v={{ STATIC_VERSION }}">

    <link rel="stylesheet" href="/static/css/design-system.css?v={{ STATIC_VERSION }}">
<link rel="stylesheet" href="/static/css/page/mttf_dashboard.css?v={{ STATIC_VERSION }}">
</head>
<body>
{% include '_navbar.html' %}


    <div class="container">
        <!-- 上传区 -->
        <div id="uploadSection">
            <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
                <div class="upload-zone-icon"></div>
                <div class="upload-zone-text">点击或拖拽上传挂测日志</div>
                <div class="upload-zone-hint">支持 .log / .txt，自动识别死机、重启、看门狗、Malloc失败、Kernel Panic等</div>
                <input type="file" id="fileInput" accept=".log,.txt" style="display:none" onchange="handleFile(this.files[0])">
            </div>
            <div style="text-align:center;margin:10px 0;color:rgba(255,255,255,0.6);font-size:12px;">或</div>
            <div class="paste-section">
                <div style="font-size:13px;font-weight:600;margin-bottom:8px;"> 粘贴日志内容</div>
                <textarea id="pasteArea" placeholder="粘贴设备挂测日志，支持多行..."></textarea>
                <div class="btn-row">
                    <button class="action-btn primary" onclick="analyzePasted()"> 分析粘贴内容</button>
                    <button class="action-btn ghost" onclick="document.getElementById('pasteArea').value=''">清空</button>
                </div>
            </div>
        </div>

        <!-- 文件信息 -->
        <div class="file-info" id="fileInfo" style="display:none;">
            <span class="file-info-name" id="fileName"></span>
            <span id="fileSize" style="font-size:12px;color:var(--text-secondary)"></span>
            <button class="action-btn ghost" style="margin-left:auto;padding:4px 12px;font-size:12px;" onclick="resetAll()">重新上传</button>
        </div>

        <!-- 分析结果 -->
        <div id="analysis" style="display:none;">
            <!-- 统计卡片 -->
            <div class="stats-grid" id="statsGrid"></div>

            <!-- 失败类型分布 -->
            <div class="panel">
                <div class="panel-title"> 失败类型分布</div>
                <div class="failure-bar" id="failureBar"></div>
                <div id="failureLegend" style="display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:11px;"></div>
            </div>

            <!-- 失败时间线 -->
            <div class="panel">
                <div class="panel-title">⏱ 失败事件时间线</div>
                <div class="timeline" id="timeline"></div>
            </div>

            <!-- 失败详情 -->
            <div class="panel">
                <div class="panel-title">
                     失败详情
                    <button class="action-btn primary" style="margin-left:auto;padding:4px 12px;font-size:11px;" onclick="exportReport()"> 导出报告</button>
                </div>
                <div class="filters" id="filters"></div>
                <div style="overflow-x:auto;">
                    <table class="failure-table">
                        <thead>
                            <tr><th>时间</th><th>类型</th><th>详情</th></tr>
                        </thead>
                        <tbody id="failureTable"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="emptyState" class="empty-state">
            <div class="empty-state-icon"></div>
            <p>上传挂测日志后自动分析可靠性指标</p>
        </div>
    </div>

    
    <script src="/static/js/components.js?v={{ STATIC_VERSION }}"></script>
    <script src="/static/js/ux-enhancements.js?v={{ STATIC_VERSION }}"></script>
<script src="/static/js/page/mttf_dashboard.js?v={{ STATIC_VERSION }}"></script>
</body>
</html>
