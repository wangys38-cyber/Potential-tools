<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>团队详情</title>
    <link rel="stylesheet" href="/static/css/theme.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/ux-enhancements.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/de-ai.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/components.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/mobile.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/design-system.css?v={{ STATIC_VERSION }}">
    
<link rel="stylesheet" href="/static/css/page/team_detail.css?v={{ STATIC_VERSION }}">
</head>
<body>
{% include '_navbar.html' %}

<div class="td-container">
    <a href="/teams" class="td-back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        返回团队列表
    </a>

    <div class="td-header" id="tdHeader">
        <div class="td-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </div>
        <div class="td-info">
            <div class="td-name" id="tdTeamName">加载中...</div>
            <div class="td-desc" id="tdTeamDesc"></div>
        </div>
        <div class="td-actions" id="tdHeaderActions"></div>
    </div>

    <div class="td-section">
        <div class="td-tabs">
            <div class="td-tab active" data-tab="members" onclick="TeamDetail.switchTab('members')">成员</div>
            <div class="td-tab" data-tab="data" onclick="TeamDetail.switchTab('data')">共享数据</div>
            <div class="td-tab" data-tab="settings" onclick="TeamDetail.switchTab('settings')">设置</div>
        </div>

        <div id="tdTabMembers">
            <div class="td-section-title">
                <span>团队成员 <span id="tdMemberCount" style="color:#86868b;font-weight:400;font-size:14px;"></span></span>
                <button class="td-btn" id="tdInviteBtn" onclick="TeamDetail.openInviteModal()" style="display:none;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    邀请成员
                </button>
            </div>
            <div id="tdMemberList"><div class="td-empty">加载中...</div></div>
        </div>

        <div id="tdTabData" style="display:none;">
            <div class="td-section-title">
                <span>共享数据 <span id="tdDataCount" style="color:#86868b;font-weight:400;font-size:14px;"></span></span>
            </div>
            <div class="td-filter-bar" id="tdDataFilter"></div>
            <div id="tdDataList"><div class="td-empty">加载中...</div></div>
        </div>

        <div id="tdTabSettings" style="display:none;">
            <div class="td-section-title">团队设置</div>
            <div id="tdSettingsContent"><div class="td-empty">加载中...</div></div>
        </div>
    </div>
</div>

<!-- 邀请成员弹窗 -->
<div class="modal-overlay" id="tdInviteModal">
    <div class="modal-box">
        <div class="modal-title">邀请成员</div>
        <label class="modal-label">邮箱地址</label>
        <input type="email" class="modal-input" id="tdInviteEmail" placeholder="输入用户邮箱">
        <label class="modal-label">或用户 ID</label>
        <input type="text" class="modal-input" id="tdInviteUserId" placeholder="输入用户 ID（可选）">
        <label class="modal-label">角色</label>
        <select class="modal-select" id="tdInviteRole">
            <option value="member">普通成员</option>
            <option value="admin">管理员</option>
        </select>
        <div class="modal-actions">
            <button class="modal-btn cancel" onclick="TeamDetail.closeInviteModal()">取消</button>
            <button class="modal-btn confirm" id="tdInviteConfirm" onclick="TeamDetail.submitInvite()">邀请</button>
        </div>
    </div>
</div>

<!-- 编辑团队弹窗 -->
<div class="modal-overlay" id="tdEditModal">
    <div class="modal-box">
        <div class="modal-title">编辑团队</div>
        <label class="modal-label">团队名称</label>
        <input type="text" class="modal-input" id="tdEditName" maxlength="100">
        <label class="modal-label">团队描述</label>
        <input type="text" class="modal-input" id="tdEditDesc">
        <div class="modal-actions">
            <button class="modal-btn cancel" onclick="TeamDetail.closeEditModal()">取消</button>
            <button class="modal-btn confirm" onclick="TeamDetail.submitEdit()">保存</button>
        </div>
    </div>
</div>

<div class="toast" id="tdToast"></div>


<script>
window.__PD__ = {
    team_code: {{ team_code|tojson }},
};
</script>
<script src="/static/js/page/team_detail.js?v={{ STATIC_VERSION }}"></script>
</body>
</html>
