<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据可视化 Builder</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
    <link rel="stylesheet" href="/static/css/theme.css?v={{ STATIC_VERSION }}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg-primary); min-height: 100vh; color: var(--text-primary); }
        .header { background: rgba(255,255,255,0.72);  padding: 24px 30px; border-bottom: 1px solid var(--border); position: relative; }
        .header h1 { font-size: 28px; font-weight: 600; background: #1d1d1f; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .header p { color: var(--text-secondary); margin-top: 4px; font-size: 14px; }
        .back-btn { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-card); cursor: pointer; font-size: 14px; color: var(--text-primary); text-decoration: none; }
        .container { max-width: 1200px; margin: 24px auto; padding: 0 20px; }
        .upload-zone { border: 2px dashed var(--border-strong); border-radius: 16px; padding: 40px; text-align: center; cursor: pointer; transition: all 0.3s; background: var(--bg-card); margin-bottom: 20px; }
        .upload-zone:hover, .upload-zone.dragover { border-color: #7c3aed; background: rgba(124,58,237,0.05); }
        .upload-zone-icon { font-size: 48px; margin-bottom: 12px; }
        .upload-zone-text { font-size: 16px; }
        .upload-zone-hint { font-size: 13px; color: var(--text-secondary); margin-top: 6px; }
        .file-info { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--bg-card); border-radius: 12px; margin-bottom: 16px; border: 1px solid var(--border); }
        .file-info-name { flex: 1; font-size: 14px; font-weight: 500; }
        .file-info-btn { padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-primary); cursor: pointer; font-size: 13px; }
        .controls { background: var(--bg-card); border-radius: 16px; padding: 20px; border: 1px solid var(--border); margin-bottom: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
        .control-group label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500; }
        .control-group select, .control-group input { width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-primary); color: var(--text-primary); font-size: 13px; }
        .chart-types { display: flex; gap: 8px; }
        .chart-type-btn { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-primary); cursor: pointer; font-size: 13px; transition: all 0.2s; text-align: center; }
        .chart-type-btn.active { background: #1d1d1f; color: #fff; border-color: transparent; }
        .chart-type-btn:hover { border-color: #7c3aed; }
        .chart-container { background: var(--bg-card); border-radius: 16px; padding: 24px; border: 1px solid var(--border); margin-bottom: 16px; }
        .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
        .chart-title-input { flex: 1; min-width: 200px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-primary); color: var(--text-primary); font-size: 14px; font-weight: 600; }
        .chart-actions { display: flex; gap: 8px; }
        .btn { padding: 8px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-primary); cursor: pointer; font-size: 13px; color: var(--text-primary); transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: #1d1d1f; color: #fff; border: none; }
        .btn:hover { transform: translateY(-1px); }
        .chart-wrapper { position: relative; height: 420px; }
        .data-preview { background: var(--bg-card); border-radius: 16px; padding: 16px; border: 1px solid var(--border); margin-bottom: 16px; }
        .data-preview-title { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .data-table th, .data-table td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); }
        .data-table th { background: var(--bg-primary); font-weight: 600; color: var(--text-secondary); position: sticky; top: 0; }
        .data-table-wrap { max-height: 240px; overflow: auto; border-radius: 8px; }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
        .empty-state-icon { font-size: 56px; margin-bottom: 16px; }
        .color-picker { display: flex; gap: 6px; flex-wrap: wrap; }
        .color-dot { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; }
        .color-dot.active { border-color: var(--text-primary); transform: scale(1.15); }
        @media (max-width: 768px) {
            .header { padding: 20px 16px; padding-left: 60px; }
            .header h1 { font-size: 22px; }
            .container { padding: 0 14px; }
            .chart-wrapper { height: 300px; }
            .controls { grid-template-columns: 1fr; }
        }
    </style>
<link rel="stylesheet" href="/static/css/v5-glass.css?v={{ STATIC_VERSION }}">
<link rel="stylesheet" href="/static/css/ux-enhancements.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/de-ai.css?v={{ STATIC_VERSION }}"><link rel="stylesheet" href="/static/css/components.css?v={{ STATIC_VERSION }}">    <link rel="stylesheet" href="/static/css/mobile.css?v={{ STATIC_VERSION }}">

    <link rel="stylesheet" href="/static/css/design-system.css?v={{ STATIC_VERSION }}">
</head>
<body>
{% include '_navbar.html' %}

    <div class="container">
        <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
            <div class="upload-zone-icon">📈</div>
            <div class="upload-zone-text">点击或拖拽上传 Excel 文件</div>
            <div class="upload-zone-hint">支持 .xlsx / .xls / .csv，自动识别列名</div>
            <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleFile(this.files[0])">
        </div>
        <div id="fileInfo" style="display:none" class="file-info">
            <span id="fileName" class="file-info-name"></span>
            <span id="rowCount" style="font-size:12px;color:var(--text-secondary)"></span>
            <button class="file-info-btn" onclick="resetUpload()">重新上传</button>
        </div>
        <div id="builder" style="display:none">
            <div class="controls">
                <div class="control-group">
                    <label>X 轴（分类）</label>
                    <select id="xAxisSelect" onchange="renderChart()"></select>
                </div>
                <div class="control-group">
                    <label>Y 轴（数值）— 可多选</label>
                    <select id="yAxisSelect" multiple size="3" onchange="renderChart()" style="height:auto"></select>
                </div>
                <div class="control-group">
                    <label>图表类型</label>
                    <div class="chart-types">
                        <div class="chart-type-btn active" data-type="bar" onclick="setChartType('bar')">📊 柱状图</div>
                        <div class="chart-type-btn" data-type="line" onclick="setChartType('line')">📈 折线图</div>
                        <div class="chart-type-btn" data-type="pie" onclick="setChartType('pie')">🥧 饼图</div>
                    </div>
                </div>
                <div class="control-group">
                    <label>主题色</label>
                    <div class="color-picker" id="colorPicker"></div>
                </div>
            </div>
            <div class="chart-container">
                <div class="chart-header">
                    <input type="text" class="chart-title-input" id="chartTitle" placeholder="输入图表标题..." value="数据图表" oninput="renderChart()">
                    <div class="chart-actions">
                        <button class="btn btn-primary" onclick="exportImage()">💾 导出图片</button>
                        <button class="btn" onclick="exportCSV()">📋 导出 CSV</button>
                    </div>
                </div>
                <div class="chart-wrapper"><canvas id="mainChart"></canvas></div>
            </div>
            <div class="data-preview">
                <div class="data-preview-title">📋 数据预览（前 20 行）</div>
                <div class="data-table-wrap"><table class="data-table" id="dataTable"></table></div>
            </div>
        </div>
        <div id="emptyState" class="empty-state">
            <div class="empty-state-icon">📊</div>
            <p>上传 Excel 后选择坐标轴生成图表</p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
        let rawData = [], columns = [], chart = null, chartType = 'bar';
        const COLORS = ['#7c3aed','#10b981','#f59e0b','#ef4444','#0ea5e9','#8b5cf6','#ec4899','#14b8a6'];
        let selectedColor = COLORS[0];

        const uploadZone = document.getElementById('uploadZone');
        uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
        uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
        uploadZone.addEventListener('drop', e => { e.preventDefault(); uploadZone.classList.remove('dragover'); if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });

        function handleFile(file) {
            if (!file) return;
            document.getElementById('fileName').textContent = '📄 ' + file.name;
            const reader = new FileReader();
            reader.onload = e => {
                const wb = XLSX.read(e.target.result, {type:'array'});
                const ws = wb.Sheets[wb.SheetNames[0]];
                rawData = XLSX.utils.sheet_to_json(ws, {defval:''});
                if (!rawData.length) { alert('文件为空或格式不正确'); return; }
                columns = Object.keys(rawData[0]);
                document.getElementById('rowCount').textContent = rawData.length + ' 行 × ' + columns.length + ' 列';
                document.getElementById('fileInfo').style.display = 'flex';
                document.getElementById('emptyState').style.display = 'none';
                document.getElementById('builder').style.display = 'block';
                populateSelects();
                renderColorPicker();
                renderDataTable();
                renderChart();
            };
            reader.readAsArrayBuffer(file);
        }

        function populateSelects() {
            const xSel = document.getElementById('xAxisSelect');
            const ySel = document.getElementById('yAxisSelect');
            xSel.innerHTML = columns.map(c => `<option value="${c}">${c}</option>`).join('');
            ySel.innerHTML = columns.map(c => `<option value="${c}">${c}</option>`).join('');
            // 自动选择：第一列为 X，第二列为 Y
            if (columns.length > 0) xSel.value = columns[0];
            if (columns.length > 1) { ySel.value = columns[1]; ySel.selectedIndex = 1; }
        }

        function renderColorPicker() {
            document.getElementById('colorPicker').innerHTML = COLORS.map((c,i) =>
                `<div class="color-dot ${c===selectedColor?'active':''}" style="background:${c}" onclick="setColor('${c}')"></div>`
            ).join('');
        }

        function setColor(c) { selectedColor = c; renderColorPicker(); renderChart(); }

        function setChartType(type) {
            chartType = type;
            document.querySelectorAll('.chart-type-btn').forEach(b => b.classList.toggle('active', b.dataset.type === type));
            renderChart();
        }

        function renderChart() {
            const xKey = document.getElementById('xAxisSelect').value;
            const yOptions = Array.from(document.getElementById('yAxisSelect').selectedOptions).map(o => o.value);
            const yKeys = yOptions.length ? yOptions : [columns[1] || columns[0]];
            const title = document.getElementById('chartTitle').value || '数据图表';
            const labels = rawData.map(r => String(r[xKey]));

            const datasets = yKeys.map((key, i) => {
                const data = rawData.map(r => parseFloat(r[key]) || 0);
                const color = COLORS[i % COLORS.length];
                if (chartType === 'pie') {
                    return { label: key, data: data, backgroundColor: COLORS.slice(0, labels.length), borderWidth: 0 };
                }
                return {
                    label: key, data: data,
                    borderColor: color, backgroundColor: chartType === 'bar' ? color + 'cc' : color + '22',
                    fill: chartType === 'line', tension: 0.3, borderWidth: 2,
                    pointBackgroundColor: color, pointRadius: 3
                };
            });

            if (chart) chart.destroy();
            const ctx = document.getElementById('mainChart').getContext('2d');
            chart = new Chart(ctx, {
                type: chartType,
                data: { labels, datasets },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: {
                        title: { display: true, text: title, font: { size: 16, weight: '600' }, padding: { bottom: 16 } },
                        legend: { position: 'top' }
                    },
                    scales: chartType === 'pie' ? {} : {
                        y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        function renderDataTable() {
            const table = document.getElementById('dataTable');
            const preview = rawData.slice(0, 20);
            table.innerHTML = '<thead><tr>' + columns.map(c => `<th>${c}</th>`).join('') + '</tr></thead>' +
                '<tbody>' + preview.map(r => '<tr>' + columns.map(c => `<td>${r[c]}</td>`).join('') + '</tr>').join('') + '</tbody>';
        }

        function exportImage() {
            const canvas = document.getElementById('mainChart');
            const link = document.createElement('a');
            link.download = (document.getElementById('chartTitle').value || 'chart') + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function exportCSV() {
            const xKey = document.getElementById('xAxisSelect').value;
            const yKeys = Array.from(document.getElementById('yAxisSelect').selectedOptions).map(o => o.value);
            const keys = [xKey, ...(yKeys.length ? yKeys : [columns[1]])];
            const csv = [keys.join(','), ...rawData.map(r => keys.map(k => `"${r[k]}"`).join(','))].join('\n');
            const blob = new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = (document.getElementById('chartTitle').value || 'data') + '.csv';
            a.click(); URL.revokeObjectURL(url);
        }

        function resetUpload() {
            rawData = []; columns = [];
            if (chart) { chart.destroy(); chart = null; }
            document.getElementById('fileInfo').style.display = 'none';
            document.getElementById('builder').style.display = 'none';
            document.getElementById('emptyState').style.display = 'block';
            document.getElementById('fileInput').value = '';
        }
    </script>
<script src="/static/js/v5-ux.js?v={{ STATIC_VERSION }}"></script>
<script src="/static/js/v5-sync.js?v={{ STATIC_VERSION }}"></script>
<script src="/static/js/components.js?v={{ STATIC_VERSION }}"></script>
<script src="/static/js/ux-enhancements.js?v={{ STATIC_VERSION }}"></script>
</body>
</html>
