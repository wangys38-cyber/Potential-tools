<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 工具集</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%231d1d1f%22 stroke-width=%222%22><rect x=%223%22 y=%223%22 width=%2218%22 height=%2218%22 rx=%222%22/><path d=%22M9 9h6v6H9z%22/></svg>">
    <link rel="stylesheet" href="/static/css/theme.css?v={{ STATIC_VERSION }}">
    
<link rel="stylesheet" href="/static/css/page/login.css?v={{ STATIC_VERSION }}">
</head>
<body>
    <div id="toast" class="toast"></div>

    <div class="logo-area">
        <div class="logo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <path d="M9 9h6v6H9z"/>
            </svg>
        </div>
        <h1>工具集</h1>
        <p class="subtitle">登录以保存你的分析记录和设置</p>
    </div>

    <div class="auth-card">
        <!-- 登录表单 -->
        <div id="login-form">
            <div class="form-title">账号登录</div>
            <div class="form-group">
                <label for="login-username">用户名 / 邮箱</label>
                <div class="input-wrap">
                    <input type="text" id="login-username" placeholder="请输入用户名或邮箱" autocomplete="username">
                </div>
            </div>
            <div class="form-group">
                <label for="login-password">密码</label>
                <div class="input-wrap">
                    <input type="password" id="login-password" placeholder="请输入密码" autocomplete="current-password">
                    <button type="button" class="toggle-pw" onclick="togglePassword('login-password', this)" aria-label="显示密码">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            <div class="form-options">
                <label class="checkbox-wrap">
                    <input type="checkbox" id="login-remember"> 记住我（7天）
                </label>
            </div>
            <button type="button" class="btn-primary" id="login-submit" onclick="doLogin()">登录</button>
            <div class="switch-link">
                没有账号？<a onclick="showRegister()">立即注册</a>
            </div>
        </div>

        <!-- 注册表单 -->
        <div id="register-form" class="form-hidden">
            <div class="form-title">创建账号</div>
            <div class="form-group">
                <label for="reg-username">用户名</label>
                <div class="input-wrap">
                    <input type="text" id="reg-username" placeholder="设置用户名" autocomplete="username">
                </div>
            </div>
            <div class="form-group">
                <label for="reg-email">邮箱（可选）</label>
                <div class="input-wrap">
                    <input type="email" id="reg-email" placeholder="用于找回密码" autocomplete="email">
                </div>
            </div>
            <div class="form-group">
                <label for="reg-password">密码</label>
                <div class="input-wrap">
                    <input type="password" id="reg-password" placeholder="至少 8 位，含字母和数字" autocomplete="new-password" oninput="checkPasswordStrength()">
                    <button type="button" class="toggle-pw" onclick="togglePassword('reg-password', this)" aria-label="显示密码">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
                <div class="pw-strength">
                    <div class="pw-bar" id="pw-bar-1"></div>
                    <div class="pw-bar" id="pw-bar-2"></div>
                    <div class="pw-bar" id="pw-bar-3"></div>
                </div>
                <div class="pw-label" id="pw-label">密码强度：未输入</div>
            </div>
            <div class="form-group">
                <label for="reg-confirm">确认密码</label>
                <div class="input-wrap">
                    <input type="password" id="reg-confirm" placeholder="再次输入密码" autocomplete="new-password">
                    <button type="button" class="toggle-pw" onclick="togglePassword('reg-confirm', this)" aria-label="显示密码">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            <div class="privacy-agree">
                <label class="checkbox-wrap">
                    <input type="checkbox" id="reg-agree"> 我已阅读并同意 <a href="/privacy" target="_blank">隐私政策</a>
                </label>
            </div>
            <button type="button" class="btn-primary" id="register-submit" onclick="doRegister()">注册</button>
            <div class="switch-link">
                已有账号？<a onclick="showLogin()">返回登录</a>
            </div>
        </div>

        <div class="divider">其他方式</div>

        {% if wechat_configured %}
        <a href="/auth/wechat" class="btn-wechat">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.047c.134 0 .24-.111.24-.247 0-.06-.023-.12-.038-.177l-.327-1.233a.582.582 0 0 1-.023-.156.49.49 0 0 1 .201-.398C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-6.656-6.088V8.89c-.135-.01-.27-.027-.407-.03zm-2.53 3.274c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982zm4.844 0c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.969-.982z"/></svg>
            微信登录
        </a>
        {% else %}
        <div class="btn-wechat-disabled">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.047c.134 0 .24-.111.24-.247 0-.06-.023-.12-.038-.177l-.327-1.233a.582.582 0 0 1-.023-.156.49.49 0 0 1 .201-.398C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-6.656-6.088V8.89c-.135-.01-.27-.027-.407-.03zm-2.53 3.274c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982zm4.844 0c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.969-.982z"/></svg>
            微信登录（未配置）
        </div>
        {% endif %}

        {% if allow_guest %}
        <div style="margin-top:12px;">
            <a href="/" class="btn-guest">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
                游客访问
            </a>
        </div>
        {% endif %}
    </div>

    <div class="login-footer">
        登录后可保存分析记录和个人设置<br>
        游客模式下数据仅保存在本地<br>
        <a href="/privacy" style="color:#0071e3;text-decoration:none;">隐私政策</a>
    </div>

    <script src="/static/js/login.js?v={{ STATIC_VERSION }}"></script>
</body>
</html>
