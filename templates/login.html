<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 工具集</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%231d1d1f%22 stroke-width=%222%22><rect x=%223%22 y=%223%22 width=%2218%22 height=%2218%22 rx=%222%22/><path d=%22M9 9h6v6H9z%22/></svg>">
    <link rel="stylesheet" href="/static/css/theme.css?v={{ STATIC_VERSION }}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            color: #1d1d1f;
        }

        .logo-area {
            margin-bottom: 32px;
            text-align: center;
        }
        .logo-icon {
            width: 64px; height: 64px;
            border-radius: 16px;
            background: #1d1d1f;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        .logo-icon svg { width: 32px; height: 32px; stroke: #fff; }
        .logo-area h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }
        .logo-area .subtitle {
            font-size: 14px;
            color: #86868b;
        }

        .auth-card {
            background: #fff;
            border-radius: 16px;
            padding: 32px 28px;
            width: 380px;
            max-width: 90vw;
            border: 1px solid rgba(0,0,0,0.08);
        }

        .form-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #1d1d1f;
            margin-bottom: 6px;
        }
        .input-wrap {
            position: relative;
        }
        .input-wrap input {
            width: 100%;
            padding: 11px 40px 11px 14px;
            border: 1px solid rgba(0,0,0,0.12);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            background: #fff;
            color: #1d1d1f;
            outline: none;
            transition: border-color 0.15s;
        }
        .input-wrap input:focus {
            border-color: #1d1d1f;
        }
        .input-wrap input::placeholder { color: #c7c7cc; }
        .toggle-pw {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .toggle-pw svg { width: 18px; height: 18px; stroke: #86868b; }

        .btn-primary {
            width: 100%;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            background: #000;
            color: #fff;
            font-family: inherit;
            transition: opacity 0.15s;
            margin-top: 4px;
        }
        .btn-primary:hover { opacity: 0.85; }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-wechat {
            width: 100%;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            border: 1px solid rgba(0,0,0,0.12);
            cursor: pointer;
            background: #f5f5f7;
            color: #86868b;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.15s;
        }
        .btn-wechat:hover { background: #ebebed; }
        .btn-wechat svg { width: 20px; height: 20px; stroke: #86868b; }

        .btn-guest {
            width: 100%;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            border: 1px solid rgba(0,0,0,0.12);
            cursor: pointer;
            background: #fff;
            color: #1d1d1f;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            transition: background 0.15s;
        }
        .btn-guest:hover { background: #f5f5f7; }
        .btn-guest svg { width: 20px; height: 20px; }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: #c7c7cc;
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(0,0,0,0.08);
        }

        .switch-link {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: #86868b;
        }
        .switch-link a {
            color: #0071e3;
            text-decoration: none;
            cursor: pointer;
        }
        .switch-link a:hover { text-decoration: underline; }

        .form-hidden { display: none; }

        /* Toast */
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: #1d1d1f;
            color: #fff;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.25s ease;
            z-index: 9999;
            pointer-events: none;
            max-width: 90vw;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.error { background: #ff3b30; }

        .login-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: #86868b;
            line-height: 1.6;
        }

        @media (max-width: 400px) {
            .auth-card { padding: 24px 20px; }
        }
    </style>
</head>
<body>
    <div id="toast" class="toast"></div>

    <div class="logo-area">
        <div class="logo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <path d="M9 9h6v6H9z"/>
            </svg>
        </div>
        <h1>工具集</h1>
        <p class="subtitle">登录以保存你的分析记录和设置</p>
    </div>

    <div class="auth-card">
        <!-- 登录表单 -->
        <div id="login-form">
            <div class="form-title">账号登录</div>
            <div class="form-group">
                <label for="login-username">用户名 / 邮箱</label>
                <div class="input-wrap">
                    <input type="text" id="login-username" placeholder="请输入用户名或邮箱" autocomplete="username">
                </div>
            </div>
            <div class="form-group">
                <label for="login-password">密码</label>
                <div class="input-wrap">
                    <input type="password" id="login-password" placeholder="请输入密码" autocomplete="current-password">
                    <button type="button" class="toggle-pw" onclick="togglePassword('login-password', this)" aria-label="显示密码">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            <button type="button" class="btn-primary" id="login-submit" onclick="doLogin()">登录</button>
            <div class="switch-link">
                没有账号？<a onclick="showRegister()">立即注册</a>
            </div>
        </div>

        <!-- 注册表单 -->
        <div id="register-form" class="form-hidden">
            <div class="form-title">创建账号</div>
            <div class="form-group">
                <label for="reg-username">用户名</label>
                <div class="input-wrap">
                    <input type="text" id="reg-username" placeholder="设置用户名" autocomplete="username">
                </div>
            </div>
            <div class="form-group">
                <label for="reg-email">邮箱（可选）</label>
                <div class="input-wrap">
                    <input type="email" id="reg-email" placeholder="用于找回密码" autocomplete="email">
                </div>
            </div>
            <div class="form-group">
                <label for="reg-password">密码</label>
                <div class="input-wrap">
                    <input type="password" id="reg-password" placeholder="至少 6 位" autocomplete="new-password">
                    <button type="button" class="toggle-pw" onclick="togglePassword('reg-password', this)" aria-label="显示密码">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label for="reg-confirm">确认密码</label>
                <div class="input-wrap">
                    <input type="password" id="reg-confirm" placeholder="再次输入密码" autocomplete="new-password">
                    <button type="button" class="toggle-pw" onclick="togglePassword('reg-confirm', this)" aria-label="显示密码">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            <button type="button" class="btn-primary" id="register-submit" onclick="doRegister()">注册</button>
            <div class="switch-link">
                已有账号？<a onclick="showLogin()">返回登录</a>
            </div>
        </div>

        <div class="divider">其他方式</div>

        <button type="button" class="btn-wechat" onclick="showToast('微信登录即将上线', 'error')">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
            </svg>
            微信登录
        </button>

        {% if allow_guest %}
        <div style="margin-top:12px;">
            <a href="/" class="btn-guest">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
                游客访问
            </a>
        </div>
        {% endif %}
    </div>

    <div class="login-footer">
        登录后可保存分析记录和个人设置<br>
        游客模式下数据仅保存在本地
    </div>

    <script src="/static/js/login.js?v={{ STATIC_VERSION }}"></script>
</body>
</html>
