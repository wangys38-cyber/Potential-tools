<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 关系图谱 - Three.js</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0f; 
            overflow: hidden;
            color: #fff;
        }
        #canvas-container { width: 100vw; height: 100vh; }
        .panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 21, 22, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            min-width: 260px;
        }
        .panel h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #f7f8f8;
        }
        .panel p {
            font-size: 13px;
            color: #8a8f98;
            line-height: 1.6;
            margin-bottom: 12px;
        }
        .legend {
            margin-top: 12px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            font-size: 12px;
            color: #d0d6e0;
        }
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .tooltip {
            position: absolute;
            background: rgba(20, 21, 22, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(94, 106, 210, 0.5);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            pointer-events: none;
            display: none;
            z-index: 100;
            max-width: 200px;
        }
        .tooltip-title {
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }
        .tooltip-desc {
            color: #8a8f98;
            font-size: 11px;
            line-height: 1.4;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(20, 21, 22, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px 16px;
        }
        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #d0d6e0;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn:hover {
            background: rgba(94, 106, 210, 0.2);
            border-color: rgba(94, 106, 210, 0.5);
            color: #fff;
        }
        .btn.primary {
            background: #5e6ad2;
            border-color: #5e6ad2;
            color: #fff;
        }
        .btn.primary:hover {
            background: #828fff;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="tooltip" id="tooltip"></div>
    
    <div class="panel">
        <h2>3D 关系图谱</h2>
        <p>鼠标拖拽旋转，滚轮缩放，悬停节点查看详情</p>
        <div class="legend">
            <div class="legend-item">
                <div class="legend-dot" style="background: #5e6ad2;"></div>
                <span>核心工具</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot" style="background: #8b5cf6;"></div>
                <span>数据分析</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot" style="background: #ec4899;"></div>
                <span>AI 助手</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot" style="background: #10b981;"></div>
                <span>效率工具</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot" style="background: #06b6d4;"></div>
                <span>知识管理</span>
            </div>
        </div>
    </div>
    
    <div class="controls">
        <button class="btn" onclick="toggleRotation()">暂停旋转</button>
        <button class="btn" onclick="toggleLabels()">显示标签</button>
        <button class="btn primary" onclick="resetView()">重置视角</button>
    </div>

    <script src="/static/js/vendor/three/three.min.js"></script>
    <script>
        // ========== 基础设置 ==========
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0f);
        scene.fog = new THREE.Fog(0x0a0a0f, 15, 40);

        const camera = new THREE.PerspectiveCamera(
            60, window.innerWidth / window.innerHeight, 0.1, 1000
        );
        camera.position.set(8, 6, 8);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // ========== 灯光 ==========
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        
        const pointLight = new THREE.PointLight(0xffffff, 1);
        pointLight.position.set(10, 10, 10);
        scene.add(pointLight);

        // ========== 图谱数据 ==========
        const nodes = [
            { id: 'kb', label: '智能知识库', category: 'core', desc: '企业级智能知识库，支持智能问答与检索' },
            { id: 'cr', label: 'CR 分析', category: 'data', desc: 'CR 智能分析与根因定位' },
            { id: 'mail', label: '邮件助手', category: 'ai', desc: 'AI 驱动的邮件起草与智能发送' },
            { id: 'note', label: '牛马笔记', category: 'efficiency', desc: '高效项目笔记，自动生成日报' },
            { id: 'graph', label: '知识图谱', category: 'knowledge', desc: '研发知识图谱，智能关联与推荐' },
            { id: 'agent', label: 'AI Agent', category: 'ai', desc: '智能代理，自动执行复杂任务' },
            { id: 'excel', label: 'Excel 分析', category: 'data', desc: 'Excel 数据分析与可视化' },
            { id: 'trend', label: '趋势分析', category: 'data', desc: '数据趋势分析与预测' },
            { id: 'pdf', label: 'PDF 工具', category: 'efficiency', desc: 'PDF 转换、合并、编辑工具' },
            { id: 'meeting', label: '会议纪要', category: 'efficiency', desc: '自动生成会议纪要与行动项' },
            { id: 'search', label: '智能搜索', category: 'knowledge', desc: '跨文档智能搜索与关联' },
            { id: 'qa', label: '智能问答', category: 'ai', desc: '基于知识库的智能问答系统' },
        ];

        const edges = [
            { source: 'kb', target: 'cr' },
            { source: 'kb', target: 'mail' },
            { source: 'kb', target: 'note' },
            { source: 'kb', target: 'graph' },
            { source: 'kb', target: 'agent' },
            { source: 'kb', target: 'qa' },
            { source: 'cr', target: 'excel' },
            { source: 'cr', target: 'trend' },
            { source: 'mail', target: 'agent' },
            { source: 'note', target: 'meeting' },
            { source: 'note', target: 'pdf' },
            { source: 'graph', target: 'search' },
            { source: 'agent', target: 'qa' },
            { source: 'excel', target: 'trend' },
            { source: 'search', target: 'qa' },
        ];

        const categoryColors = {
            core: 0x5e6ad2,
            data: 0x8b5cf6,
            ai: 0xec4899,
            efficiency: 0x10b981,
            knowledge: 0x06b6d4
        };

        // ========== 创建节点 ==========
        const nodeGroup = new THREE.Group();
        const nodeMeshes = [];
        const labelSprites = [];

        nodes.forEach((node, i) => {
            // 球体
            const isCore = node.category === 'core';
            const radius = isCore ? 0.6 : 0.4;
            const geometry = new THREE.SphereGeometry(radius, 32, 32);
            const material = new THREE.MeshPhongMaterial({
                color: categoryColors[node.category],
                emissive: categoryColors[node.category],
                emissiveIntensity: 0.2,
                shininess: 100
            });
            const sphere = new THREE.Mesh(geometry, material);

            // 球面分布
            const phi = Math.acos(-1 + (2 * i) / nodes.length);
            const theta = Math.sqrt(nodes.length * Math.PI) * phi;
            const radius_dist = isCore ? 0 : 4;
            sphere.position.set(
                radius_dist * Math.cos(theta) * Math.sin(phi),
                radius_dist * Math.sin(theta) * Math.sin(phi),
                radius_dist * Math.cos(phi)
            );

            sphere.userData = node;
            nodeGroup.add(sphere);
            nodeMeshes.push(sphere);

            // 标签
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(20, 21, 22, 0.9)';
            ctx.roundRect(0, 0, 256, 64, 12);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 24px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(node.label, 128, 32);

            const texture = new THREE.CanvasTexture(canvas);
            const labelMaterial = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                opacity: 0
            });
            const label = new THREE.Sprite(labelMaterial);
            label.position.copy(sphere.position);
            label.position.y += 1;
            label.scale.set(2, 0.5, 1);
            nodeGroup.add(label);
            labelSprites.push(label);
        });
        scene.add(nodeGroup);

        // ========== 创建边 ==========
        const edgeGroup = new THREE.Group();
        edges.forEach(edge => {
            const sourceMesh = nodeMeshes.find(n => n.userData.id === edge.source);
            const targetMesh = nodeMeshes.find(n => n.userData.id === edge.target);
            
            const points = [sourceMesh.position.clone(), targetMesh.position.clone()];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({
                color: 0x444466,
                transparent: true,
                opacity: 0.4
            });
            const line = new THREE.Line(geometry, material);
            edgeGroup.add(line);
        });
        scene.add(edgeGroup);

        // ========== 鼠标交互 ==========
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const tooltip = document.getElementById('tooltip');
        let isRotating = true;
        let showLabels = false;

        renderer.domElement.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(nodeMeshes);

            if (intersects.length > 0) {
                const node = intersects[0].object.userData;
                tooltip.style.display = 'block';
                tooltip.style.left = event.clientX + 15 + 'px';
                tooltip.style.top = event.clientY + 15 + 'px';
                tooltip.innerHTML = `
                    <div class="tooltip-title">${node.label}</div>
                    <div class="tooltip-desc">${node.desc}</div>
                `;
                document.body.style.cursor = 'pointer';
            } else {
                tooltip.style.display = 'none';
                document.body.style.cursor = 'default';
            }
        });

        // 简单的旋转控制
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        renderer.domElement.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        renderer.domElement.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;
            nodeGroup.rotation.y += deltaX * 0.01;
            nodeGroup.rotation.x += deltaY * 0.01;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        renderer.domElement.addEventListener('mouseup', () => isDragging = false);
        renderer.domElement.addEventListener('wheel', (e) => {
            camera.position.z += e.deltaY * 0.01;
        });

        // ========== 控制函数 ==========
        function toggleRotation() {
            isRotating = !isRotating;
            event.target.textContent = isRotating ? '暂停旋转' : '开始旋转';
        }

        function toggleLabels() {
            showLabels = !showLabels;
            labelSprites.forEach(label => {
                label.material.opacity = showLabels ? 1 : 0;
            });
            event.target.textContent = showLabels ? '隐藏标签' : '显示标签';
        }

        function resetView() {
            camera.position.set(8, 6, 8);
            camera.lookAt(0, 0, 0);
            nodeGroup.rotation.set(0, 0, 0);
        }

        // ========== 动画循环 ==========
        function animate() {
            requestAnimationFrame(animate);
            if (isRotating) {
                nodeGroup.rotation.y += 0.003;
            }
            renderer.render(scene, camera);
        }
        animate();

        // ========== 响应式 ==========
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
