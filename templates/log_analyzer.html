<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日志分析器</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
    <link rel="stylesheet" href="/static/css/theme.css?v={{ STATIC_VERSION }}">
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg-primary); min-height: 100vh; color: var(--text-primary); }
        .header { background: rgba(255,255,255,0.72); backdrop-filter: blur(20px); padding: 24px 30px; border-bottom: 1px solid var(--border); position: relative; }
        .header h1 { font-size: 28px; font-weight: 600; background: linear-gradient(135deg,#4f46e5,#7c3aed,#c026d3); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .header p { color: var(--text-secondary); margin-top: 4px; font-size: 14px; }
        .back-btn { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-card); cursor: pointer; font-size: 14px; color: var(--text-primary); text-decoration: none; }
        .container { max-width: 1200px; margin: 24px auto; padding: 0 20px; }
        .upload-zone { border: 2px dashed var(--border-strong); border-radius: 16px; padding: 40px; text-align: center; cursor: pointer; transition: all 0.3s; background: var(--bg-card); margin-bottom: 20px; }
        .upload-zone:hover, .upload-zone.dragover { border-color: #7c3aed; background: rgba(124,58,237,0.05); }
        .upload-zone-icon { font-size: 48px; margin-bottom: 12px; }
        .upload-zone-text { font-size: 16px; }
        .upload-zone-hint { font-size: 13px; color: var(--text-secondary); margin-top: 6px; }
        .file-info { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--bg-card); border-radius: 12px; margin-bottom: 16px; border: 1px solid var(--border); }
        .file-info-name { flex: 1; font-size: 14px; font-weight: 500; }
        .file-info-btn { padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-primary); cursor: pointer; font-size: 13px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat-card { background: var(--bg-card); border-radius: 12px; padding: 16px; border: 1px solid var(--border); text-align: center; }
        .stat-icon { font-size: 24px; margin-bottom: 6px; }
        .stat-value { font-size: 24px; font-weight: 700; }
        .stat-label { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
        .stat-card.crash .stat-value { color: #ef4444; }
        .stat-card.reboot .stat-value { color: #f59e0b; }
        .stat-card.memory .stat-value { color: #8b5cf6; }
        .stat-card.power .stat-value { color: #0ea5e9; }
        .stat-card.error .stat-value { color: #f97316; }
        .filters { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
        .filter-btn { padding: 8px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-card); cursor: pointer; font-size: 13px; transition: all 0.2s; }
        .filter-btn.active { background: linear-gradient(135deg,#4f46e5,#7c3aed); color: #fff; border-color: transparent; }
        .search-box { flex: 1; min-width: 200px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-primary); font-size: 13px; }
        .log-panel { background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; }
        .log-header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .log-title { font-size: 14px; font-weight: 600; }
        .log-count { font-size: 12px; color: var(--text-secondary); }
        .log-content { max-height: 500px; overflow-y: auto; padding: 12px 20px; font-family: 'SF Mono', Consolas, monospace; font-size: 12px; line-height: 1.7; }
        .log-line { padding: 4px 8px; border-radius: 4px; margin-bottom: 2px; white-space: pre-wrap; word-break: break-all; }
        .log-line.crash { background: rgba(239,68,68,0.1); border-left: 3px solid #ef4444; }
        .log-line.reboot { background: rgba(245,158,11,0.1); border-left: 3px solid #f59e0b; }
        .log-line.memory { background: rgba(139,92,246,0.1); border-left: 3px solid #8b5cf6; }
        .log-line.power { background: rgba(14,165,233,0.1); border-left: 3px solid #0ea5e9; }
        .log-line.error { background: rgba(249,115,22,0.1); border-left: 3px solid #f97316; }
        .log-line.warning { background: rgba(234,179,8,0.08); border-left: 3px solid #eab308; }
        .log-tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; margin-right: 6px; color: #fff; }
        .log-tag.crash { background: #ef4444; }
        .log-tag.reboot { background: #f59e0b; }
        .log-tag.memory { background: #8b5cf6; }
        .log-tag.power { background: #0ea5e9; }
        .log-tag.error { background: #f97316; }
        .log-tag.warning { background: #eab308; color: #000; }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
        .empty-state-icon { font-size: 56px; margin-bottom: 16px; }
        .timeline { background: var(--bg-card); border-radius: 16px; padding: 20px; border: 1px solid var(--border); margin-bottom: 16px; }
        .timeline-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
        .timeline-bar { display: flex; height: 24px; border-radius: 6px; overflow: hidden; background: var(--border); }
        .timeline-seg { height: 100%; transition: width 0.3s; }
        @media (max-width: 768px) {
            .header { padding: 20px 16px; padding-left: 60px; }
            .header h1 { font-size: 22px; }
            .container { padding: 0 14px; }
            .stats-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
<link rel="stylesheet" href="/static/css/v5-glass.css?v={{ STATIC_VERSION }}">
<link rel="stylesheet" href="/static/css/ux-enhancements.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/de-ai.css?v={{ STATIC_VERSION }}"><link rel="stylesheet" href="/static/css/components.css?v={{ STATIC_VERSION }}">    <link rel="stylesheet" href="/static/css/mobile.css?v={{ STATIC_VERSION }}">

</head>
<body>
{% include '_navbar.html' %}

    <div class="container">
        <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
            <div class="upload-zone-icon">📄</div>
            <div class="upload-zone-text">点击或拖拽上传日志文件</div>
            <div class="upload-zone-hint">支持 .log / .txt / .zip（自动解压zip中的日志文件），自动识别死机、重启、内存、功耗、错误等异常</div>
            <input type="file" id="fileInput" accept=".log,.txt,.zip" style="display:none" onchange="handleFile(this.files[0])">
        </div>
        <div style="text-align:center;margin:12px 0;color:var(--text-secondary);font-size:13px;">或</div>
        <div class="paste-section" style="background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px;">
            <div style="font-size:14px;font-weight:600;margin-bottom:10px;">📋 粘贴日志内容</div>
            <textarea id="pasteArea" style="width:100%;min-height:120px;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--bg-secondary);color:var(--text-primary);font-family:monospace;font-size:12px;resize:vertical;" placeholder="在此粘贴设备日志内容，支持多行..."></textarea>
            <div style="margin-top:10px;display:flex;gap:8px;">
                <button class="action-btn" onclick="analyzePastedLog()" style="flex:1;">🔍 分析粘贴内容</button>
                <button class="action-btn" onclick="document.getElementById('pasteArea').value=''" style="flex:0 0 auto;">清空</button>
            </div>
        </div>
        <div id="fileInfo" style="display:none" class="file-info">
            <span id="fileName" class="file-info-name"></span>
            <span id="fileSize" style="font-size:12px;color:var(--text-secondary)"></span>
            <button class="file-info-btn" onclick="resetUpload()">重新上传</button>
        </div>
        <div id="analysis" style="display:none">
            <div class="stats-grid" id="statsGrid"></div>
            <div class="conclusion-panel" id="conclusionPanel" style="display:none;background:linear-gradient(135deg,#f8f9ff,#fff);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px;">
                <h3 style="font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;">📋 分析结论</h3>
                <div id="conclusionContent" style="font-size:14px;line-height:1.8;color:var(--text-primary);"></div>
            </div>
            <div class="timeline">
                <div class="timeline-title">异常类型分布</div>
                <div class="timeline-bar" id="timelineBar"></div>
            </div>
            <div class="filters">
                <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">全部</button>
                <button class="filter-btn" data-filter="crash" onclick="setFilter('crash')">💥 死机</button>
                <button class="filter-btn" data-filter="reboot" onclick="setFilter('reboot')">🔄 重启</button>
                <button class="filter-btn" data-filter="memory" onclick="setFilter('memory')">💾 内存</button>
                <button class="filter-btn" data-filter="power" onclick="setFilter('power')">🔋 功耗</button>
                <button class="filter-btn" data-filter="error" onclick="setFilter('error')">❌ 错误</button>
                <button class="filter-btn" data-filter="warning" onclick="setFilter('warning')">⚠️ 警告</button>
                <input type="text" class="search-box" id="searchBox" placeholder="搜索日志内容..." oninput="renderLogs()">
            </div>
            <div class="log-panel">
                <div class="log-header">
                    <span class="log-title">异常日志</span>
                    <span class="log-count" id="logCount"></span>
                    <button class="action-btn" style="padding:4px 12px;font-size:12px;margin-left:auto;" onclick="exportLogs()">📥 导出</button>
                </div>
                <div class="log-content" id="logContent"></div>
            </div>
        </div>
        <div id="emptyState" class="empty-state">
            <div class="empty-state-icon">🔍</div>
            <p>上传设备日志后自动分析异常</p>
        </div>
    </div>
    <script>
        let allLogs = [], currentFilter = 'all';
        const PATTERNS = {
            crash: {regex: /(panic|fatal|kernel\s*panic|watchdog|hardfault|busfault|memfault|死机|crash|abort)/i, label: '死机', icon: '💥'},
            reboot: {regex: /(reboot|restart|reset|warm\s*boot|cold\s*boot|shutdown|power\s*on|重启)/i, label: '重启', icon: '🔄'},
            memory: {regex: /(memory\s*leak|out\s*of\s*memory|oom|heap\s*overflow|stack\s*overflow|malloc\s*fail|内存|泄漏)/i, label: '内存', icon: '💾'},
            power: {regex: /(power\s*consumption|battery\s*drain|low\s*battery|sleep\s*current|battery\s*level|battery\s*percentage|battery\s*capacity|battery\s*voltage|battery\s*current|charging|discharging|charge\s*level|power\s*management|pmic|功耗|掉电|漏电|电流异常|电量|耗电|电池|充电|放电|电流|电压|续航|掉电快|耗电快|电量低|电池电量)/i, label: '功耗', icon: '🔋'},
            error: {regex: /(\berror\b|exception|assert|fail|failed|fault|错误|异常)/i, label: '错误', icon: '❌'},
            warning: {regex: /(\bwarn\b|warning|deprecated|注意|警告)/i, label: '警告', icon: '⚠️'},
        };

        const uploadZone = document.getElementById('uploadZone');
        uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
        uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
        uploadZone.addEventListener('drop', e => { e.preventDefault(); uploadZone.classList.remove('dragover'); if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });

        async function handleFile(file) {
            if (!file) return;
            document.getElementById('fileName').textContent = '📄 ' + file.name;
            document.getElementById('fileSize').textContent = (file.size/1024).toFixed(1) + ' KB';
            document.getElementById('fileInfo').style.display = 'flex';

            const isZip = file.name.toLowerCase().endsWith('.zip') || file.type === 'application/zip' || file.type === 'application/x-zip-compressed';

            if (isZip) {
                if (typeof JSZip === 'undefined') {
                    alert('JSZip库未加载，请刷新页面重试');
                    return;
                }
                try {
                    document.getElementById('fileName').textContent = '📦 ' + file.name + ' (解压中...)';
                    const zip = await JSZip.loadAsync(file);
                    const logFiles = [];
                    zip.forEach((relativePath, zipEntry) => {
                        if (!zipEntry.dir && /\.(log|txt|text)$/i.test(relativePath)) {
                            logFiles.push({ path: relativePath, entry: zipEntry });
                        }
                    });
                    if (logFiles.length === 0) {
                        alert('ZIP文件中未找到 .log 或 .txt 文件');
                        return;
                    }
                    let allContent = '';
                    for (const lf of logFiles) {
                        const content = await lf.entry.async('string');
                        allContent += `\n===== ${lf.path} =====\n` + content + '\n';
                    }
                    document.getElementById('fileName').textContent = '📦 ' + file.name + ` (${logFiles.length}个日志文件)`;
                    analyzeLog(allContent);
                } catch (e) {
                    alert('ZIP解压失败: ' + e.message);
                }
            } else {
                const reader = new FileReader();
                reader.onload = e => analyzeLog(e.target.result);
                reader.readAsText(file);
            }
        }

        function analyzeLog(text) {
            const lines = text.split(/\r?\n/);
            allLogs = [];
            const totalLines = lines.length;
            // 大文件提示
            if (totalLines > 50000) {
                if (!confirm(`日志文件较大（${totalLines}行），分析可能需要较长时间。是否继续？`)) {
                    resetUpload();
                    return;
                }
            }
            // 显示进度
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('analysis').style.display = 'block';
            const progressDiv = document.createElement('div');
            progressDiv.id = 'analyzeProgress';
            progressDiv.style.cssText = 'text-align:center;padding:40px;color:var(--text-secondary);';
            progressDiv.innerHTML = `<div style="font-size:16px;margin-bottom:12px;">⏳ 正在分析日志...</div><div style="font-size:13px;">已处理 0 / ${totalLines} 行</div><div style="width:60%;margin:16px auto;height:6px;background:var(--bg-secondary);border-radius:3px;overflow:hidden;"><div id="progressBar" style="height:100%;width:0%;background:linear-gradient(90deg,#667eea,#764ba2);transition:width 0.2s;"></div></div>`;
            document.getElementById('logContent').innerHTML = '';
            document.getElementById('logContent').appendChild(progressDiv);

            // 分批处理，每批2000行，避免阻塞UI
            const BATCH_SIZE = 2000;
            let idx = 0;
            const patternList = Object.entries(PATTERNS);

            function processBatch() {
                const end = Math.min(idx + BATCH_SIZE, totalLines);
                for (; idx < end; idx++) {
                    const line = lines[idx];
                    if (!line || !line.trim()) continue;
                    for (const [type, pat] of patternList) {
                        if (pat.regex.test(line)) {
                            allLogs.push({line: idx+1, text: line.trim(), type: type, label: pat.label, icon: pat.icon});
                            break;
                        }
                    }
                }
                // 更新进度
                const bar = document.getElementById('progressBar');
                if (bar) bar.style.width = (idx / totalLines * 100) + '%';
                const progressText = progressDiv.querySelector('div:nth-child(2)');
                if (progressText) progressText.textContent = `已处理 ${idx} / ${totalLines} 行（发现 ${allLogs.length} 条异常）`;

                if (idx < totalLines) {
                    // 让出主线程，避免卡顿
                    setTimeout(processBatch, 0);
                } else {
                    // 分析完成
                    progressDiv.remove();
                    renderStats();
                    renderTimeline();
                    renderLogs();
                    generateConclusion();
                }
            }
            processBatch();
        }

        function renderStats() {
            const counts = {};
            Object.keys(PATTERNS).forEach(t => counts[t] = 0);
            allLogs.forEach(l => counts[l.type]++);
            const total = allLogs.length;
            document.getElementById('statsGrid').innerHTML =
                `<div class="stat-card"><div class="stat-icon">📊</div><div class="stat-value">${total}</div><div class="stat-label">异常总数</div></div>` +
                Object.entries(PATTERNS).map(([t,p]) =>
                    `<div class="stat-card ${t}"><div class="stat-icon">${p.icon}</div><div class="stat-value">${counts[t]}</div><div class="stat-label">${p.label}</div></div>`
                ).join('');
        }

        function renderTimeline() {
            const counts = {};
            Object.keys(PATTERNS).forEach(t => counts[t] = 0);
            allLogs.forEach(l => counts[l.type]++);
            const total = allLogs.length || 1;
            const colors = {crash:'#ef4444', reboot:'#f59e0b', memory:'#8b5cf6', power:'#0ea5e9', error:'#f97316', warning:'#eab308'};
            document.getElementById('timelineBar').innerHTML = Object.entries(counts)
                .filter(([_,c]) => c > 0)
                .map(([t,c]) => `<div class="timeline-seg" style="width:${c/total*100}%;background:${colors[t]}" title="${PATTERNS[t].label}: ${c}"></div>`).join('');
        }

        function setFilter(f) {
            currentFilter = f;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
            renderLogs();
        }

        function renderLogs() {
            const search = document.getElementById('searchBox').value.toLowerCase();
            let filtered = allLogs;
            if (currentFilter !== 'all') filtered = filtered.filter(l => l.type === currentFilter);
            if (search) filtered = filtered.filter(l => l.text.toLowerCase().includes(search));
            const MAX_RENDER = 500;
            const displayCount = Math.min(filtered.length, MAX_RENDER);
            document.getElementById('logCount').textContent = `显示 ${displayCount} / ${filtered.length} 条${filtered.length > MAX_RENDER ? '（仅显示前500条，请使用筛选缩小范围）' : ''}`;
            if (filtered.length === 0) {
                document.getElementById('logContent').innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-secondary)">无匹配日志</div>';
                return;
            }
            // 只渲染前MAX_RENDER条，避免DOM过大卡顿
            let html = '';
            for (let i = 0; i < displayCount; i++) {
                const l = filtered[i];
                html += `<div class="log-line ${l.type}"><span class="log-tag ${l.type}">${l.icon} ${l.label}</span><span style="color:var(--text-secondary);margin-right:8px">L${l.line}</span>${escapeHtml(l.text)}</div>`;
            }
            document.getElementById('logContent').innerHTML = html;
        }

        function escapeHtml(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function generateConclusion() {
            const panel = document.getElementById('conclusionPanel');
            const content = document.getElementById('conclusionContent');
            if (!panel || !content || allLogs.length === 0) {
                if (panel) panel.style.display = 'none';
                return;
            }
            panel.style.display = 'block';

            // 统计各类型数量
            const counts = {};
            Object.keys(PATTERNS).forEach(t => counts[t] = 0);
            allLogs.forEach(l => counts[l.type]++);
            const total = allLogs.length;

            // 提取具体问题并聚合
            const issueExtractors = [
                {
                    name: '死机/崩溃',
                    type: 'crash',
                    color: '#ff3b30',
                    icon: '💥',
                    patterns: [
                        {regex: /watchdog.*?timeout|watchdog.*?reset/i, label: '看门狗超时复位'},
                        {regex: /kernel\s*panic|panic/i, label: '内核Panic'},
                        {regex: /hardfault|hard\s*fault/i, label: '硬件错误(HardFault)'},
                        {regex: /busfault|bus\s*fault/i, label: '总线错误(BusFault)'},
                        {regex: /memfault|mem\s*fault/i, label: '内存管理错误(MemFault)'},
                        {regex: /assert.*?fail|assertion.*?fail/i, label: '断言失败'},
                        {regex: /null\s*pointer|nullptr/i, label: '空指针异常'},
                        {regex: /deadlock/i, label: '死锁'},
                        {regex: /abort/i, label: '程序中止(Abort)'},
                        {regex: /死机|崩溃/i, label: '死机/崩溃'},
                    ]
                },
                {
                    name: '异常重启',
                    type: 'reboot',
                    color: '#ff9500',
                    icon: '🔄',
                    patterns: [
                        {regex: /reboot|restart/i, label: '系统重启'},
                        {regex: /reset|warm\s*boot|cold\s*boot/i, label: '系统复位'},
                        {regex: /shutdown|power\s*on/i, label: '关机/上电'},
                        {regex: /重启|复位/i, label: '重启/复位'},
                    ]
                },
                {
                    name: '内存问题',
                    type: 'memory',
                    color: '#af52de',
                    icon: '💾',
                    patterns: [
                        {regex: /out\s*of\s*memory|oom/i, label: '内存溢出(OOM)'},
                        {regex: /memory\s*leak|leak/i, label: '内存泄漏'},
                        {regex: /malloc\s*fail|alloc\s*fail/i, label: '内存分配失败(Malloc Fail)'},
                        {regex: /heap\s*overflow/i, label: '堆溢出'},
                        {regex: /stack\s*overflow/i, label: '栈溢出'},
                        {regex: /内存|泄漏/i, label: '内存/泄漏'},
                    ]
                },
                {
                    name: '功耗/电量',
                    type: 'power',
                    color: '#5ac8fa',
                    icon: '🔋',
                    patterns: [
                        {regex: /battery\s*drain|耗电快|掉电快/i, label: '电量消耗过快'},
                        {regex: /low\s*battery|电量低|电池电量低/i, label: '低电量警告'},
                        {regex: /sleep\s*current|休眠电流/i, label: '休眠电流异常'},
                        {regex: /battery\s*level|battery\s*percentage|电量/i, label: '电量状态'},
                        {regex: /battery\s*voltage|电压/i, label: '电池电压'},
                        {regex: /battery\s*current|电流/i, label: '电池电流'},
                        {regex: /charging|充电/i, label: '充电状态'},
                        {regex: /discharging|放电/i, label: '放电状态'},
                        {regex: /power\s*consumption|功耗/i, label: '功耗异常'},
                        {regex: /pmic|power\s*management/i, label: '电源管理'},
                        {regex: /掉电|漏电|续航/i, label: '掉电/漏电/续航'},
                    ]
                },
                {
                    name: '通用错误',
                    type: 'error',
                    color: '#ff9500',
                    icon: '❌',
                    patterns: [
                        {regex: /error|错误/i, label: '通用错误'},
                        {regex: /exception|异常/i, label: '异常'},
                        {regex: /fail|failed|失败/i, label: '操作失败'},
                        {regex: /fault|故障/i, label: '故障'},
                        {regex: /timeout|超时/i, label: '超时'},
                        {regex: /semaphore|信号量/i, label: '信号量问题'},
                    ]
                },
                {
                    name: '警告信息',
                    type: 'warning',
                    color: '#ffcc00',
                    icon: '⚠️',
                    patterns: [
                        {regex: /warn|warning|警告/i, label: '警告'},
                        {regex: /deprecated|废弃/i, label: '废弃接口'},
                        {regex: /注意/i, label: '注意'},
                    ]
                }
            ];

            // 提取具体问题
            const detailedIssues = [];
            for (const category of issueExtractors) {
                if (counts[category.type] === 0) continue;
                const typeLogs = allLogs.filter(l => l.type === category.type);
                const subIssues = [];
                for (const pat of category.patterns) {
                    const matched = typeLogs.filter(l => pat.regex.test(l.text));
                    if (matched.length > 0) {
                        // 提取具体错误信息（取前3个不同的日志示例）
                        const examples = [];
                        const seen = new Set();
                        for (const log of matched) {
                            // 简化日志内容，提取关键部分
                            let simplified = log.text;
                            // 移除时间戳前缀
                            simplified = simplified.replace(/^\s*[\d\-:\s\.\/]+\s*/, '');
                            // 移除过长内容
                            if (simplified.length > 120) simplified = simplified.substring(0, 120) + '...';
                            if (!seen.has(simplified)) {
                                seen.add(simplified);
                                examples.push({line: log.line, text: simplified});
                            }
                            if (examples.length >= 3) break;
                        }
                        subIssues.push({
                            label: pat.label,
                            count: matched.length,
                            examples: examples
                        });
                    }
                }
                // 如果没有匹配到具体子类型，归为"其他"
                if (subIssues.length === 0) {
                    const examples = [];
                    const seen = new Set();
                    for (const log of typeLogs.slice(0, 10)) {
                        let simplified = log.text.replace(/^\s*[\d\-:\s\.\/]+\s*/, '');
                        if (simplified.length > 120) simplified = simplified.substring(0, 120) + '...';
                        if (!seen.has(simplified)) {
                            seen.add(simplified);
                            examples.push({line: log.line, text: simplified});
                        }
                        if (examples.length >= 3) break;
                    }
                    subIssues.push({
                        label: '其他' + category.name,
                        count: typeLogs.length,
                        examples: examples
                    });
                }
                subIssues.sort((a, b) => b.count - a.count);
                detailedIssues.push({
                    ...category,
                    total: counts[category.type],
                    subIssues: subIssues
                });
            }

            // 风险等级评估
            let riskLevel = '低';
            let riskColor = '#34c759';
            if (counts.crash > 0 || counts.memory > 5) {
                riskLevel = '高';
                riskColor = '#ff3b30';
            } else if (counts.reboot > 3 || counts.error > 20 || counts.power > 5) {
                riskLevel = '中';
                riskColor = '#ff9500';
            }

            // 生成具体问题详情HTML
            let detailedIssuesHtml = '';
            for (const issue of detailedIssues) {
                detailedIssuesHtml += `
                    <div style="margin-bottom:16px;padding:12px;background:var(--bg-card);border-radius:8px;border-left:4px solid ${issue.color};">
                        <div style="font-weight:bold;font-size:15px;margin-bottom:8px;color:${issue.color};">
                            ${issue.icon} ${issue.name}：${issue.total}条
                        </div>
                        <div style="margin-left:8px;">
                `;
                for (const sub of issue.subIssues) {
                    detailedIssuesHtml += `
                        <div style="margin-bottom:10px;">
                            <div style="font-weight:500;margin-bottom:4px;">
                                • ${sub.label}：<span style="color:${issue.color};">${sub.count}条</span>
                            </div>
                    `;
                    if (sub.examples.length > 0) {
                        detailedIssuesHtml += `
                            <div style="margin-left:16px;font-size:12px;color:var(--text-secondary);">
                                <div style="margin-bottom:2px;">日志示例：</div>
                        `;
                        for (const ex of sub.examples) {
                            detailedIssuesHtml += `
                                <div style="padding:4px 8px;background:var(--bg-secondary);border-radius:4px;margin-bottom:2px;word-break:break-all;">
                                    L${ex.line}: ${escapeHtml(ex.text)}
                                </div>
                            `;
                        }
                        detailedIssuesHtml += `</div>`;
                    }
                    detailedIssuesHtml += `</div>`;
                }
                detailedIssuesHtml += `</div></div>`;
            }

            // 根因分析
            let rootCauseHtml = '';
            const rootCauses = [];
            if (counts.crash > 0) {
                const crashIssue = detailedIssues.find(i => i.type === 'crash');
                if (crashIssue) {
                    const topCrash = crashIssue.subIssues[0];
                    rootCauses.push(`<strong>死机/崩溃根因</strong>：最主要问题是「${topCrash.label}」(${topCrash.count}条)，可能由硬件异常、驱动Bug或资源竞争导致，建议优先排查该问题的触发条件和上下文。`);
                }
            }
            if (counts.reboot > 3) {
                const rebootIssue = detailedIssues.find(i => i.type === 'reboot');
                if (rebootIssue) {
                    const topReboot = rebootIssue.subIssues[0];
                    rootCauses.push(`<strong>异常重启根因</strong>：最主要是「${topReboot.label}」(${topReboot.count}次)，需确认是正常重启还是异常复位，检查重启前是否有死机、电源异常或看门狗超时。`);
                }
            }
            if (counts.memory > 0) {
                const memIssue = detailedIssues.find(i => i.type === 'memory');
                if (memIssue) {
                    const topMem = memIssue.subIssues[0];
                    rootCauses.push(`<strong>内存问题根因</strong>：最主要是「${topMem.label}」(${topMem.count}条)，可能存在内存泄漏、缓冲区溢出或内存不足，需检查malloc/free配对和内存使用趋势。`);
                }
            }
            if (counts.power > 0) {
                const powerIssue = detailedIssues.find(i => i.type === 'power');
                if (powerIssue) {
                    const topPower = powerIssue.subIssues[0];
                    rootCauses.push(`<strong>功耗/电量根因</strong>：最主要是「${topPower.label}」(${topPower.count}条)，可能存在休眠电流偏高、异常唤醒、外设未关闭或电源管理配置问题，建议测量实际电流并对比规格书。`);
                }
            }
            if (counts.error > 20) {
                rootCauses.push(`<strong>通用错误根因</strong>：错误数量较多(${counts.error}条)，需查看具体错误类型，可能是接口调用失败、超时或参数错误导致。`);
            }
            if (rootCauses.length > 0) {
                rootCauseHtml = `
                    <div style="margin-bottom:16px;">
                        <div style="font-weight:bold;font-size:15px;margin-bottom:8px;">🔍 根因分析：</div>
                        <ul style="margin:0;padding-left:20px;line-height:1.8;">
                            ${rootCauses.map(r => `<li>${r}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            // 改进建议
            let suggestions = [];
            if (counts.crash > 0) {
                const crashIssue = detailedIssues.find(i => i.type === 'crash');
                if (crashIssue && crashIssue.subIssues.length > 0) {
                    suggestions.push(`优先排查「${crashIssue.subIssues[0].label}」问题，抓取crash dump和复位原因寄存器，定位具体出错位置和触发条件`);
                } else {
                    suggestions.push('优先排查死机/崩溃问题，抓取crash dump和复位原因寄存器，定位具体出错位置');
                }
            }
            if (counts.memory > 0) suggestions.push('开启内存检测工具（如内存越界检测、内存泄漏追踪），检查malloc/free配对和缓冲区大小');
            if (counts.reboot > 3) suggestions.push('记录重启前的最后日志，增加复位原因寄存器打印，区分正常复位和异常复位');
            if (counts.power > 0) {
                suggestions.push('使用功耗仪测量休眠电流和工作电流，对比规格书确认是否超标');
                suggestions.push('检查唤醒源配置（GPIO/RTC/Timer），确认是否有异常唤醒导致无法进入低功耗模式');
                suggestions.push('检查外设电源域管理（GPS/蓝牙/屏幕/传感器），确认未使用时是否正确关闭');
            }
            if (total > 100) suggestions.push('日志量较大，建议增加日志分级输出，减少非关键信息打印，提升系统性能');
            if (suggestions.length === 0) suggestions.push('当前日志异常较少，建议持续观察，定期检查日志趋势');

            // 组装结论
            content.innerHTML = `
                <div style="margin-bottom:16px;">
                    <strong>📊 总体评估：</strong>共检测到 <strong style="color:${riskColor};font-size:16px;">${total}</strong> 条异常日志，风险等级：<strong style="color:${riskColor};">${riskLevel}</strong>
                    ${counts.crash > 0 ? '，存在<strong style="color:#ff3b30;">死机/崩溃</strong>严重问题' : ''}
                    ${counts.memory > 0 ? '，存在<strong style="color:#af52de;">内存异常</strong>' : ''}
                    ${counts.power > 0 ? '，存在<strong style="color:#5ac8fa;">功耗/电量异常</strong>' : ''}
                </div>
                ${rootCauseHtml}
                <div style="margin-bottom:16px;">
                    <div style="font-weight:bold;font-size:15px;margin-bottom:8px;">📋 具体问题详情：</div>
                    ${detailedIssuesHtml}
                </div>
                <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">
                    <strong>💡 改进建议：</strong>
                    <ol style="margin:8px 0;padding-left:20px;line-height:1.8;">
                        ${suggestions.map(s => `<li>${s}</li>`).join('')}
                    </ol>
                </div>
            `;
        }

        function analyzePastedLog() {
            const text = document.getElementById('pasteArea').value;
            if (!text.trim()) { showToast('请先粘贴日志内容', 'warning'); return; }
            document.getElementById('fileName').textContent = '📋 粘贴内容';
            document.getElementById('fileSize').textContent = (text.length / 1024).toFixed(1) + ' KB';
            document.getElementById('fileInfo').style.display = 'flex';
            analyzeLog(text);
        }

        function exportLogs() {
            if (allLogs.length === 0) { showToast('暂无日志可导出', 'warning'); return; }
            const search = document.getElementById('searchBox').value.toLowerCase();
            let filtered = allLogs;
            if (currentFilter !== 'all') filtered = filtered.filter(l => l.type === currentFilter);
            if (search) filtered = filtered.filter(l => l.text.toLowerCase().includes(search));
            const lines = filtered.map(l => `[${l.label}] L${l.line}: ${l.text}`);

            // 统计摘要
            const counts = {};
            Object.keys(PATTERNS).forEach(t => counts[t] = 0);
            allLogs.forEach(l => counts[l.type]++);

            const conclusionText = `
=== 分析结论 ===
异常总数: ${allLogs.length}
各类型统计:
  - 死机/崩溃: ${counts.crash}条
  - 异常重启: ${counts.reboot}次
  - 内存问题: ${counts.memory}条
  - 功耗异常: ${counts.power}条
  - 通用错误: ${counts.error}条
  - 警告信息: ${counts.warning}条

风险等级: ${counts.crash > 0 || counts.memory > 5 ? '高' : (counts.reboot > 3 || counts.error > 20 ? '中' : '低')}

`;
            const header = `日志分析报告\n生成时间: ${new Date().toLocaleString()}\n${'='.repeat(60)}\n${conclusionText}=== 异常日志详情 (共${filtered.length}条) ===\n\n`;
            const blob = new Blob([header + lines.join('\n')], {type: 'text/plain;charset=utf-8'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `log_analysis_${Date.now()}.txt`;
            a.click(); URL.revokeObjectURL(url);
            showToast('已导出 ' + filtered.length + ' 条日志（含分析结论）', 'success');
        }

        function resetUpload() {
            allLogs = [];
            document.getElementById('fileInfo').style.display = 'none';
            document.getElementById('analysis').style.display = 'none';
            document.getElementById('emptyState').style.display = 'block';
            document.getElementById('fileInput').value = '';
        }
    </script>
