<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鏃ュ織鍒嗘瀽鍣?/title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>馃攳</text></svg>">
    <link rel="stylesheet" href="/static/css/theme.css?v={{ STATIC_VERSION }}">
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg-primary); min-height: 100vh; color: var(--text-primary); }
        .header { background: rgba(255,255,255,0.72);  padding: 24px 30px; border-bottom: 1px solid var(--border); position: relative; }
        .header h1 { font-size: 28px; font-weight: 600; background: #1d1d1f; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .header p { color: var(--text-secondary); margin-top: 4px; font-size: 14px; }
        .back-btn { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-card); cursor: pointer; font-size: 14px; color: var(--text-primary); text-decoration: none; }
        .container { max-width: 1200px; margin: 24px auto; padding: 0 20px; }
        .upload-zone { border: 2px dashed var(--border-strong); border-radius: 16px; padding: 40px; text-align: center; cursor: pointer; transition: all 0.3s; background: var(--bg-card); margin-bottom: 20px; }
        .upload-zone:hover, .upload-zone.dragover { border-color: #7c3aed; background: rgba(124,58,237,0.05); }
        .upload-zone-icon { font-size: 48px; margin-bottom: 12px; }
        .upload-zone-text { font-size: 16px; }
        .upload-zone-hint { font-size: 13px; color: var(--text-secondary); margin-top: 6px; }
        .file-info { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--bg-card); border-radius: 12px; margin-bottom: 16px; border: 1px solid var(--border); }
        .file-info-name { flex: 1; font-size: 14px; font-weight: 500; }
        .file-info-btn { padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-primary); cursor: pointer; font-size: 13px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat-card { background: var(--bg-card); border-radius: 12px; padding: 16px; border: 1px solid var(--border); text-align: center; }
        .stat-icon { font-size: 24px; margin-bottom: 6px; }
        .stat-value { font-size: 24px; font-weight: 700; }
        .stat-label { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
        .stat-card.crash .stat-value { color: #ef4444; }
        .stat-card.reboot .stat-value { color: #f59e0b; }
        .stat-card.memory .stat-value { color: #8b5cf6; }
        .stat-card.power .stat-value { color: #0ea5e9; }
        .stat-card.error .stat-value { color: #f97316; }
        .filters { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
        .filter-btn { padding: 8px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-card); cursor: pointer; font-size: 13px; transition: all 0.2s; }
        .filter-btn.active { background: #1d1d1f; color: #fff; border-color: transparent; }
        .search-box { flex: 1; min-width: 200px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-primary); font-size: 13px; }
        .log-panel { background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; }
        .log-header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .log-title { font-size: 14px; font-weight: 600; }
        .log-count { font-size: 12px; color: var(--text-secondary); }
        .log-content { max-height: 500px; overflow-y: auto; padding: 12px 20px; font-family: 'SF Mono', Consolas, monospace; font-size: 12px; line-height: 1.7; }
        .log-line { padding: 4px 8px; border-radius: 4px; margin-bottom: 2px; white-space: pre-wrap; word-break: break-all; }
        .log-line.crash { background: rgba(239,68,68,0.1); border-left: 3px solid #ef4444; }
        .log-line.reboot { background: rgba(245,158,11,0.1); border-left: 3px solid #f59e0b; }
        .log-line.memory { background: rgba(139,92,246,0.1); border-left: 3px solid #8b5cf6; }
        .log-line.power { background: rgba(14,165,233,0.1); border-left: 3px solid #0ea5e9; }
        .log-line.error { background: rgba(249,115,22,0.1); border-left: 3px solid #f97316; }
        .log-line.warning { background: rgba(234,179,8,0.08); border-left: 3px solid #eab308; }
        .log-tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; margin-right: 6px; color: #fff; }
        .log-tag.crash { background: #ef4444; }
        .log-tag.reboot { background: #f59e0b; }
        .log-tag.memory { background: #8b5cf6; }
        .log-tag.power { background: #0ea5e9; }
        .log-tag.error { background: #f97316; }
        .log-tag.warning { background: #eab308; color: #000; }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
        .empty-state-icon { font-size: 56px; margin-bottom: 16px; }
        .timeline { background: var(--bg-card); border-radius: 16px; padding: 20px; border: 1px solid var(--border); margin-bottom: 16px; }
        .timeline-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
        .timeline-bar { display: flex; height: 24px; border-radius: 6px; overflow: hidden; background: var(--border); }
        .timeline-seg { height: 100%; transition: width 0.3s; }
        @media (max-width: 768px) {
            .header { padding: 20px 16px; padding-left: 60px; }
            .header h1 { font-size: 22px; }
            .container { padding: 0 14px; }
            .stats-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
<link rel="stylesheet" href="/static/css/v5-glass.css?v={{ STATIC_VERSION }}">
<link rel="stylesheet" href="/static/css/ux-enhancements.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/de-ai.css?v={{ STATIC_VERSION }}"><link rel="stylesheet" href="/static/css/components.css?v={{ STATIC_VERSION }}">    <link rel="stylesheet" href="/static/css/mobile.css?v={{ STATIC_VERSION }}">

    <link rel="stylesheet" href="/static/css/design-system.css?v={{ STATIC_VERSION }}">
</head>
<body>
{% include '_navbar.html' %}

    <div class="container">
        <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
            <div class="upload-zone-icon">馃搫</div>
            <div class="upload-zone-text">鐐瑰嚮鎴栨嫋鎷戒笂浼犳棩蹇楁枃浠?/div>
            <div class="upload-zone-hint">鏀寔 .log / .txt / .zip锛堣嚜鍔ㄨВ鍘媧ip涓殑鏃ュ織鏂囦欢锛夛紝鑷姩璇嗗埆姝绘満銆侀噸鍚€佸唴瀛樸€佸姛鑰椼€侀敊璇瓑寮傚父</div>
            <input type="file" id="fileInput" accept=".log,.txt,.zip" style="display:none" onchange="handleFile(this.files[0])">
        </div>
        <div style="text-align:center;margin:12px 0;color:var(--text-secondary);font-size:13px;">鎴?/div>
        <div class="paste-section" style="background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px;">
            <div style="font-size:14px;font-weight:600;margin-bottom:10px;">馃搵 绮樿创鏃ュ織鍐呭</div>
            <textarea id="pasteArea" style="width:100%;min-height:120px;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--bg-secondary);color:var(--text-primary);font-family:monospace;font-size:12px;resize:vertical;" placeholder="鍦ㄦ绮樿创璁惧鏃ュ織鍐呭锛屾敮鎸佸琛?.."></textarea>
            <div style="margin-top:10px;display:flex;gap:8px;">
                <button class="action-btn" onclick="analyzePastedLog()" style="flex:1;">馃攳 鍒嗘瀽绮樿创鍐呭</button>
                <button class="action-btn" onclick="document.getElementById('pasteArea').value=''" style="flex:0 0 auto;">娓呯┖</button>
            </div>
        </div>
        <div id="fileInfo" style="display:none" class="file-info">
            <span id="fileName" class="file-info-name"></span>
            <span id="fileSize" style="font-size:12px;color:var(--text-secondary)"></span>
            <button class="file-info-btn" onclick="resetUpload()">閲嶆柊涓婁紶</button>
        </div>
        <div id="analysis" style="display:none">
            <div class="stats-grid" id="statsGrid"></div>
            <div class="conclusion-panel" id="conclusionPanel" style="display:none;background: #fff;border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
                    <h3 style="font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;">馃搵 鍒嗘瀽缁撹</h3>
                    <button id="aiAnalyzeBtn" class="action-btn" onclick="runAiAnalyze()" style="padding:6px 14px;font-size:13px;background:#000;color:#fff;border:none;border-radius:8px;cursor:pointer;">馃 AI 鏅鸿兘鍒嗘瀽</button>
                </div>
                <div id="conclusionContent" style="font-size:14px;line-height:1.8;color:var(--text-primary);"></div>
                <div id="aiResultSection" style="display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
                        <h4 style="font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;">馃 AI 娣卞害鍒嗘瀽</h4>
                        <div style="display:flex;gap:6px;">
                            <button class="action-btn" onclick="copyAiResult()" style="padding:4px 10px;font-size:12px;background:#000;color:#fff;border:none;border-radius:6px;cursor:pointer;">馃搵 澶嶅埗</button>
                            <button class="action-btn" onclick="runAiAnalyze()" style="padding:4px 10px;font-size:12px;background:#000;color:#fff;border:none;border-radius:6px;cursor:pointer;">馃攧 閲嶆柊鐢熸垚</button>
                        </div>
                    </div>
                    <div id="aiResultContent" style="font-size:13px;line-height:1.8;color:var(--text-primary);background:var(--bg-card);padding:14px;border-radius:10px;border:1px solid var(--border);white-space:pre-wrap;word-break:break-word;"></div>
                </div>
            </div>
            <div class="timeline">
                <div class="timeline-title">寮傚父绫诲瀷鍒嗗竷</div>
                <div class="timeline-bar" id="timelineBar"></div>
            </div>
            <div class="filters">
                <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">鍏ㄩ儴</button>
                <button class="filter-btn" data-filter="crash" onclick="setFilter('crash')">馃挜 姝绘満</button>
                <button class="filter-btn" data-filter="reboot" onclick="setFilter('reboot')">馃攧 閲嶅惎</button>
                <button class="filter-btn" data-filter="memory" onclick="setFilter('memory')">馃捑 鍐呭瓨</button>
                <button class="filter-btn" data-filter="power" onclick="setFilter('power')">馃攱 鍔熻€?/button>
                <button class="filter-btn" data-filter="error" onclick="setFilter('error')">鉂?閿欒</button>
                <button class="filter-btn" data-filter="warning" onclick="setFilter('warning')">鈿狅笍 璀﹀憡</button>
                <input type="text" class="search-box" id="searchBox" placeholder="鎼滅储鏃ュ織鍐呭..." oninput="renderLogs()">
            </div>
            <div class="log-panel">
                <div class="log-header">
                    <span class="log-title">寮傚父鏃ュ織</span>
                    <span class="log-count" id="logCount"></span>
                    <button class="action-btn" style="padding:4px 12px;font-size:12px;margin-left:auto;" onclick="exportLogs()">馃摜 瀵煎嚭</button>
                </div>
                <div class="log-content" id="logContent"></div>
            </div>
        </div>
        <div id="emptyState" class="empty-state">
            <div class="empty-state-icon">馃攳</div>
            <p>涓婁紶璁惧鏃ュ織鍚庤嚜鍔ㄥ垎鏋愬紓甯?/p>
        </div>
    </div>
    <script>
        let allLogs = [], currentFilter = 'all';
        const PATTERNS = {
            crash: {regex: /(panic|fatal|kernel\s*panic|watchdog|hardfault|busfault|memfault|姝绘満|crash|abort)/i, label: '姝绘満', icon: '馃挜'},
            reboot: {regex: /(reboot|restart|reset|warm\s*boot|cold\s*boot|shutdown|power\s*on|閲嶅惎)/i, label: '閲嶅惎', icon: '馃攧'},
            memory: {regex: /(memory\s*leak|out\s*of\s*memory|oom|heap\s*overflow|stack\s*overflow|malloc\s*fail|鍐呭瓨|娉勬紡)/i, label: '鍐呭瓨', icon: '馃捑'},
            power: {regex: /(power\s*consumption|battery\s*drain|low\s*battery|sleep\s*current|battery\s*level|battery\s*percentage|battery\s*capacity|battery\s*voltage|battery\s*current|charging|discharging|charge\s*level|power\s*management|pmic|鍔熻€梶鎺夌數|婕忕數|鐢垫祦寮傚父|鐢甸噺|鑰楃數|鐢垫睜|鍏呯數|鏀剧數|鐢垫祦|鐢靛帇|缁埅|鎺夌數蹇珅鑰楃數蹇珅鐢甸噺浣巪鐢垫睜鐢甸噺)/i, label: '鍔熻€?, icon: '馃攱'},
            error: {regex: /(\berror\b|exception|assert|fail|failed|fault|閿欒|寮傚父)/i, label: '閿欒', icon: '鉂?},
            warning: {regex: /(\bwarn\b|warning|deprecated|娉ㄦ剰|璀﹀憡)/i, label: '璀﹀憡', icon: '鈿狅笍'},
        };

        const uploadZone = document.getElementById('uploadZone');
        uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
        uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
        uploadZone.addEventListener('drop', e => { e.preventDefault(); uploadZone.classList.remove('dragover'); if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });

        async function handleFile(file) {
            if (!file) return;
            document.getElementById('fileName').textContent = '馃搫 ' + file.name;
            document.getElementById('fileSize').textContent = (file.size/1024).toFixed(1) + ' KB';
            document.getElementById('fileInfo').style.display = 'flex';

            const isZip = file.name.toLowerCase().endsWith('.zip') || file.type === 'application/zip' || file.type === 'application/x-zip-compressed';

            if (isZip) {
                if (typeof JSZip === 'undefined') {
                    alert('JSZip搴撴湭鍔犺浇锛岃鍒锋柊椤甸潰閲嶈瘯');
                    return;
                }
                try {
                    document.getElementById('fileName').textContent = '馃摝 ' + file.name + ' (瑙ｅ帇涓?..)';
                    const zip = await JSZip.loadAsync(file);
                    const logFiles = [];
                    zip.forEach((relativePath, zipEntry) => {
                        if (!zipEntry.dir && /\.(log|txt|text)$/i.test(relativePath)) {
                            logFiles.push({ path: relativePath, entry: zipEntry });
                        }
                    });
                    if (logFiles.length === 0) {
                        alert('ZIP鏂囦欢涓湭鎵惧埌 .log 鎴?.txt 鏂囦欢');
                        return;
                    }
                    let allContent = '';
                    for (const lf of logFiles) {
                        const content = await lf.entry.async('string');
                        allContent += `\n===== ${lf.path} =====\n` + content + '\n';
                    }
                    document.getElementById('fileName').textContent = '馃摝 ' + file.name + ` (${logFiles.length}涓棩蹇楁枃浠?`;
                    analyzeLog(allContent);
                } catch (e) {
                    alert('ZIP瑙ｅ帇澶辫触: ' + e.message);
                }
            } else {
                const reader = new FileReader();
                reader.onload = e => analyzeLog(e.target.result);
                reader.readAsText(file);
            }
        }

        function analyzeLog(text) {
            const lines = text.split(/\r?\n/);
            allLogs = [];
            const totalLines = lines.length;
            // 澶ф枃浠舵彁绀?
            if (totalLines > 50000) {
                if (!confirm(`鏃ュ織鏂囦欢杈冨ぇ锛?{totalLines}琛岋級锛屽垎鏋愬彲鑳介渶瑕佽緝闀挎椂闂淬€傛槸鍚︾户缁紵`)) {
                    resetUpload();
                    return;
                }
            }
            // 鏄剧ず杩涘害
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('analysis').style.display = 'block';
            const progressDiv = document.createElement('div');
            progressDiv.id = 'analyzeProgress';
            progressDiv.style.cssText = 'text-align:center;padding:40px;color:var(--text-secondary);';
            progressDiv.innerHTML = `<div style="font-size:16px;margin-bottom:12px;">鈴?姝ｅ湪鍒嗘瀽鏃ュ織...</div><div style="font-size:13px;">宸插鐞?0 / ${totalLines} 琛?/div><div style="width:60%;margin:16px auto;height:6px;background:var(--bg-secondary);border-radius:3px;overflow:hidden;"><div id="progressBar" style="height:100%;width:0%;background: #fff;transition:width 0.2s;"></div></div>`;
            document.getElementById('logContent').innerHTML = '';
            document.getElementById('logContent').appendChild(progressDiv);

            // 鍒嗘壒澶勭悊锛屾瘡鎵?000琛岋紝閬垮厤闃诲UI
            const BATCH_SIZE = 2000;
            let idx = 0;
            const patternList = Object.entries(PATTERNS);

            function processBatch() {
                const end = Math.min(idx + BATCH_SIZE, totalLines);
                for (; idx < end; idx++) {
                    const line = lines[idx];
                    if (!line || !line.trim()) continue;
                    for (const [type, pat] of patternList) {
                        if (pat.regex.test(line)) {
                            allLogs.push({line: idx+1, text: line.trim(), type: type, label: pat.label, icon: pat.icon});
                            break;
                        }
                    }
                }
                // 鏇存柊杩涘害
                const bar = document.getElementById('progressBar');
                if (bar) bar.style.width = (idx / totalLines * 100) + '%';
                const progressText = progressDiv.querySelector('div:nth-child(2)');
                if (progressText) progressText.textContent = `宸插鐞?${idx} / ${totalLines} 琛岋紙鍙戠幇 ${allLogs.length} 鏉″紓甯革級`;

                if (idx < totalLines) {
                    // 璁╁嚭涓荤嚎绋嬶紝閬垮厤鍗￠】
                    setTimeout(processBatch, 0);
                } else {
                    // 鍒嗘瀽瀹屾垚
                    progressDiv.remove();
                    renderStats();
                    renderTimeline();
                    renderLogs();
                    generateConclusion();
                }
            }
            processBatch();
        }

        function renderStats() {
            const counts = {};
            Object.keys(PATTERNS).forEach(t => counts[t] = 0);
            allLogs.forEach(l => counts[l.type]++);
            const total = allLogs.length;
            document.getElementById('statsGrid').innerHTML =
                `<div class="stat-card"><div class="stat-icon">馃搳</div><div class="stat-value">${total}</div><div class="stat-label">寮傚父鎬绘暟</div></div>` +
                Object.entries(PATTERNS).map(([t,p]) =>
                    `<div class="stat-card ${t}"><div class="stat-icon">${p.icon}</div><div class="stat-value">${counts[t]}</div><div class="stat-label">${p.label}</div></div>`
                ).join('');
        }

        function renderTimeline() {
            const counts = {};
            Object.keys(PATTERNS).forEach(t => counts[t] = 0);
            allLogs.forEach(l => counts[l.type]++);
            const total = allLogs.length || 1;
            const colors = {crash:'#ef4444', reboot:'#f59e0b', memory:'#8b5cf6', power:'#0ea5e9', error:'#f97316', warning:'#eab308'};
            document.getElementById('timelineBar').innerHTML = Object.entries(counts)
                .filter(([_,c]) => c > 0)
                .map(([t,c]) => `<div class="timeline-seg" style="width:${c/total*100}%;background:${colors[t]}" title="${PATTERNS[t].label}: ${c}"></div>`).join('');
        }

        function setFilter(f) {
            currentFilter = f;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
            renderLogs();
        }

        function renderLogs() {
            const search = document.getElementById('searchBox').value.toLowerCase();
            let filtered = allLogs;
            if (currentFilter !== 'all') filtered = filtered.filter(l => l.type === currentFilter);
            if (search) filtered = filtered.filter(l => l.text.toLowerCase().includes(search));
            const MAX_RENDER = 500;
            const displayCount = Math.min(filtered.length, MAX_RENDER);
            document.getElementById('logCount').textContent = `鏄剧ず ${displayCount} / ${filtered.length} 鏉?{filtered.length > MAX_RENDER ? '锛堜粎鏄剧ず鍓?00鏉★紝璇蜂娇鐢ㄧ瓫閫夌缉灏忚寖鍥达級' : ''}`;
            if (filtered.length === 0) {
                document.getElementById('logContent').innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-secondary)">鏃犲尮閰嶆棩蹇?/div>';
                return;
            }
            // 鍙覆鏌撳墠MAX_RENDER鏉★紝閬垮厤DOM杩囧ぇ鍗￠】
            let html = '';

  - 鍔熻€楀紓甯? ${counts.power}鏉?
  - 閫氱敤閿欒: ${counts.error}鏉?
  - 璀﹀憡淇℃伅: ${counts.warning}鏉?

椋庨櫓绛夌骇: ${counts.crash > 0 || counts.memory > 5 ? '楂? : (counts.reboot > 3 || counts.error > 20 ? '涓? : '浣?)}

`;
            const header = `鏃ュ織鍒嗘瀽鎶ュ憡\n鐢熸垚鏃堕棿: ${new Date().toLocaleString()}\n${'='.repeat(60)}\n${conclusionText}=== 寮傚父鏃ュ織璇︽儏 (鍏?{filtered.length}鏉? ===\n\n`;
            const blob = new Blob([header + lines.join('\n')], {type: 'text/plain;charset=utf-8'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `log_analysis_${Date.now()}.txt`;
            a.click(); URL.revokeObjectURL(url);
            showToast('宸插鍑?' + filtered.length + ' 鏉℃棩蹇楋紙鍚垎鏋愮粨璁猴級', 'success');
        }

        function resetUpload() {
            allLogs = [];
            document.getElementById('fileInfo').style.display = 'none';
            document.getElementById('analysis').style.display = 'none';
            document.getElementById('emptyState').style.display = 'block';
            document.getElementById('fileInput').value = '';
            document.getElementById('aiResultSection').style.display = 'none';
        }

        // ==================== AI 鏅鸿兘鍒嗘瀽 ====================

        function buildLogAiPayload() {
            // 缁熻鎽樿
            const counts = {};
            Object.keys(PATTERNS).forEach(t => counts[t] = 0);
            allLogs.forEach(l => counts[l.type]++);
            const total = allLogs.length;
            const statsSummary = [
                `寮傚父鎬绘暟: ${total} 鏉,
                `姝绘満/宕╂簝: ${counts.crash} 鏉,
                `寮傚父閲嶅惎: ${counts.reboot} 娆,
                `鍐呭瓨闂: ${counts.memory} 鏉,
                `鍔熻€楀紓甯? ${counts.power} 鏉,
                `閫氱敤閿欒: ${counts.error} 鏉,
                `璀﹀憡淇℃伅: ${counts.warning} 鏉,
            ].join('\n');

            // 鍓?0鏉″叧閿紓甯革紙鎸変弗閲嶇▼搴︽帓搴忥細crash > memory > reboot > power > error > warning锛?
            const severityOrder = ['crash', 'memory', 'reboot', 'power', 'error', 'warning'];
            const sortedLogs = [...allLogs].sort((a, b) => {
                const sa = severityOrder.indexOf(a.type);
                const sb = severityOrder.indexOf(b.type);
                if (sa !== sb) return sa - sb;
                return a.line - b.line;
            });
            const topAnomalies = sortedLogs.slice(0, 50).map(l =>
                `[${l.label}] L${l.line}: ${l.text.substring(0, 200)}`
            ).join('\n');

            return { stats_summary: statsSummary, key_anomalies: topAnomalies };
        }

        async function runAiAnalyze() {
            if (allLogs.length === 0) {
                showToast('璇峰厛鍒嗘瀽鏃ュ織', 'warning');
                return;
            }
            const btn = document.getElementById('aiAnalyzeBtn');
            const resultSection = document.getElementById('aiResultSection');
            const resultContent = document.getElementById('aiResultContent');

            btn.disabled = true;
            btn.textContent = '鈴?AI 姝ｅ湪鍒嗘瀽...';
            btn.style.opacity = '0.7';
            resultSection.style.display = 'block';
            resultContent.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-secondary);">鈴?AI 姝ｅ湪鍒嗘瀽锛岃绋嶅€?..</div>';

            const payload = buildLogAiPayload();
            try {
                const resp = await fetch('/api/log-ai-analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await resp.json();
                if (data.error) {
                    resultContent.innerHTML = `<div style="color:#ef4444;padding:12px;">鉂?${escapeHtml(data.error)}</div>`;
                } else {
                    resultContent.textContent = data.result || '锛堟棤鍒嗘瀽缁撴灉锛?;
                }
            } catch (e) {
                resultContent.innerHTML = `<div style="color:#ef4444;padding:12px;">鉂?璇锋眰澶辫触: ${escapeHtml(e.message)}</div>`;
            } finally {
                btn.disabled = false;
                btn.textContent = '馃 AI 鏅鸿兘鍒嗘瀽';
                btn.style.opacity = '1';
            }
        }

        function copyAiResult() {
            const content = document.getElementById('aiResultContent').textContent;
            if (!content || content.includes('AI 姝ｅ湪鍒嗘瀽')) {
                showToast('鏆傛棤鍒嗘瀽缁撴灉鍙鍒?, 'warning');
                return;
            }
            navigator.clipboard.writeText(content).then(() => {
                showToast('宸插鍒跺埌鍓创鏉?, 'success');
            }).catch(() => {
                // 闄嶇骇鏂规
                const ta = document.createElement('textarea');
                ta.value = content;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast('宸插鍒跺埌鍓创鏉?, 'success');
            });
        }
    </script>
