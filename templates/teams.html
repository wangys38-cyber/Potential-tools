<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>团队</title>
    <link rel="stylesheet" href="/static/css/theme.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/ux-enhancements.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/de-ai.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/components.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/mobile.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/design-system.css?v={{ STATIC_VERSION }}">
    
<link rel="stylesheet" href="/static/css/page/teams.css?v={{ STATIC_VERSION }}">
</head>
<body>
{% include '_navbar.html' %}

<div class="team-container">
    <div class="team-header">
        <div class="team-title">团队</div>
        <button class="team-btn" onclick="PTTeams.openCreateModal()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            创建团队
        </button>
    </div>

    <div id="ptTeamList">
        <div class="team-empty">加载中...</div>
    </div>
</div>

<div class="modal-overlay" id="ptCreateTeamModal">
    <div class="modal-box">
        <div class="modal-title">创建团队</div>
        <label class="modal-label">团队名称</label>
        <input type="text" class="modal-input" id="ptTeamNameInput" placeholder="输入团队名称" maxlength="100">
        <label class="modal-label">团队描述</label>
        <input type="text" class="modal-input" id="ptTeamDescInput" placeholder="可选，简要描述团队用途">
        <div class="modal-actions">
            <button class="modal-btn cancel" onclick="PTTeams.closeCreateModal()">取消</button>
            <button class="modal-btn confirm" id="ptCreateTeamBtn" onclick="PTTeams.submitCreate()">创建</button>
        </div>
    </div>
</div>


<script src="/static/js/page/teams.js?v={{ STATIC_VERSION }}"></script>
</body>
</html>
