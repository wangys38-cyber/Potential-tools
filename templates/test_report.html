<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试报告分析工具</title>
    <style>
        :root {
            --bg-primary: #f0f2f5;
            --bg-card: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #6b7280;
            --text-tertiary: #9ca3af;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --border: #e5e7eb;
            --border-strong: #d1d5db;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 24px 32px;
            border-radius: var(--radius-lg);
            margin-bottom: 20px;
            color: white;
            box-shadow: var(--shadow-md);
        }
        .header h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
        .header .subtitle { font-size: 14px; opacity: 0.9; }
        
        /* Card */
        .card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 28px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        /* Upload */
        .upload-card {
            border: 2px dashed #c7d2fe;
            border-radius: var(--radius-lg);
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fafbff;
        }
        .upload-card:hover, .upload-card.dragover {
            border-color: var(--accent);
            background: #eef2ff;
            transform: translateY(-2px);
        }
        .upload-icon { font-size: 64px; margin-bottom: 16px; }
        .upload-card h3 { font-size: 20px; margin-bottom: 8px; color: var(--text-primary); }
        .upload-card p { color: var(--text-secondary); font-size: 14px; }
        .upload-hint { font-size: 12px; color: var(--text-tertiary); margin-top: 12px; }
        
        /* Sheet Selector */
        .sheet-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding: 14px 18px;
            background: #f9fafb;
            border-radius: var(--radius-md);
        }
        .sheet-info .file-icon { font-size: 20px; }
        .sheet-info .file-details { flex: 1; }
        .sheet-info .file-name { font-weight: 600; font-size: 14px; }
        .sheet-info .file-meta { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
        .sheet-tabs { display: flex; flex-wrap: wrap; gap: 10px; }
        .sheet-tab {
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            background: #f3f4f6;
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            font-weight: 500;
        }
        .sheet-tab:hover { background: #e5e7eb; }
        .sheet-tab.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 2px 8px rgba(79,70,229,0.3);
        }
        
        /* Info Section */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }
        .info-item {
            background: #f9fafb;
            padding: 14px 16px;
            border-radius: var(--radius-sm);
            border-left: 3px solid var(--accent);
        }
        .info-item .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
        .info-item .value { font-size: 15px; font-weight: 600; color: var(--text-primary); }
        
        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #fff;
            border: 1px solid var(--border);
            padding: 18px 12px;
            border-radius: var(--radius-md);
            text-align: center;
            transition: transform 0.2s;
        }
        .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .stat-card .number { font-size: 28px; font-weight: 700; }
        .stat-card .label { font-size: 12px; color: var(--text-secondary); margin-top: 6px; font-weight: 500; }
        .stat-card.total .number { color: var(--text-primary); }
        .stat-card.pass .number { color: var(--success); }
        .stat-card.fail .number { color: var(--danger); }
        .stat-card.rate .number { color: var(--accent); }
        .stat-card.blocker .number { color: #dc2626; }
        .stat-card.critical .number { color: #ea580c; }
        .stat-card.major .number { color: #d97706; }
        .stat-card.minor .number { color: #2563eb; }
        .stat-card.trivial .number { color: #6b7280; }
        
        /* Summary Banner */
        .summary-banner {
            background: linear-gradient(135deg, #f0f4ff 0%, #e0e7ff 100%);
            border-radius: var(--radius-md);
            padding: 20px 24px;
            margin-bottom: 24px;
            border: 1px solid #c7d2fe;
        }
        .summary-banner h4 {
            font-size: 15px;
            color: var(--accent);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .summary-banner p {
            font-size: 14px;
            color: var(--text-primary);
            line-height: 1.6;
        }
        
        /* Test Items Table */
        .table-wrapper {
            overflow-x: auto;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
        }
        .test-items-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .test-items-table th {
            background: #f9fafb;
            padding: 14px 16px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        .test-items-table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }
        .test-items-table tbody tr:hover { background: #f9fafb; }
        .test-items-table tbody tr:last-child td { border-bottom: none; }
        
        /* Result Badge */
        .result-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }
        .result-badge.pass {
            background: #d1fae5;
            color: #065f46;
        }
        .result-badge.pass::before { content: '✓'; }
        .result-badge.fail {
            background: #fee2e2;
            color: #991b1b;
        }
        .result-badge.fail::before { content: '✗'; }
        .result-badge.unknown {
            background: #f3f4f6;
            color: #4b5563;
        }
        
        /* Severity Tag */
        .severity-tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }
        .severity-tag.blocker { background: #fee2e2; color: #991b1b; }
        .severity-tag.critical { background: #ffedd5; color: #9a3412; }
        .severity-tag.major { background: #fef3c7; color: #92400e; }
        .severity-tag.minor { background: #dbeafe; color: #1e40af; }
        .severity-tag.trivial { background: #f3f4f6; color: #374151; }
        
        /* Risk Badge */
        .risk-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }
        .risk-badge.high { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
        .risk-badge.medium { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
        .risk-badge.low { background: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; }
        .risk-badge.none { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
        
        /* Result Badge (expanded) */
        .result-badge.blocked {
            background: #fef3c7;
            color: #92400e;
        }
        .result-badge.blocked::before { content: '⊘'; }
        .result-badge.delayed {
            background: #ffedd5;
            color: #9a3412;
        }
        .result-badge.delayed::before { content: '◷'; }
        .result-badge.n_a {
            background: #f3f4f6;
            color: #6b7280;
        }
        .result-badge.n_a::before { content: '—'; }
        
        /* Analysis Section */
        .analysis-section {
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            margin-bottom: 16px;
            overflow: hidden;
        }
        .analysis-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: #f9fafb;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
        }
        .analysis-section-header:hover { background: #f3f4f6; }
        .analysis-section-header .section-title {
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .analysis-section-header .section-stats {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .analysis-section-body {
            padding: 16px 18px;
            display: none;
        }
        .analysis-section-body.show { display: block; }
        .analysis-section-summary {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            line-height: 1.6;
        }
        .problem-item-list {
            list-style: none;
            padding: 0;
        }
        .problem-item-list li {
            padding: 8px 0;
            border-bottom: 1px solid #f3f4f6;
            font-size: 13px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .problem-item-list li:last-child { border-bottom: none; }
        .problem-item-name { font-weight: 600; color: var(--text-primary); }
        .problem-item-reason { color: var(--text-secondary); font-size: 12px; }
        .problem-item-target { color: var(--accent); font-size: 12px; }
        
        /* Key Findings */
        .finding-item {
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            font-size: 13px;
            line-height: 1.6;
            border-left: 3px solid;
        }
        .finding-item.high { background: #fef2f2; border-color: #ef4444; }
        .finding-item.medium { background: #fffbeb; border-color: #f59e0b; }
        .finding-item.info { background: #f0f9ff; border-color: #0ea5e9; }
        .finding-item.success { background: #f0fdf4; border-color: #10b981; }
        
        /* Recommendations */
        .recommendation-item {
            padding: 10px 16px;
            background: #f9fafb;
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            font-size: 13px;
            line-height: 1.6;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .recommendation-item::before {
            content: '→';
            color: var(--accent);
            font-weight: 700;
            flex-shrink: 0;
        }
        
        /* Overall Risk Banner */
        .risk-banner {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .risk-banner.high { background: #fee2e2; color: #991b1b; }
        .risk-banner.medium { background: #fef3c7; color: #92400e; }
        .risk-banner.low { background: #dbeafe; color: #1e40af; }
        .risk-banner.none { background: #d1fae5; color: #065f46; }
        
        /* Test Item Name */
        .test-item-name {
            font-weight: 600;
            color: var(--text-primary);
        }
        .test-item-module {
            color: var(--text-secondary);
            font-size: 13px;
        }
        
        /* Reason */
        .reason-cell {
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.5;
        }
        .reason-cell.empty {
            color: var(--text-tertiary);
            font-style: italic;
        }
        .reason-cell.fail-reason {
            color: var(--danger);
        }
        
        /* Actions */
        .actions-bar {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            justify-content: center;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 24px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary {
            background: #f3f4f6;
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover { background: #e5e7eb; }
        
        /* Loading */
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        .loading.show { display: block; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #e0e7ff;
            border-top-color: var(--accent);
            border-radius: 50%;
            margin: 0 auto 16px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading p { color: var(--text-secondary); font-size: 14px; }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: var(--text-secondary);
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
        .empty-state p { font-size: 14px; }
        
        .hidden { display: none !important; }
        
        /* Responsive */
        @media (max-width: 768px) {
            body { padding: 12px; }
            .card { padding: 20px; }
            .upload-card { padding: 40px 20px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📋 测试报告分析工具</h1>
            <div class="subtitle">上传Excel报告 → 选择Sheet页 → 查看逐项分析结果</div>
        </div>

        <!-- 上传区 -->
        <div class="card" id="uploadSection">
            <div class="card-title">📤 上传测试报告</div>
            <div class="upload-container">
                <div class="upload-card" id="uploadCard" onclick="document.getElementById('fileInput').click()">
                    <div class="upload-icon">📊</div>
                    <h3>选择或拖拽Excel文件</h3>
                    <p>支持 .xlsx, .xls 格式的测试报告</p>
                    <div class="upload-hint">点击选择文件，或将文件拖拽到此处</div>
                </div>
                <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none;">
            </div>
        </div>

        <!-- Sheet选择区 -->
        <div class="card hidden" id="sheetSection">
            <div class="card-title">📑 选择Sheet页</div>
            <div class="sheet-info" id="sheetInfo"></div>
            <div class="sheet-tabs" id="sheetTabs"></div>
            <div class="actions-bar">
                <button class="btn btn-secondary" onclick="resetAll()">🔄 重新上传</button>
            </div>
        </div>

        <!-- 分析结果区 -->
        <div id="resultSection" class="hidden">
            <!-- 项目信息 -->
            <div class="card" id="infoCard">
                <div class="card-title">📋 项目信息</div>
                <div class="info-grid" id="infoGrid"></div>
            </div>

            <!-- 测试统计 -->
            <div class="card">
                <div class="card-title">📊 测试统计</div>
                <div class="stats-grid" id="statsGrid"></div>
            </div>

            <!-- 执行摘要 -->
            <div class="card">
                <div class="card-title">📋 执行摘要</div>
                <div id="riskBannerContainer"></div>
                <div class="summary-banner" id="summaryBanner"></div>
            </div>

            <!-- 分类分析 -->
            <div class="card" id="analysisSectionsCard">
                <div class="card-title">🗂️ 分类分析</div>
                <div id="analysisSections"></div>
            </div>

            <!-- 关键发现 -->
            <div class="card" id="keyFindingsCard">
                <div class="card-title">🔍 关键发现</div>
                <div id="keyFindings"></div>
            </div>

            <!-- 改进建议 -->
            <div class="card" id="recommendationsCard">
                <div class="card-title">💡 改进建议</div>
                <div id="recommendations"></div>
            </div>

            <!-- 逐项明细 -->
            <div class="card" id="detailCard">
                <div class="card-title">📝 逐项明细</div>
                <div id="tableContainer"></div>
            </div>

            <div class="actions-bar">
                <button class="btn btn-secondary" onclick="resetAll()">🔄 重新上传</button>
            </div>
        </div>

        <!-- 加载动画 -->
        <div class="card loading" id="loadingIndicator">
            <div class="spinner"></div>
            <p>正在分析报告内容，请稍候...</p>
        </div>
    </div>

    <script>
        let currentFileId = null;
        let currentSheetName = null;
        let currentAnalysis = null;

        const fileInput = document.getElementById('fileInput');
        const uploadCard = document.getElementById('uploadCard');
        const uploadSection = document.getElementById('uploadSection');
        const sheetSection = document.getElementById('sheetSection');
        const sheetInfo = document.getElementById('sheetInfo');
        const resultSection = document.getElementById('resultSection');
        const loadingIndicator = document.getElementById('loadingIndicator');

        // 上传区域拖拽
        uploadCard.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadCard.classList.add('dragover');
        });
        uploadCard.addEventListener('dragleave', () => uploadCard.classList.remove('dragover'));
        uploadCard.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadCard.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        async function handleFile(file) {
            if (!file.name.match(/\.(xlsx|xls)$/i)) {
                alert('请选择Excel文件 (.xlsx, .xls)');
                return;
            }

            showLoading(true);
            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/test-report-analyze', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.status === 'success') {
                    currentFileId = data.data.file_id;
                    showSheetSelector(data.data);
                } else {
                    alert('上传失败: ' + (data.error || '未知错误'));
                    showLoading(false);
                    uploadSection.classList.remove('hidden');
                }
            } catch (err) {
                alert('请求失败: ' + err.message);
                showLoading(false);
                uploadSection.classList.remove('hidden');
            }
        }

        function showSheetSelector(data) {
            uploadSection.classList.add('hidden');
            sheetSection.classList.remove('hidden');
            resultSection.classList.add('hidden');

            // 显示文件信息
            sheetInfo.innerHTML = `
                <div class="file-icon">📄</div>
                <div class="file-details">
                    <div class="file-name">${escapeHtml(data.file_name)}</div>
                    <div class="file-meta">共 ${data.sheet_count} 个Sheet，请选择要分析的Sheet页</div>
                </div>
            `;

            // 显示Sheet列表
            const tabsContainer = document.getElementById('sheetTabs');
            tabsContainer.innerHTML = '';

            data.sheet_names.forEach((name) => {
                const tab = document.createElement('div');
                tab.className = 'sheet-tab';
                tab.textContent = name;
                tab.onclick = () => selectSheet(name);
                tabsContainer.appendChild(tab);
            });
        }

        async function selectSheet(sheetName) {
            currentSheetName = sheetName;

            // 更新选中状态
            document.querySelectorAll('.sheet-tab').forEach(tab => {
                tab.classList.toggle('active', tab.textContent === sheetName);
            });

            showLoading(true);

            try {
                const response = await fetch('/api/test-report-analyze-sheet', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        file_id: currentFileId,
                        sheet_name: sheetName
                    })
                });
                const data = await response.json();

                if (data.status !== 'success') {
                    throw new Error(data.error || '启动分析失败');
                }

                // 轮询后台任务状态（避免同步请求超过 Railway 5 分钟超时）
                const taskId = data.data.task_id;
                let pollCount = 0;
                const maxPolls = 280; // 约 4.5 分钟
                while (pollCount < maxPolls) {
                    await new Promise(r => setTimeout(r, 1000));
                    const statusResp = await fetch('/api/task-status', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ task_id: taskId })
                    });
                    const statusResult = await statusResp.json();

                    if (statusResult.status === 'done') {
                        currentAnalysis = statusResult.data;
                        displayResults(statusResult.data);
                        return;
                    } else if (statusResult.status === 'error') {
                        throw new Error(statusResult.error || '分析失败');
                    }
                    pollCount++;
                }
                throw new Error('分析超时，请重试');
            } catch (err) {
                alert('分析失败: ' + (err.message || '未知错误'));
                showLoading(false);
                sheetSection.classList.remove('hidden');
            }
        }

        function displayResults(data) {
            sheetSection.classList.add('hidden');
            resultSection.classList.remove('hidden');

            // 显示项目信息
            renderProjectInfo(data.project_info);
            
            // 显示统计
            renderStats(data.stats);
            
            // 显示执行摘要（含风险等级）
            renderSummary(data);
            
            // 显示分类分析
            renderAnalysisSections(data.analysis);
            
            // 显示关键发现
            renderKeyFindings(data.analysis);
            
            // 显示改进建议
            renderRecommendations(data.analysis);
            
            // 显示逐项明细
            renderTestItems(data.test_items);
        }

        function renderProjectInfo(info) {
            const grid = document.getElementById('infoGrid');
            grid.innerHTML = '';

            if (!info || Object.keys(info).length === 0) {
                grid.innerHTML = '<div style="color:var(--text-tertiary);">未识别到项目信息</div>';
                return;
            }

            Object.entries(info).forEach(([label, value]) => {
                const item = document.createElement('div');
                item.className = 'info-item';
                item.innerHTML = `
                    <div class="label">${escapeHtml(label)}</div>
                    <div class="value">${escapeHtml(value)}</div>
                `;
                grid.appendChild(item);
            });
        }

        function renderStats(stats) {
            const grid = document.getElementById('statsGrid');
            grid.innerHTML = '';

            const total = stats.total || 0;
            const pass = stats.pass || 0;
            const fail = stats.fail || 0;
            const blocked = stats.blocked || 0;
            const delayed = stats.delayed || 0;
            const unknown = stats.unknown || 0;
            const executed = stats.executed || 0;
            const passRate = stats.pass_rate || '0%';
            const executedPassRate = stats.executed_pass_rate || '0%';

            const items = [
                { key: 'total', label: '总测试项', value: total, cls: 'total' },
                { key: 'executed', label: '已执行', value: executed, cls: 'total' },
                { key: 'pass', label: '通过', value: pass, cls: 'pass' },
                { key: 'fail', label: '不通过', value: fail, cls: 'fail' },
            ];

            if (blocked > 0) items.push({ key: 'blocked', label: '阻塞', value: blocked, cls: 'critical' });
            if (delayed > 0) items.push({ key: 'delayed', label: '已延期', value: delayed, cls: 'major' });
            if (unknown > 0) items.push({ key: 'unknown', label: '未识别', value: unknown, cls: 'trivial' });

            items.push({ key: 'rate', label: '通过率', value: passRate, cls: 'rate' });
            if (executed < total && executed > 0) {
                items.push({ key: 'exec_rate', label: '已执行通过率', value: executedPassRate, cls: 'rate' });
            }

            // Severity统计
            const severity = stats.severity || {};
            const severityLabels = {
                blocker: 'Blocker',
                critical: 'Critical',
                major: 'Major',
                minor: 'Minor',
                trivial: 'Trivial'
            };
            
            ['blocker', 'critical', 'major', 'minor', 'trivial'].forEach(level => {
                if (severity[level]) {
                    items.push({
                        key: level,
                        label: severityLabels[level],
                        value: severity[level],
                        cls: level
                    });
                }
            });

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'stat-card ' + item.cls;
                card.innerHTML = `
                    <div class="number">${item.value}</div>
                    <div class="label">${item.label}</div>
                `;
                grid.appendChild(card);
            });
        }

        function renderSummary(data) {
            const banner = document.getElementById('summaryBanner');
            const riskContainer = document.getElementById('riskBannerContainer');
            const stats = data.stats;
            const total = stats.total || 0;
            const analysis = data.analysis || {};

            if (total === 0) {
                riskContainer.innerHTML = '';
                banner.innerHTML = `
                    <h4>📋 分析总结</h4>
                    <p>未找到测试项数据，请检查Excel文件格式是否正确。</p>
                `;
                return;
            }

            // 渲染整体风险等级横幅
            const overallRisk = analysis.overall_risk || '无';
            const riskClassMap = { '高': 'high', '中': 'medium', '低': 'low', '无': 'none' };
            const riskIconMap = { '高': '🔴', '中': '🟡', '低': '🔵', '无': '🟢' };
            const riskCls = riskClassMap[overallRisk] || 'none';
            riskContainer.innerHTML = `
                <div class="risk-banner ${riskCls}">
                    ${riskIconMap[overallRisk] || '🟢'} 整体风险等级：${overallRisk}
                </div>
            `;

            // 使用智能分析生成的执行摘要
            const execSummary = analysis.executive_summary || '';
            banner.innerHTML = `
                <h4>📋 执行摘要</h4>
                <p>${escapeHtml(execSummary)}</p>
            `;
        }

        function renderAnalysisSections(analysis) {
            const container = document.getElementById('analysisSections');
            container.innerHTML = '';

            if (!analysis || !analysis.sections || analysis.sections.length === 0) {
                container.innerHTML = '<div style="color:var(--text-tertiary);text-align:center;padding:20px;">无分类分析数据</div>';
                return;
            }

            const riskClassMap = { '高': 'high', '中': 'medium', '低': 'low', '无': 'none' };

            analysis.sections.forEach((section, idx) => {
                const riskCls = riskClassMap[section.risk_level] || 'none';
                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'analysis-section';

                // 统计文本
                let statsText = `通过率 ${section.pass_rate}`;
                if (section.fail > 0) statsText += ` · 不通过 ${section.fail}`;
                if (section.delayed > 0) statsText += ` · 延期 ${section.delayed}`;
                if (section.blocked > 0) statsText += ` · 阻塞 ${section.blocked}`;

                let bodyHtml = `<div class="analysis-section-summary">${escapeHtml(section.summary)}</div>`;

                // 问题项列表
                if (section.problem_items && section.problem_items.length > 0) {
                    bodyHtml += '<ul class="problem-item-list">';
                    section.problem_items.forEach(pi => {
                        const statusLabel = getStatusLabel(pi.result);
                        bodyHtml += `<li>
                            <span class="result-badge ${pi.result}" style="flex-shrink:0;">${statusLabel}</span>
                            <div>
                                <div class="problem-item-name">${escapeHtml(pi.name)}</div>
                                ${pi.reason ? `<div class="problem-item-reason">${escapeHtml(pi.reason)}</div>` : ''}
                                ${pi.target || pi.actual ? `<div class="problem-item-target">目标: ${escapeHtml(pi.target || '-')} | 实测: ${escapeHtml(pi.actual || '-')}</div>` : ''}
                            </div>
                        </li>`;
                    });
                    bodyHtml += '</ul>';
                } else if (section.pass === section.total) {
                    bodyHtml += '<div style="color:var(--success);font-size:13px;padding:8px 0;">✓ 全部通过</div>';
                }

                sectionDiv.innerHTML = `
                    <div class="analysis-section-header" onclick="this.nextElementSibling.classList.toggle('show')">
                        <div class="section-title">
                            <span class="risk-badge ${riskCls}">${section.risk_level}</span>
                            ${escapeHtml(section.category)}
                        </div>
                        <div class="section-stats">
                            <span>${statsText}</span>
                            <span style="color:var(--text-tertiary);">共 ${section.total} 项</span>
                        </div>
                    </div>
                    <div class="analysis-section-body">
                        ${bodyHtml}
                    </div>
                `;

                // 默认展开高风险项
                if (section.risk_level === '高') {
                    sectionDiv.querySelector('.analysis-section-body').classList.add('show');
                }

                container.appendChild(sectionDiv);
            });
        }

        function renderKeyFindings(analysis) {
            const container = document.getElementById('keyFindings');
            container.innerHTML = '';

            if (!analysis || !analysis.key_findings || analysis.key_findings.length === 0) {
                container.innerHTML = '<div style="color:var(--text-tertiary);text-align:center;padding:20px;">无关键发现</div>';
                return;
            }

            analysis.key_findings.forEach(finding => {
                const item = document.createElement('div');
                let cls = 'info';
                if (finding.includes('【高风险】')) cls = 'high';
                else if (finding.includes('【中风险】')) cls = 'medium';
                else if (finding.includes('【达标项】')) cls = 'success';
                item.className = 'finding-item ' + cls;
                item.textContent = finding;
                container.appendChild(item);
            });
        }

        function renderRecommendations(analysis) {
            const container = document.getElementById('recommendations');
            container.innerHTML = '';

            if (!analysis || !analysis.recommendations || analysis.recommendations.length === 0) {
                container.innerHTML = '<div style="color:var(--text-tertiary);text-align:center;padding:20px;">暂无建议</div>';
                return;
            }

            analysis.recommendations.forEach(rec => {
                const item = document.createElement('div');
                item.className = 'recommendation-item';
                item.textContent = rec;
                container.appendChild(item);
            });
        }

        function getStatusLabel(result) {
            const labels = {
                'pass': '通过',
                'fail': '不通过',
                'blocked': '阻塞',
                'delayed': '已延期',
                'n_a': '不适用',
                'unknown': '未识别'
            };
            return labels[result] || result;
        }

        function renderTestItems(items) {
            const container = document.getElementById('tableContainer');
            
            if (!items || items.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>未找到测试项数据</p>
                        <p style="font-size:12px;margin-top:8px;">请确保Excel文件包含测试项表格</p>
                    </div>
                `;
                return;
            }

            // 排序：不通过 > 延期 > 阻塞 > 通过 > 其他
            const resultOrder = { 'fail': 0, 'delayed': 1, 'blocked': 2, 'unknown': 3, 'n_a': 4, 'pass': 5 };
            const sorted = [...items].sort((a, b) => {
                const orderA = resultOrder[a.result] !== undefined ? resultOrder[a.result] : 3;
                const orderB = resultOrder[b.result] !== undefined ? resultOrder[b.result] : 3;
                if (orderA !== orderB) return orderA - orderB;
                // 不通过项按严重程度排序
                if (a.result === 'fail' && b.result === 'fail') {
                    const severityOrder = { blocker: 0, critical: 1, major: 2, minor: 3, trivial: 4 };
                    const sevA = getSeverityLevel(a.severity);
                    const sevB = getSeverityLevel(b.severity);
                    return severityOrder[sevA] - severityOrder[sevB];
                }
                return 0;
            });

            let html = `
                <div class="table-wrapper">
                    <table class="test-items-table">
                        <thead>
                            <tr>
                                <th style="width:50px;">#</th>
                                <th>测试项</th>
                                <th>模块</th>
                                <th>Severity</th>
                                <th>结果</th>
                                <th>原因/备注</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            sorted.forEach((item, idx) => {
                const resultBadge = getResultBadge(item);
                const severityTag = getSeverityTag(item.severity);
                const reason = item.reason || '';
                const isProblem = item.result === 'fail' || item.result === 'delayed' || item.result === 'blocked';
                
                html += `
                    <tr>
                        <td style="color:var(--text-tertiary);">${idx + 1}</td>
                        <td><span class="test-item-name">${escapeHtml(item.name)}</span></td>
                        <td><span class="test-item-module">${escapeHtml(item.module) || '-'}</span></td>
                        <td>${severityTag}</td>
                        <td>${resultBadge}</td>
                        <td>${reason ? `<span class="reason-cell ${isProblem ? 'fail-reason' : ''}">${escapeHtml(reason)}</span>` : '<span class="reason-cell empty">-</span>'}</td>
                    </tr>
                `;
            });

            html += '</tbody></table></div>';
            container.innerHTML = html;
        }

        function getResultBadge(item) {
            const result = item.result || 'unknown';
            const statusLabels = {
                'pass': '通过',
                'fail': '不通过',
                'blocked': '阻塞',
                'delayed': '已延期',
                'n_a': '不适用',
                'unknown': '未识别'
            };
            const label = statusLabels[result] || item.result_text || result;

            if (result === 'pass') {
                return `<span class="result-badge pass">${label}</span>`;
            } else if (result === 'fail') {
                return `<span class="result-badge fail">${label}</span>`;
            } else if (result === 'blocked') {
                return `<span class="result-badge blocked">${label}</span>`;
            } else if (result === 'delayed') {
                return `<span class="result-badge delayed">${label}</span>`;
            } else if (result === 'n_a') {
                return `<span class="result-badge n_a">${label}</span>`;
            }
            return `<span class="result-badge unknown">${escapeHtml(item.result_text || label)}</span>`;
        }

        function getSeverityTag(severity) {
            if (!severity) return '<span style="color:var(--text-tertiary);">-</span>';
            
            const cls = getSeverityClass(severity);
            const label = severity.charAt(0).toUpperCase() + severity.slice(1);
            
            return `<span class="severity-tag ${cls}">${escapeHtml(label)}</span>`;
        }

        function getSeverityClass(severity) {
            if (!severity) return '';
            const sev = severity.toLowerCase();
            if (sev.includes('blocker')) return 'blocker';
            if (sev.includes('critical')) return 'critical';
            if (sev.includes('major')) return 'major';
            if (sev.includes('minor')) return 'minor';
            if (sev.includes('trivial')) return 'trivial';
            return '';
        }

        function getSeverityLevel(severity) {
            if (!severity) return 'trivial';
            const sev = severity.toLowerCase();
            if (sev.includes('blocker')) return 'blocker';
            if (sev.includes('critical')) return 'critical';
            if (sev.includes('major')) return 'major';
            if (sev.includes('minor')) return 'minor';
            if (sev.includes('trivial')) return 'trivial';
            return 'trivial';
        }

        function showLoading(show) {
            if (show) {
                loadingIndicator.classList.add('show');
                uploadSection.classList.add('hidden');
                sheetSection.classList.add('hidden');
                resultSection.classList.add('hidden');
            } else {
                loadingIndicator.classList.remove('show');
            }
        }

        function resetAll() {
            currentFileId = null;
            currentSheetName = null;
            currentAnalysis = null;
            fileInput.value = '';
            uploadSection.classList.remove('hidden');
            sheetSection.classList.add('hidden');
            resultSection.classList.add('hidden');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }
    </script>
</body>
</html>
