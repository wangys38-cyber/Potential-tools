<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试报告分析工具</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%231d1d1f%22 stroke-width=%222%22><rect x=%223%22 y=%223%22 width=%2218%22 height=%2218%22 rx=%222%22/><path d=%22M9 9h6v6H9z%22/></svg>">
    <link rel="stylesheet" href="/static/css/theme.css?v={{ STATIC_VERSION }}">
    <link rel="stylesheet" href="/static/css/test_report.css?v={{ STATIC_VERSION }}">

<link rel="stylesheet" href="/static/css/ux-enhancements.css?v={{ STATIC_VERSION }}">
<style>
    /* 页面标题区 - 玻璃拟态 */
    .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        padding: 24px 28px;
        margin: 20px 0;
        background: rgba(255, 255, 255, 0.85);
        
        -webkit-
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        flex-wrap: wrap;
    }
    .page-title {
        font-size: 24px;
        font-weight: 800;
        color: #1a1a2e;
        margin: 0 0 4px 0;
    }
    .page-subtitle {
        font-size: 13px;
        color: rgba(0, 0, 0, 0.5);
        margin: 0;
    }
    .page-action-btn {
        white-space: nowrap;
    }
    @media (max-width: 600px) {
        .page-header {
            flex-direction: column;
            align-items: stretch;
            text-align: center;
        }
        .page-actions {
            display: flex;
            justify-content: center;
        }
    }
</style>
    <link rel="stylesheet" href="/static/css/de-ai.css?v={{ STATIC_VERSION }}"><link rel="stylesheet" href="/static/css/components.css?v={{ STATIC_VERSION }}">    <link rel="stylesheet" href="/static/css/mobile.css?v={{ STATIC_VERSION }}">

    <link rel="stylesheet" href="/static/css/design-system.css?v={{ STATIC_VERSION }}">
</head>
<body>
{% include '_navbar.html' %}

    <div class="container">
        <!-- 上传区 -->
        <div class="card" id="uploadSection">
            <div class="card-title">
                <span class="card-title-icon"></span>
                上传测试报告
            </div>
            <div class="upload-container">
                <div class="upload-card" id="uploadCard" onclick="document.getElementById('fileInput').click()">
                    <div class="upload-icon"></div>
                    <h3>选择或拖拽Excel文件</h3>
                    <p>支持 .xlsx, .xls 格式的测试报告</p>
                    <div class="upload-hint">点击选择文件，或将文件拖拽到此处</div>
                </div>
                <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none;">
            </div>
        </div>

        <!-- Sheet选择区 -->
        <div class="card hidden" id="sheetSection">
            <div class="card-title">
                <span class="card-title-icon"></span>
                选择Sheet页
            </div>
            <div class="sheet-info" id="sheetInfo"></div>
            <div class="sheet-tabs" id="sheetTabs"></div>
            <div class="actions-bar">
                <button class="btn btn-secondary" onclick="resetAll()"> 重新上传</button>
            </div>
        </div>

        <!-- 分析结果区 -->
        <div id="resultSection" class="hidden">
            <!-- 项目信息 -->
            <div class="card" id="infoCard">
                <div class="card-title">
                    <span class="card-title-icon"></span>
                    项目信息
                </div>
                <div class="info-grid" id="infoGrid"></div>
            </div>

            <!-- 测试统计 -->
            <div class="card">
                <div class="card-title">
                    <span class="card-title-icon"></span>
                    测试统计
                </div>
                <div class="stats-grid" id="statsGrid"></div>
            </div>

            <!-- 执行摘要 -->
            <div class="card">
                <div class="card-title">
                    <span class="card-title-icon"></span>
                    执行摘要
                </div>
                <div id="riskBannerContainer"></div>
                <div class="summary-banner" id="summaryBanner"></div>
            </div>

            <!-- 分类分析 -->
            <div class="card" id="analysisSectionsCard">
                <div class="card-title">
                    <span class="card-title-icon"></span>
                    分类分析
                </div>
                <div id="analysisSections"></div>
            </div>

            <!-- 关键发现 -->
            <div class="card" id="keyFindingsCard">
                <div class="card-title">
                    <span class="card-title-icon"></span>
                    关键发现
                </div>
                <div id="keyFindings"></div>
            </div>

            <!-- 改进建议 -->
            <div class="card" id="recommendationsCard">
                <div class="card-title">
                    <span class="card-title-icon"></span>
                    改进建议
                </div>
                <div id="recommendations"></div>
            </div>

            <!-- v3.0 AI 深度分析 -->
            <div class="card" id="aiAnalysisCard" style="border: 2px solid var(--accent); position: relative;">
                <div class="card-title">
                    <span class="card-title-icon"></span>
                    AI 深度分析
                    <span style="font-size: 12px; color: var(--text-tertiary); margin-left: 8px; font-weight: normal;">v3.0 新功能</span>
                </div>
                <div id="aiAnalysisContent" style="min-height: 60px;">
                    <div style="text-align: center; padding: 20px;">
                        <button class="btn btn-primary" id="aiAnalysisBtn" onclick="generateAIAnalysis()" style="background: var(--accent);">
                             生成 AI 深度分析
                        </button>
                        <div style="font-size: 12px; color: var(--text-tertiary); margin-top: 8px;">
                            AI 将基于测试数据生成风险洞察和改进建议
                        </div>
                    </div>
                </div>
            </div>

            <!-- 逐项明细 -->
            <div class="card" id="detailCard">
                <div class="card-title">
                    <span class="card-title-icon"></span>
                    逐项明细
                </div>
                <div id="tableContainer"></div>
            </div>

            <div class="actions-bar">
                <button class="btn btn-primary" id="downloadPdfBtn" onclick="downloadPdf()"> 下载PDF报告</button>
                <button class="btn btn-primary" id="saveReportBtn" onclick="saveReport()" style="background:#10b981;display:none;"> 保存报告</button>
                <div class="saved-reports-btn" style="position:relative;display:none;" id="savedReportsBtnWrap">
                    <button class="btn btn-secondary" onclick="toggleSavedReports()"> 我的报告</button>
                    <div class="saved-reports-dropdown" id="savedReportsDropdown"></div>
                </div>
                <button class="btn btn-secondary" onclick="resetAll()"> 重新上传</button>
            </div>
        </div>

        <!-- 加载动画（带进度步骤） -->
        <div class="card loading-card" id="loadingIndicator">
            <div class="loading-spinner-container">
                <div class="loading-spinner"></div>
                <div class="loading-spinner-inner"></div>
            </div>
            <p class="loading-text" id="loadingText">正在分析报告内容</p>
            <p class="loading-subtext" id="loadingSubtext">请稍候，正在解析您的测试数据...</p>
            <div class="loading-progress-bar">
                <div class="loading-progress-fill" id="loadingProgressFill"></div>
            </div>
            <div class="loading-steps" id="loadingSteps">
                <div class="loading-step" data-step="0">
                    <span class="loading-step-dot"></span>
                    <span>读取Excel文件</span>
                </div>
                <div class="loading-step" data-step="1">
                    <span class="loading-step-dot"></span>
                    <span>识别测试项数据</span>
                </div>
                <div class="loading-step" data-step="2">
                    <span class="loading-step-dot"></span>
                    <span>分类与风险评估</span>
                </div>
                <div class="loading-step" data-step="3">
                    <span class="loading-step-dot"></span>
                    <span>生成智能分析报告</span>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/test_report.js?v={{ STATIC_VERSION }}"></script>
    <script>window._USER_PREFIX='{% if current_user %}u{{ current_user.id }}_{% endif %}';</script>
    <!-- 全局导航栏已在页面顶部注入 -->
    <script src="/static/js/components.js?v={{ STATIC_VERSION }}"></script>
<script src="/static/js/v5-ux.js?v={{ STATIC_VERSION }}"></script>
<script src="/static/js/v5-sync.js?v={{ STATIC_VERSION }}"></script>
<script src="/static/js/ux-enhancements.js?v={{ STATIC_VERSION }}"></script>
</body>
</html>
